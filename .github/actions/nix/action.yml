name: Nix with a cached store
description: Install Nix and restore or save the devShell closure with the GitHub Actions cache.

inputs:
  cache:
    description: Restore and save the Nix store in the Actions cache; release jobs turn it off so they never read a cache written by other workflows.
    default: 'true'

runs:
  using: composite
  steps:
    # The runner's preinstalled toolchains fill the disk before goreleaser builds; no job here uses them.
    - name: Free disk space
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
        df -h /

    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Cache the Nix store
      if: inputs.cache == 'true'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        # No purge: it needs actions: write; this limit and GitHub's 7-day eviction bound the cache.
        gc-max-store-size-linux: 5G

    # Garbage collection would delete the devShell closure and the flake inputs: root both until the cache is saved.
    - name: Keep the devShell and the flake inputs out of garbage collection
      if: inputs.cache == 'true'
      shell: bash
      run: |
        nix develop --profile "$RUNNER_TEMP/devshell" --command true
        mkdir "$RUNNER_TEMP/inputs"
        nix flake archive --json | jq -r '.. | .path? // empty' | while read -r p; do
          nix-store --add-root "$RUNNER_TEMP/inputs/${p##*/}" --realise "$p" > /dev/null
        done
