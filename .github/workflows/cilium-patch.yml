name: Cilium patch

# Ichor pins the Cilium chart it embeds; a new upstream patch reaches users through an Ichor release.
# This turns a new patch of the pinned minor into a pull request (hack/bump-cilium-patch.sh, CONTRIBUTING.md).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cilium-patch
  cancel-in-progress: false

jobs:
  # Runs the bump script, which fetches from the network, and the repository's tests and linter: no write token here.
  # The change leaves as a patch artifact; the pr job applies it and holds the write permissions.
  bump:
    permissions:
      contents: read
    name: Bump the embedded Cilium chart
    outputs:
      old: ${{ steps.bump.outputs.old }}
      new: ${{ steps.bump.outputs.new }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # make test runs the README version guard, which reads the release tags and their history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix

      - name: Cache the Go tools in bin/
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only what the Makefile installs; bin/ also holds build outputs that must not come back stale.
          path: |
            bin/kustomize*
            bin/controller-gen*
            bin/setup-envtest*
            bin/golangci-lint*
            bin/k8s
          key: bin-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Makefile', '.custom-gcl.yml') }}

      # Exits 0 without a change when the pinned chart is already the newest patch of its minor; refuses
      # (non-zero, no change) when the images of the new patch are not signed by Cilium's release workflow.
      - name: Move the pins to the newest patch
        id: bump
        run: nix develop --command hack/bump-cilium-patch.sh

      # The gates test.yml and lint.yml run, so the pull request is opened only for a change that passes
      # them. A red run here is the signal that this patch needs a person.
      - name: Running Tests
        if: steps.bump.outputs.new != ''
        run: nix develop --command make test

      - name: Run linter
        if: steps.bump.outputs.new != ''
        run: nix develop --command make lint

      # What the pull request commits, as one patch (binary and new files included).
      - name: Keep the change as a patch
        if: steps.bump.outputs.new != ''
        run: |
          nix develop --command git add -A -- .gitignore Makefile README.md THIRD-PARTY-NOTICES docs pkg/cni/cilium pkg/release/compat.go test/e2e/foreign/cilium_test.go test/internal/foreign/foreign.go
          nix develop --command git diff --cached --binary > "$RUNNER_TEMP/cilium-bump.patch"

      - name: Upload the patch
        if: steps.bump.outputs.new != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cilium-bump-patch
          path: ${{ runner.temp }}/cilium-bump.patch
          if-no-files-found: error
          retention-days: 1

  # Holds the write token and runs no repository code: it applies the patch and hands it to create-pull-request.
  # A pull request opened with the default GITHUB_TOKEN does not trigger Tests, Lint and PR Title: GitHub creates
  # their runs but leaves them waiting in action_required until a person approves them. Set the CILIUM_PATCH_PR_TOKEN
  # secret (a fine-grained token with contents and pull requests write) to have them run as on any other pull request.
  pr:
    name: Open the pull request
    needs: bump
    if: needs.bump.outputs.new != ''
    permissions:
      contents: write # push the branch of the pull request
      pull-requests: write # open it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cilium-bump-patch
          path: ${{ runner.temp }}

      - name: Apply the patch
        run: git apply "$RUNNER_TEMP/cilium-bump.patch"

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CILIUM_PATCH_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/cilium-patch
          sign-commits: true
          add-paths: |
            .gitignore
            Makefile
            README.md
            THIRD-PARTY-NOTICES
            docs
            pkg/cni/cilium
            pkg/release/compat.go
            test/e2e/foreign/cilium_test.go
            test/internal/foreign/foreign.go
          commit-message: "chore(cni): bump the embedded Cilium chart to ${{ needs.bump.outputs.new }}"
          title: "chore(cni): bump the embedded Cilium chart to ${{ needs.bump.outputs.new }}"
          body: |
            Moves the Cilium chart Ichor embeds from ${{ needs.bump.outputs.old }} to ${{ needs.bump.outputs.new }}, the newest patch of the same minor.

            Upstream release notes: https://github.com/cilium/cilium/releases/tag/v${{ needs.bump.outputs.new }}

            Checked by `hack/bump-cilium-patch.sh` before it wrote anything:

            - the chart archive matches the digest in https://helm.cilium.io/index.yaml (`make cilium-chart` verifies it again);
            - the agent, operator-generic and hubble-relay images the chart pins are signed by the Cilium release workflow of tag v${{ needs.bump.outputs.new }} (cosign, keyless);
            - Cilium tests this minor with the same Kubernetes versions as before, so `pkg/release/compat.go` still holds.

            Changed: the pin and digest in the Makefile, the `go:embed` line and `ChartVersion` in `pkg/cni/cilium`, the chart archive, the bootstrap goldens (`make cilium-goldens`) and the version named in the README, the guides and the foreign-cluster hardware tests. `make test` and `make lint` passed on this change.

            Merging does not move any cluster: a cluster's Cilium only moves to the chart embedded in the running Ichor, so this reaches users with the next Ichor release (CONTRIBUTING.md, "Cilium patch bumps").
          delete-branch: true

  # A red scheduled run is seen by nobody; keep one open issue that links the latest failed run.
  report:
    name: Report a failed run
    needs: [bump, pr]
    if: failure()
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Cilium patch bot failed"
          body="The scheduled Cilium patch run failed: $RUN_URL"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
