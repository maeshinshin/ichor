name: Docs

# Builds the documentation site (docs/ rendered by site/) and
# publishes it to GitHub Pages at https://ichor.maesh.dev/.
# One run builds every version: main as /next/ and each minor line vX.Y as /vX.Y/
# (docs/ of the branch release-X.Y, else of the newest tag vX.Y.*, built with main's site/),
# plus versions.json, the /latest/ redirects and a redirect from each old /vX.Y.Z/ path
# (make docs-site-all), and the Helm repository at /charts/
# (each release's signed chart, pulled from ghcr). A new tag publishes after its
# Release run succeeds, so the chart exists, and adds itself to the version switcher
# of every older build. A push to a release-X.Y branch republishes its docs without a tag: Pages takes
# deployments from main only, so that push runs the republish job, which dispatches this workflow on main.
on:
  push:
    branches: [main, "release-*"]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push replaces a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    # Only main, a dispatch (which the republish job sends for main) and a successful Release build here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Always main's code (a tag run must not build with the tag's site/, which older tags lack) and
      # all tags, which are the versions.
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix

      # For next and each release tag: npm ci, astro build, the internal link check and the Pagefind
      # index; then versions.json (from the v* tags, newest first by semver) and the redirects, into site/dist-all.
      - name: Build
        run: nix develop --command make docs-site-all

      # The release's own archives, so the digests baked into them stay; a tag whose chart is not in
      # ghcr (no release, a failed publish) is skipped. The index is written even when empty, so
      # `helm repo add` works before the first release.
      - name: Helm repository
        run: |
          nix develop --command bash -euo pipefail <<'EOF'
          mkdir -p site/dist-all/charts
          for tag in $(git tag -l "v*"); do
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            helm pull oci://ghcr.io/maeshinshin/charts/ichor --version "${tag#v}" -d site/dist-all/charts \
              || echo "::warning::no chart for $tag in ghcr, left out of the Helm repository"
          done
          helm repo index site/dist-all/charts --url https://ichor.maesh.dev/charts
          EOF

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist-all

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A release-X.Y push cannot deploy (Pages takes main only), so it asks GitHub to run this workflow on main.
  # That run is a workflow_dispatch, which this condition excludes, so nothing chains.
  republish:
    name: Run the docs on main after a release-branch push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # create the workflow_dispatch run on main; the only permission this job has
    steps:
      - name: Dispatch the workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main
