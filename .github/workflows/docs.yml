name: Docs

# Builds the documentation site (docs/ rendered by site/, ADR 0132) and
# publishes it to GitHub Pages at https://maeshinshin.github.io/ichor/.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "CHANGELOG.md" # the version badge reads its newest heading
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push replaces a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      # npm ci, astro build, the internal link check, then the Pagefind index, into site/dist.
      - name: Build
        run: nix develop --command make docs-site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
