name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    # A cold run (no Go caches) takes about 30 minutes; the cache is only saved by a run that finishes.
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix

      - name: Cache the Go tools in bin/
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only what the Makefile installs; bin/ also holds build outputs that must not come back stale.
          path: |
            bin/kustomize*
            bin/controller-gen*
            bin/setup-envtest*
            bin/golangci-lint*
            bin/k8s
          key: bin-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Makefile', '.custom-gcl.yml') }}

      - name: Cache Go modules and builds
        uses: ./.github/actions/go-cache
        with:
          name: lint

      - name: Check linter configuration
        run: nix develop --command make lint-config
      - name: Run linter
        run: nix develop --command make lint

      - name: Check the workflows
        run: nix develop --command actionlint

  goreleaser:
    permissions:
      contents: read
    name: Build a goreleaser snapshot
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix

      # The before-hooks run make build-installer, which installs kustomize and controller-gen into bin/.
      - name: Cache the Go tools in bin/
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only what the Makefile installs; bin/ also holds build outputs that must not come back stale.
          path: |
            bin/kustomize*
            bin/controller-gen*
            bin/setup-envtest*
            bin/golangci-lint*
            bin/k8s
          key: bin-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Makefile', '.custom-gcl.yml') }}

      - name: Cache Go modules and builds
        uses: ./.github/actions/go-cache
        with:
          name: goreleaser

      - name: Keep the changelog block out of the goreleaser config
        run: |
          if grep -qE '^changelog:' .goreleaser.yaml; then
            echo "::error file=.goreleaser.yaml::A top-level changelog block is back. Disabling the changelog makes goreleaser skip the pipe that reads --release-notes, which the release workflow passes, so the GitHub release body comes out empty or wrong. Remove the block; the comment above the release section says why." >&2
            exit 1
          fi

      - name: Check goreleaser configuration
        run: nix develop --command bash -c "goreleaser check"
      - name: Build a goreleaser snapshot
        run: nix develop --command bash -c "goreleaser build --snapshot --clean"
