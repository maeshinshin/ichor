name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - name: Check linter configuration
        run: nix develop --command make lint-config
      - name: Run linter
        run: nix develop --command make lint

      - name: Check the workflows
        run: nix develop --command actionlint

      - name: Check goreleaser configuration
        run: nix develop --command bash -c "goreleaser check"
      - name: Build a goreleaser snapshot
        run: nix develop --command bash -c "goreleaser build --snapshot --clean"
