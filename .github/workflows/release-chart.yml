name: Release Chart

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    name: Push the chart to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      # The chart version drops the leading v; appVersion keeps the tag, which is the image tag.
      - name: Package the chart
        env:
          TAG: ${{ github.ref_name }}
        run: nix develop --command make helm-package CHART_VERSION="${TAG#v}" APP_VERSION="${TAG}"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | nix develop --command helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Push the chart
        env:
          TAG: ${{ github.ref_name }}
        run: nix develop --command helm push "bin/chart/ichor-${TAG#v}.tgz" oci://ghcr.io/maeshinshin/charts
