name: Release Images

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    name: Push the controller, UI and installer images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | nix develop --command crane auth login ghcr.io --username "$ACTOR" --password-stdin

      # ghcr.io/maeshinshin/{ichor-controller,ichor-ui,ichor-installer}:<tag>, the names the chart
      # and the install manifest carry. linux/amd64 only, as demo-images builds.
      - name: Build and push the images
        env:
          TAG: ${{ github.ref_name }}
        run: nix develop --command make demo-images VERSION="${TAG}" REGISTRY=ghcr.io CRANE_INSECURE=
