name: Release

# One workflow for the images and the chart. A v* tag runs verify and build in parallel; publish-core waits for both, so nothing is pushed before both pass:
#   verify        the same checks as a PR (module drift, lint, tests, govulncheck, npm audit); contents: read
#   build         compiles the controller and ichor-ui images (ko) and the signature verifier; contents: read, no registry token
#   publish-core  pushes the controller and ichor-ui images and records their digests; the only registry token so far
#   installer     renders the install manifest and the chart with those digests, then compiles the installer image's
#                 binary with that manifest embedded, so a signed installer never deploys a retagged controller or UI; contents: read, no registry token, fetches Go modules
#   publish       pushes the installer and the chart by digest, signs (cosign keyless), verifies the signatures with the
#                 controller's own verifier, attaches an SBOM and a provenance attestation;
#                 runs in the protected "release" environment, as publish-core does (a required reviewer approves both)
#   cli           goreleaser builds the ichor CLI archives with the install manifest that pins those digests, signs the
#                 checksums (cosign keyless) and attaches both to the GitHub release; the only job that writes contents
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    name: Verify the tagged commit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/nix
        with:
          cache: 'false'

      - name: Verify go.mod, go.sum and the module cache
        run: nix develop --command bash -c "go mod tidy -diff && go mod verify"

      - name: Lint
        run: nix develop --command make lint-config lint

      - name: Test
        run: nix develop --command make test

      - name: UI CI (type-check, lint, unit tests, build)
        run: nix develop --command make ui-ci

      - name: govulncheck
        run: nix develop --command govulncheck ./...

      - name: npm audit (production dependencies, high and above)
        run: nix develop --command bash -c "cd ui && npm audit --omit=dev --audit-level=high"

  build:
    name: Build the controller and UI binaries
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/nix
        with:
          cache: 'false'

      # ko lays out linux/amd64 and linux/arm64 indexes on the pinned distroless base; the publish-core job pushes
      # them. The installer image is built later, once the digests of these two images exist.
      - name: Build the images
        env:
          TAG: ${{ github.ref_name }}
        run: nix develop --command make images-build-core VERSION="${TAG}"

      # The verifier the controller runs before an Ichor upgrade. It is built here, where Go modules may
      # be fetched, and run in the publish job, which fetches none.
      - name: Build the signature verifier
        run: nix develop --command env CGO_ENABLED=0 go build -trimpath -o bin/verifyimage ./internal/tools/verifyimage

      - name: Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: |
            bin/oci/
            bin/verifyimage
          retention-days: 1
          if-no-files-found: error

  publish-core:
    name: Push the controller and UI images
    needs: [verify, build]
    # The "release" environment, as in publish: create it in the repository settings with required reviewers.
    environment: release
    permissions:
      contents: read
      packages: write # push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/nix
        with:
          cache: 'false'

      - name: Download the build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: bin

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | nix develop --command crane auth login ghcr.io --username "$ACTOR" --password-stdin

      # ghcr.io/maeshinshin/{ichor-controller,ichor-ui}:<tag>. The digests land in bin/digests.txt as <repo>@<digest>.
      - name: Push the controller and UI images
        env:
          TAG: ${{ github.ref_name }}
        run: nix develop --command make images-push-core VERSION="${TAG}" REGISTRY=ghcr.io CRANE_INSECURE= DIGEST_FILE=bin/digests.txt

      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digests
          path: bin/digests.txt
          retention-days: 1
          if-no-files-found: error

  installer:
    name: Build the installer and the chart with the image digests
    needs: publish-core
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/nix
        with:
          cache: 'false'

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-digests
          path: bin

      # The install manifest names ichor-controller and ichor-ui as <repo>:<tag>@<digest> (build-installer fails
      # without their digests). The installer image embeds it.
      - name: Render the install manifest with the digests and build the installer
        env:
          TAG: ${{ github.ref_name }}
        run: nix develop --command make images-build-installer VERSION="${TAG}" IMAGE_DIGESTS=bin/digests.txt

      # The chart version drops the leading v; appVersion keeps the tag. The chart's default images carry the digests.
      - name: Package the chart
        env:
          TAG: ${{ github.ref_name }}
        run: nix develop --command make helm-package CHART_VERSION="${TAG#v}" APP_VERSION="${TAG}" IMAGE_DIGESTS=bin/digests.txt

      - name: Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installer
          path: |
            bin/oci/ichor-installer/
            bin/chart/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Push, sign and attest the installer, the chart and the images
    needs: [build, publish-core, installer]
    # Create the "release" environment in the repository settings with required reviewers (docs/design, Helm guide).
    environment: release
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign and the attestations
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/nix
        with:
          cache: 'false'

      - name: Download the build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: bin

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-digests
          path: bin

      - name: Download the installer and the chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer
          path: bin

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | nix develop --command crane auth login ghcr.io --username "$ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | nix develop --command helm registry login ghcr.io --username "$ACTOR" --password-stdin

      # ghcr.io/maeshinshin/ichor-installer:<tag>; its digest is appended to bin/digests.txt, which already holds the
      # controller's and the UI's.
      - name: Push the installer
        env:
          TAG: ${{ github.ref_name }}
        run: nix develop --command make images-push-installer VERSION="${TAG}" REGISTRY=ghcr.io CRANE_INSECURE= DIGEST_FILE=bin/digests.txt

      - name: Push the chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          nix develop --command helm push "bin/chart/ichor-${TAG#v}.tgz" oci://ghcr.io/maeshinshin/charts 2>&1 | tee bin/helm-push.txt
          echo "ghcr.io/maeshinshin/charts/ichor@$(sed -n 's/^Digest: //p' bin/helm-push.txt)" >> bin/digests.txt

      - name: Resolve the digests
        id: digests
        run: |
          for n in ichor-controller ichor-ui ichor-installer ichor; do
            ref=$(grep "/${n}@" bin/digests.txt)
            [ -n "$ref" ] || { echo "no digest for ${n}" >&2; exit 1; }
            echo "${n}=${ref#*@}" >> "$GITHUB_OUTPUT"
          done

      # Keyless: the signing identity is this workflow run, recorded in the Sigstore transparency log.
      - name: Sign the images and the chart
        run: |
          while read -r ref; do
            nix develop --command cosign sign --yes "$ref"
          done < bin/digests.txt

      # The same code and trusted root the controller uses before it creates the installer Job: a signature it
      # would refuse fails the release now, not the first upgrade.
      - name: Verify the signatures as the controller does
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x bin/verifyimage
          while read -r ref; do
            bin/verifyimage "${ref%@*}" "${ref#*@}" "${TAG}"
          done < bin/digests.txt

      # The cli job embeds these digests in the CLI's install manifest (ICHOR_IMAGE_DIGESTS).
      - name: Upload the digests of the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-digests
          path: bin/digests.txt
          retention-days: 90
          if-no-files-found: error

      - name: Generate the SBOMs
        run: |
          while read -r ref; do
            nix develop --command syft "$ref" -o "spdx-json=bin/$(basename "${ref%@*}").spdx.json"
          done < bin/digests.txt

      - name: Attest provenance, controller
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/maeshinshin/ichor-controller
          subject-digest: ${{ steps.digests.outputs.ichor-controller }}
          push-to-registry: true

      - name: Attest provenance, UI
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/maeshinshin/ichor-ui
          subject-digest: ${{ steps.digests.outputs.ichor-ui }}
          push-to-registry: true

      - name: Attest provenance, installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/maeshinshin/ichor-installer
          subject-digest: ${{ steps.digests.outputs.ichor-installer }}
          push-to-registry: true

      - name: Attest provenance, chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/maeshinshin/charts/ichor
          subject-digest: ${{ steps.digests.outputs.ichor }}
          push-to-registry: true

      - name: Attest the SBOM, controller
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/maeshinshin/ichor-controller
          subject-digest: ${{ steps.digests.outputs.ichor-controller }}
          sbom-path: bin/ichor-controller.spdx.json
          push-to-registry: true

      - name: Attest the SBOM, UI
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/maeshinshin/ichor-ui
          subject-digest: ${{ steps.digests.outputs.ichor-ui }}
          sbom-path: bin/ichor-ui.spdx.json
          push-to-registry: true

      - name: Attest the SBOM, installer
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/maeshinshin/ichor-installer
          subject-digest: ${{ steps.digests.outputs.ichor-installer }}
          sbom-path: bin/ichor-installer.spdx.json
          push-to-registry: true

  cli:
    name: Build the CLI and attach it to the release
    needs: publish
    permissions:
      contents: write # create the GitHub release and upload the assets
      id-token: write # keyless cosign of the checksums
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # goreleaser's changelog reads the history
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/nix
        with:
          cache: 'false'

      - name: Download the digests of the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image-digests
          path: bin

      - name: Build, sign the checksums and publish the CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICHOR_IMAGE_DIGESTS: bin/digests.txt
        run: nix develop --command goreleaser release --clean
