name: Test Chart

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# bash adds -o pipefail: without it a pipe hides the failure of every command but its last. The default shell is bash -e.
defaults:
  run:
    shell: bash

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMG: kind.local/ichor-controller:latest
      IMG_UI: kind.local/ichor-ui:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/nix

      - name: Cache Go modules and builds
        uses: ./.github/actions/go-cache
        with:
          name: chart

      - name: Cache npm downloads
        uses: ./.github/actions/npm-cache

      - name: Create kind cluster
        run: nix develop --command kind create cluster

      - name: Prepare ichor
        run: |
          nix develop --command bash -c "go mod tidy -diff && go mod verify"
          nix develop --command make images-kind

      - name: Lint Helm Chart
        run: |
          nix develop --command helm lint ./dist/chart --set ichorUI.users.enabled=true --set ichorUI.users.externalURL=https://localhost:8443

      # No cert-manager install step: it is off by default, the
      # webhook serving certificate is generated in-process by cert-controller.

      - name: Deploy manager via Helm
        run: |
          nix develop --command make helm-deploy HELM_EXTRA_ARGS="--set ichorUI.image.repository=${IMG_UI%:*} --set ichorUI.image.tag=${IMG_UI##*:} --set ichorUI.users.enabled=true --set ichorUI.users.externalURL=https://localhost:8443"

      # Runs only after a failed deploy. It prints what the namespace holds: the pods and jobs, each pod's
      # description and recent logs (a failing container's stderr shows only there), the events and the Helm
      # release status. Every line is best effort: the step must print what is there, not fail on a missing piece.
      - name: Show why the deploy failed
        if: failure()
        run: |
          ns=ichor-system
          kubectl -n "$ns" get job,pod -o wide || true
          kubectl -n "$ns" describe pods || true
          for p in $(kubectl -n "$ns" get pods -o name); do
            kubectl -n "$ns" logs "$p" --all-containers --tail=200 --prefix || true
          done
          kubectl -n "$ns" get events --sort-by=.lastTimestamp || true
          nix develop --command make helm-status || true

      - name: Check Helm release status
        run: |
          nix develop --command make helm-status
