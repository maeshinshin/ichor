name: Test Chart

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMG: kind.local/ichor-controller:latest
      IMG_UI: kind.local/ichor-ui:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/nix

      - name: Cache Go modules and builds
        uses: ./.github/actions/go-cache
        with:
          name: chart

      - name: Cache npm downloads
        uses: ./.github/actions/npm-cache

      # Pinned version and checksum (the runner is linux/amd64); Renovate does not bump this, change both together.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare ichor
        run: |
          nix develop --command bash -c "go mod tidy -diff && go mod verify"
          nix develop --command make images-kind

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart --set ichorUI.users.enabled=true --set ichorUI.users.externalURL=https://localhost:8443

      # No cert-manager install step: it is off by default, the
      # webhook serving certificate is generated in-process by cert-controller.

      - name: Deploy manager via Helm
        run: |
          make helm-deploy HELM_EXTRA_ARGS="--set ichorUI.image.repository=${IMG_UI%:*} --set ichorUI.image.tag=${IMG_UI##*:} --set ichorUI.users.enabled=true --set ichorUI.users.externalURL=https://localhost:8443"

      # Runs only after a failed deploy. A failed hook Job and its pod are kept (the hook's delete policy removes
      # them only on success), and the guard's refusal is written to the pod's stderr, so this is the only place
      # the reason shows. Every line is best effort: the step must print what is there, not fail on a missing piece.
      - name: Show why the deploy failed
        if: failure()
        run: |
          ns=ichor-system
          kubectl -n "$ns" get job,pod -o wide || true
          kubectl -n "$ns" describe job ichor-retired-kinds-guard || true
          kubectl -n "$ns" describe pods -l job-name=ichor-retired-kinds-guard || true
          kubectl -n "$ns" logs -l job-name=ichor-retired-kinds-guard --all-containers --tail=-1 --prefix || true
          kubectl -n "$ns" get events --sort-by=.lastTimestamp || true
          make helm-status || true

      - name: Check Helm release status
        run: |
          make helm-status
