name: E2E Tests

# Manual only: the qemu Talos cluster needs root and KVM, which hosted runners cannot be relied on to provide.
on:
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      # `setup-test-e2e` is expected to stand up the cluster and publish a
      # kubeconfig for it via $GITHUB_ENV (KUBECONFIG=<path>) so later steps
      # can reach it; the e2e run below must not create its own cluster.
      - name: Provision the e2e cluster
        run: nix develop --command make setup-test-e2e

      - name: Verify go.mod and go.sum
        run: nix develop --command bash -c "go mod tidy -diff && go mod verify"

      - name: Running Test e2e
        run: nix develop --command make test-e2e

      - name: Tear down the e2e cluster
        if: always()
        run: nix develop --command make cleanup-test-e2e
