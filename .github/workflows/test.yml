name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix

      - name: Verify the devShell Go floor
        run: |
          # shellcheck disable=SC2016 # the single-quoted script is meant for the inner bash -c, not this shell
          nix develop --command bash -c '
            want=$(sed -n "s/^go //p" go.mod)
            have=$(go env GOVERSION | sed "s/^go//")
            if ! echo "$have" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"; then
              echo "devShell Go \"$have\" is not a plain release (pre-release/rc?), cannot compare to the go.mod floor of $want" >&2
              exit 1
            fi
            latest=$(printf "%s\n%s\n" "$want" "$have" | sort -V | tail -1)
            if [ "$latest" != "$have" ]; then
              echo "devShell Go $have is older than go.mods floor of $want" >&2
              exit 1
            fi
            echo "devShell Go $have satisfies the go.mod floor of $want"
          '

      # Fail on drift instead of rewriting go.mod/go.sum in CI, and check the module cache hashes.
      - name: Verify go.mod, go.sum and the module cache
        run: nix develop --command bash -c "go mod tidy -diff && go mod verify"

      - name: Running Tests
        run: nix develop --command make test

      # Known-vulnerable Go and npm dependencies fail the build.
      - name: govulncheck
        run: nix develop --command govulncheck ./...

      - name: npm audit (production dependencies, high and above)
        run: nix develop --command bash -c "cd ui && npm audit --omit=dev --audit-level=high"

      - name: Running UI CI (type-check, lint, unit tests, build)
        run: nix develop --command make ui-ci

  # Catches drift between source (api/v1alpha1 types, +kubebuilder:rbac markers) and
  # what's generated from it (config/crd/bases, config/rbac/*, zz_generated.*.go): one
  # regenerate-and-diff covers every generated artifact at once, rather than a check per
  # artifact kind. Runs in its own job so it starts in parallel with "test" above -- drift
  # is cheap to catch and there's no reason to wait on the rest of the suite first.
  manifests-drift:
    permissions:
      contents: read
    name: Generated manifests are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix

      # "fmt" is part of this, not an extra step: controller-gen/mirrorgen's raw output
      # isn't always import-sorted the way gofmt leaves it (observed for real -- a bare
      # "make manifests generate" reordered an unrelated, already-correct import block in
      # pkg/typedconfig/zz_generated.*.go, pure noise that "go fmt" immediately undoes).
      # Skipping fmt here would make this job flag committed files as "out of date" when
      # they match what `make build`/`make test` (which both depend on fmt too) actually
      # produce.
      - name: Regenerate manifests and mirror types
        run: nix develop --command make manifests generate fmt docs-reference third-party-notices

      - name: Fail if regenerating produced a diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date with their source (api/v1alpha1 types, +kubebuilder:rbac markers, go.mod or ui/package-lock.json). Run 'make manifests generate fmt docs-reference third-party-notices' locally and commit the result." >&2
            exit 1
          fi
