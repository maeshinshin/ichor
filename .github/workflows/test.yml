name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - name: Verify the devShell Go floor
        run: |
          # shellcheck disable=SC2016 # the single-quoted script is meant for the inner bash -c, not this shell
          nix develop --command bash -c '
            want=$(sed -n "s/^go //p" go.mod)
            have=$(go env GOVERSION | sed "s/^go//")
            if ! echo "$have" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"; then
              echo "devShell Go \"$have\" is not a plain release (pre-release/rc?), cannot compare to the go.mod floor of $want" >&2
              exit 1
            fi
            latest=$(printf "%s\n%s\n" "$want" "$have" | sort -V | tail -1)
            if [ "$latest" != "$have" ]; then
              echo "devShell Go $have is older than go.mods floor of $want" >&2
              exit 1
            fi
            echo "devShell Go $have satisfies the go.mod floor of $want"
          '

      - name: Running Tests
        run: nix develop --command bash -c "go mod tidy && make test"
