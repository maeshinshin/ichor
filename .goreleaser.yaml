# Release config for the `ichor` CLI (cobra, cmd/ichor). cmd/ichor now
# exists: `goreleaser build --snapshot --clean` succeeds locally,
# so CI can run `goreleaser build` in addition to the `goreleaser check` it
# already runs, whenever that's wired up.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

# goreleaser's own output directory defaults to "dist/", which collides with
# this repo's committed dist/chart (the Helm chart dist-chart-plugin writes,
# unrelated to this release config). "goreleaser build --clean" wipes
# whatever "dist:" points at before writing to it, so without this override
# a release build would delete the committed chart. Keep this out of
# "dist/" entirely rather than trying to carve out a shared subdirectory.
dist: .goreleaser-dist

# Produce what `make build-ichor-embed` embeds, naming the images of the tag being released, so the
# released CLI's `ichor init` applies a real install manifest (-tags installembed below). A release that
# follows the release workflow sets ICHOR_IMAGE_DIGESTS to the workflow's digests.txt (the `release-image-digests`
# artifact), so that manifest names the controller and ichor-ui images by digest as the installer image's
# does; a snapshot build without it names tags.
before:
  hooks:
    - make build-installer IMG=ghcr.io/maeshinshin/ichor-controller:{{ .Tag }} IMG_UI=ghcr.io/maeshinshin/ichor-ui:{{ .Tag }} IMAGE_DIGESTS={{ envOrDefault "ICHOR_IMAGE_DIGESTS" "" }}
    - cp dist/install.yaml internal/installmanifest/install.yaml
    - cp dist/network-policies.yaml internal/installmanifest/network-policies.yaml

builds:
  - id: ichor
    main: ./cmd/ichor
    binary: ichor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    tags:
      - installembed
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/maeshinshin/ichor/internal/version.Version={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

# One checksums file (ichor_<version>_checksums.txt, sha256) covers every archive; the release workflow
# signs it keyless with cosign (the signature bundle is attached beside it). A local snapshot needs --skip=sign.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # No git remote is configured on purpose (see CLAUDE.md); name the repo
  # explicitly so goreleaser doesn't need to read it from `git remote`.
  github:
    owner: maeshinshin
    name: ichor
  footer: >-
    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
