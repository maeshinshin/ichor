# Enforces docs/design/architecture.md's "CNI" section: switching
# TalosCluster.spec.cni.kubeProxy between "enabled" and "replaced" on an
# existing cluster is refused unless annotated, because the switch has to run
# in one safe order -- new side up on every node, verify, then old side down
# -- that nothing at this layer does for the caller automatically.
#
# This is a ValidatingAdmissionPolicy rather than a CRD x-kubernetes-validations
# rule (like the sibling preset-immutability rule in
# api/v1alpha1/taloscluster_types.go) because CRD-embedded CEL only exposes
# metadata.name and metadata.generateName on self/oldSelf -- not annotations.
# It is not a controller-runtime webhook (internal/webhook/) either: that
# package is out of this change's scope.
#
# Hand-maintained, not controller-gen output: there is no CRD or RBAC marker
# for a ValidatingAdmissionPolicy. It is wired into config/default's
# kustomization so a kustomize-based deploy installs it, and mirrored into
# dist/chart/templates/admission/ (kept byte-for-byte identical below the
# apiVersion/kind/metadata.name lines) so a Helm-based install enforces the
# same rule. Fixed names, not release-templated: cluster-scoped, and Ichor
# is one installation per cluster (design 4.1), the same reasoning the
# webhook configuration's fixed name already uses.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ichor-cni-kubeproxy-switch
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["ichor.maesh.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["talosclusters"]
  # has() guards: an object without spec.cni.kubeProxy reads as "" instead of failing the CEL (and,
  # with failurePolicy Fail, refusing every update of the cluster).
  variables:
    - name: oldProxy
      expression: >-
        has(oldObject.spec.cni) && has(oldObject.spec.cni.kubeProxy) ? oldObject.spec.cni.kubeProxy : ""
    - name: newProxy
      expression: >-
        has(object.spec.cni) && has(object.spec.cni.kubeProxy) ? object.spec.cni.kubeProxy : ""
  validations:
    - expression: >-
        variables.newProxy == variables.oldProxy ||
        (has(object.metadata.annotations) &&
         "ichor.maesh.dev/confirm-kube-proxy-switch" in object.metadata.annotations &&
         object.metadata.annotations["ichor.maesh.dev/confirm-kube-proxy-switch"] == variables.newProxy)
      message: >-
        switching spec.cni.kubeProxy requires the
        ichor.maesh.dev/confirm-kube-proxy-switch annotation set to the new
        mode (replaced or enabled), since the switch must run new-side-up,
        verify, old-side-down and nothing here does that automatically
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ichor-cni-kubeproxy-switch-binding
spec:
  policyName: ichor-cni-kubeproxy-switch
  validationActions: ["Deny"]
