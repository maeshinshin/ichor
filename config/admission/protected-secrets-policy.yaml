# The secrets bundle Secret, and the other Secrets Ichor cannot recreate, carry the label
# ichor.maesh.dev/protected. Deleting such a Secret, including by deleting the namespace that holds it, loses
# a cluster's PKI. This policy refuses that DELETE unless the Secret carries the annotation
# ichor.maesh.dev/allow-delete=true, the key the TalosCluster delete guard uses. A ValidatingAdmissionPolicy
# is enforced by the apiserver itself, so it holds while the controller is down and puts no webhook in the
# path of the cluster's other Secrets.
#
# Hand-maintained, mirrored byte-for-byte below the metadata into
# dist/chart/templates/admission/protected-secrets-policy.yaml. Fixed names: cluster-scoped, one
# installation per cluster.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ichor-protected-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["secrets"]
  # Only a labelled Secret is looked at; every other Secret in the cluster is admitted without evaluating a validation.
  matchConditions:
    - name: protected
      expression: >-
        has(oldObject.metadata.labels) && "ichor.maesh.dev/protected" in oldObject.metadata.labels
  validations:
    - expression: >-
        has(oldObject.metadata.annotations) && "ichor.maesh.dev/allow-delete" in oldObject.metadata.annotations &&
        oldObject.metadata.annotations["ichor.maesh.dev/allow-delete"] == "true"
      message: >-
        this Secret holds a cluster's secrets bundle or another credential Ichor cannot recreate, and deleting it
        (also by deleting its namespace) loses the cluster's PKI; export it first (ichor export bundle), then set
        the annotation ichor.maesh.dev/allow-delete=true on the Secret and delete it again
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ichor-protected-secrets-binding
spec:
  policyName: ichor-protected-secrets
  validationActions: ["Deny"]
