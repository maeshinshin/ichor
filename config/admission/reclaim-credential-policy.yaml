# ichor-ui's ServiceAccount can create Secrets in ichor-system so that the
# reclaim page can store a pasted foreign talosconfig. This policy narrows that right to exactly
# the credential Secret: type ichor.maesh.dev/foreign-talosconfig, the label
# ichor.maesh.dev/reclaim, and the single key talosconfig. RBAC cannot express a type, label or
# key restriction, and a webhook would not stop the UI while the controller is down; a
# ValidatingAdmissionPolicy is enforced by the apiserver itself.
#
# Hand-maintained, mirrored byte-for-byte below the metadata into
# dist/chart/templates/admission/reclaim-credential-policy.yaml (the chart templates the
# ServiceAccount's namespace). Fixed names: cluster-scoped, one installation per cluster.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ichor-ui-reclaim-credential
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: from-ichor-ui
      expression: request.userInfo.username == 'system:serviceaccount:ichor-system:ichor-ui'
  validations:
    - expression: object.type == 'ichor.maesh.dev/foreign-talosconfig'
      message: ichor-ui may only create Secrets of type ichor.maesh.dev/foreign-talosconfig
      reason: Forbidden
    - expression: >-
        has(object.metadata.labels) && 'ichor.maesh.dev/reclaim' in object.metadata.labels
      message: the credential Secret must carry the label ichor.maesh.dev/reclaim
      reason: Forbidden
    - expression: >-
        has(object.data) && size(object.data) == 1 && 'talosconfig' in object.data
      message: the credential Secret must hold exactly the key talosconfig
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ichor-ui-reclaim-credential-binding
spec:
  policyName: ichor-ui-reclaim-credential
  validationActions: ["Deny"]
