# Ichor's own CiliumNetworkPolicies. Not part of config/default: the
# CiliumNetworkPolicy CRD exists only once Cilium runs, so `ichor init` applies this after
# Cilium is Ready and the installer applies it on an upgrade (`make build-network-policies`).
#
# Every allow below is one flow's table. Ports are the ones config/manager and
# config/manager-ui open; internal/cli's TestNetworkPolicyPortsMatchDeployments fails when one
# drifts. dist/chart/templates/network-policy/cilium.yaml renders the same policies from values.
#
# Default deny: a rule that selects an endpoint and has an ingress or egress section puts that
# direction in deny mode (Cilium "Ingress/Egress Default Deny"); the empty rule allows nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: system
spec:
  description: Everything in the namespace is denied unless a policy below allows it.
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller-manager
  namespace: system
spec:
  description: The controller (2 replicas).
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: ichor
  ingress:
  # The API server calls the admission webhooks. It runs on the host network of a control plane.
  - fromEntities:
    - kube-apiserver
    # A call from the apiserver to a pod on another node arrives SNATed to its node's
    # cilium_host address, which the receiving agent labels remote-node only.
    - remote-node
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP
  # The kubelet's startup, liveness and readiness probes (/healthz, /readyz).
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  # /metrics is not opened here: the operator names the scraper with a policy of their own,
  # which adds to this one (docs/guides/install-with-helm.md, "Network policies").
  egress:
  # The Kubernetes API through the kubernetes Service (Cilium translates it to the apiserver backend).
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  # Talos nodes of this cluster: apid, the API server's /readyz on a node's own address and etcd's
  # peer port (MachineReclaim). Machines outside the cluster (maintenance mode, other clusters) are
  # allowed by the policy the controller maintains from its own CRs, ichor-controller-talos-egress.
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "50000"
        protocol: TCP
      - port: "6443"
        protocol: TCP
      - port: "2380"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      # Through Cilium's DNS proxy: it is what lets toFQDNs rules (the controller's egress policy) learn the addresses a name resolves to.
      rules:
        dns:
        - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ui
  namespace: system
spec:
  description: ichor-ui (2 replicas).
  endpointSelector:
    matchLabels:
      control-plane: ui-backend
      app.kubernetes.io/name: ichor
  ingress:
  # Users through a LoadBalancer or NodePort (world, or a node once the address is translated),
  # an in-cluster ingress or gateway, the kubelet's probes and `ichor ui` port-forwards (host).
  - fromEntities:
    - world
    - cluster
    toPorts:
    - ports:
      - port: "8443"
        protocol: TCP
  # The API server reads the issuer's discovery document and JWKS.
  - fromEntities:
    - kube-apiserver
    # A call from the apiserver to a pod on another node arrives SNATed to its node's
    # cilium_host address, which the receiving agent labels remote-node only.
    - remote-node
    toPorts:
    - ports:
      - port: "8444"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  # Support bundles, logs, etcd snapshots and discovery dial a node's apid. Nodes of this cluster here;
  # others by ichor-controller-talos-egress, which also selects these pods.
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "50000"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      # Through Cilium's DNS proxy: it is what lets toFQDNs rules (the controller's egress policy) learn the addresses a name resolves to.
      rules:
        dns:
        - matchPattern: "*"
  # An external OIDC issuer (ichorUI.oidc) is allowed by ichor-ui-oidc-egress, which the controller writes
  # from the issuer the Deployment names: nothing outside the cluster is open here.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: installer
  namespace: system
spec:
  description: The installer Job. It talks to the API server and nothing else.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ichor-installer
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
