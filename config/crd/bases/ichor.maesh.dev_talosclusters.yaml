                            URL without query or fragment.
                          maxLength: 253
                          pattern: ^https://[^\s/?#@]+(/[^\s?#]*)?$
                          type: string
                        usernameClaim:
                          default: email
                          description: usernameClaim is the token claim that names
                            the user.
                          maxLength: 63
                          minLength: 1
                          type: string
                        usernamePrefix:
                          default: 'oidc:'
                          description: |-
                            usernamePrefix is put in front of every username. It cannot be empty or start with
                            "ichor:", so an external user can never be mistaken for an Ichor user.
                          maxLength: 63
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: 'the prefix ichor: is reserved for Ichor''s own
                              users'
