                    type: object
                  kubeProxy:
                    default: enabled
                    description: |-
                      kubeProxy is enabled (Talos's own default) or replaced by the CNI. Replacing it splits the
                      setting across two owners -- Talos (cluster.proxy.disabled, written by Ichor) and the CNI
                      (written by Argo CD) -- so a consistency check reads the CNI's live configuration and
                      reports a mismatch as a health failure.
                    enum:
                    - enabled
                    - replaced
                    type: string
                  preset:
                    default: flannel
                    description: |-
                      preset selects the CNI this cluster bootstraps: flannel (Talos's own default; Ichor does
                      nothing), cilium (Helm, with Talos-recommended values built in), or custom (your chart or
                      manifests; you declare the Talos-side settings).
                    enum:
                    - flannel
                    - cilium
                    - custom
                    type: string
                type: object
                x-kubernetes-validations:
                - message: cni.preset cannot change after the cluster is created;
                    swapping a CNI takes the network down
                  rule: self.preset == oldSelf.preset
                - message: custom must be set when, and only when, preset is custom
                  rule: 'self.preset == ''custom'' ? has(self.custom) : !has(self.custom)'
                - message: flannel cannot replace kube-proxy
                  rule: self.preset != 'flannel' || self.kubeProxy == 'enabled'
              controlPlane:
                description: controlPlane configures the control-plane topology.
                properties:
                  count:
                    description: count is the number of control-plane nodes; 2 and
                      4 are rejected because they don't improve etcd availability
                      over 1 or 3.
                    enum:
                    - 1
                    - 3
                    - 5
                    format: int32
                    type: integer
                  schedulable:
                    description: schedulable controls whether control planes accept
                      workloads; required with no default because nothing on the object
                      can resolve an auto value before any machine exists.
                    enum:
                    - "true"
                    - "false"
                    type: string
                required:
                - count
                - schedulable
                type: object
              driftPolicy:
                default: warnOnly
                description: |-
                  driftPolicy controls what the reconciler does when a node's live configuration no
                  longer matches what Ichor last rendered for it, and nothing on Ichor's side (this
                  TalosCluster, a TalosConfigPatch, or the TalosMachine) has changed since Ichor last
                  confirmed the two matched: warnOnly leaves the node as it is and reports the drift
                  through a condition; autoCorrect re-applies, but only when every changed field is
                  reboot-free (pkg/fieldmeta) -- a reboot-requiring or install-time-only drift is always
                  just reported, regardless of this setting. Defaults to warnOnly: unlike
                  controlPlane.schedulable, the two values here are not wrong half the
                  time each -- silently changing a node is the one that can surprise, so it is never
                  the default.
                enum:
                - warnOnly
                - autoCorrect
                type: string
              endpoint:
                description: endpoint is the cluster's control-plane endpoint.
                properties:
                  address:
                    description: 'address is the endpoint''s address: an IP for vip/node,
                      or a hostname for loadBalancer/dns.'
                    minLength: 1
                    type: string
                  type:
                    description: type is the kind of address the endpoint resolves
                      through.
                    enum:
                    - vip
                    - loadBalancer
                    - dns
                    - node
                    type: string
                required:
                - address
                - type
                type: object
              kubernetesVersion:
                description: kubernetesVersion is the Kubernetes release this cluster
                  runs.
                pattern: ^v\d+\.\d+\.\d+$
                type: string
              schematic:
                description: schematic is the Image Factory schematic used for this
                  cluster's installer image.
                properties:
                  id:
                    description: id is the Image Factory schematic ID.
