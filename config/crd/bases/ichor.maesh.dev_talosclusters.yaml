                            OIDC client IDs).
                          items:
                            maxLength: 253
                            minLength: 1
                            type: string
                          maxItems: 8
                          minItems: 1
                          type: array
                        certificateAuthority:
                          description: |-
                            certificateAuthority is a PEM bundle (public certificates only) that verifies the provider's
                            TLS certificate. Empty uses the control plane's system roots.
                          maxLength: 65536
                          type: string
                        groupsClaim:
                          default: groups
                          description: groupsClaim is the token claim that lists the
                            user's groups.
                          maxLength: 63
                          minLength: 1
                          type: string
                        groupsPrefix:
                          default: 'oidc:'
                          description: groupsPrefix is put in front of every group,
                            with the same restrictions as usernamePrefix.
                          maxLength: 63
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: 'the prefix ichor: is reserved for Ichor''s own
                              groups'
                            rule: '!self.startsWith(''ichor:'')'
                        issuerURL:
                          description: issuerURL is the provider's issuer, an https
                            URL without query or fragment.
                          maxLength: 253
                          pattern: ^https://[^\s/?#@]+(/[^\s?#]*)?$
                          type: string
                        usernameClaim:
                          default: email
                          description: usernameClaim is the token claim that names
                            the user.
                          maxLength: 63
                          minLength: 1
                          type: string
                        usernamePrefix:
                          default: 'oidc:'
                          description: |-
                            usernamePrefix is put in front of every username. It cannot be empty or start with
                            "ichor:", so an external user can never be mistaken for an Ichor user.
                          maxLength: 63
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: 'the prefix ichor: is reserved for Ichor''s own
                              users'
                            rule: '!self.startsWith(''ichor:'')'
