---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: taloscredentialrequests.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: TalosCredentialRequest
    listKind: TalosCredentialRequestList
    plural: taloscredentialrequests
    singular: taloscredentialrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.purpose
      name: Purpose
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TalosCredentialRequest is a short-lived request for one certificate. The controller deletes it a
          couple of minutes after it was created (ADR 0108).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the request.
            properties:
              clusterRef:
                description: clusterRef names the TalosCluster, in this namespace,
                  whose CAs sign the certificate.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              csr:
                description: |-
                  csr is a PEM PKCS#10 certificate request. Only its public key is used (its signature proves the
                  requester holds the key); the subject and any SANs are ignored and replaced.
                maxLength: 8192
                type: string
              machineRef:
                description: |-
                  machineRef names the TalosMachine a download purpose is for; the requester's permission is
                  checked on that machine.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              purpose:
                description: |-
                  purpose decides the subject, the CA, the Talos role and the maximum lifetime, and which
                  Kubernetes permission the requester needs (checked by the admission webhook).
                enum:
                - public
                - node-reader
                - support-bundle
                - etcd-snapshot
                - packet-capture
                - credentials-talos
                - credentials-kubernetes
                type: string
              talosRole:
                description: |-
                  talosRole is os:reader or os:admin for purpose credentials-talos; empty means admin. It is
                  ignored by every other purpose.
                enum:
                - reader
                - admin
                type: string
              ttl:
                description: |-
                  ttl is the lifetime asked for. Empty means the purpose's default (10 minutes for a dial
                  certificate, one year for the operator credentials); the controller refuses more than the
                  purpose's cap.
                type: string
            required:
            - clusterRef
            - purpose
            type: object
            x-kubernetes-validations:
            - message: a credential request cannot change; make a new one
              rule: self == oldSelf
            - message: csr is required for every purpose except public
              rule: self.purpose == 'public' || (has(self.csr) && size(self.csr) >
                0)
            - message: machineRef is required for a download purpose
              rule: '!(self.purpose in [''support-bundle'', ''etcd-snapshot'', ''packet-capture''])
                || has(self.machineRef)'
          status:
            description: status is the answer.
            properties:
              certificate:
                description: certificate is the signed client certificate (PEM) for
                  the key in spec.csr.
                type: string
              message:
                description: message says why a request failed.
                type: string
              notAfter:
                description: notAfter is when the certificate expires.
                format: date-time
                type: string
              phase:
                description: phase is Issued or Failed; empty while the controller
                  has not answered.
                type: string
              public:
                description: public is set for purpose public.
                properties:
                  clusterID:
                    description: clusterID is the Talos cluster ID.
                    type: string
                  etcdCA:
                    type: string
                  kubernetesAggregatorCA:
                    type: string
                  kubernetesCA:
                    type: string
                  talosCA:
                    description: talosCA, kubernetesCA, etcdCA and kubernetesAggregatorCA
                      are the CA certificates (PEM).
                    type: string
                type: object
              trust:
                description: |-
                  trust is the CA certificate(s) (PEM) the certificate's API must be verified against: the
                  current CA, or the old and the new one during a CA rotation.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
