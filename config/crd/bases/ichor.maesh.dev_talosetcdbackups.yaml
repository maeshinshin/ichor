---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: talosetcdbackups.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: TalosEtcdBackup
    listKind: TalosEtcdBackupList
    plural: talosetcdbackups
    singular: talosetcdbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.lastSuccessTime
      name: Last Success
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosEtcdBackup is the Schema for the talosetcdbackups API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TalosEtcdBackup
            properties:
              clusterRef:
                description: clusterRef names the TalosCluster (same namespace) whose
                  etcd is backed up.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: clusterRef.name is required
                  rule: self.name != ''
              destination:
                description: destination is where snapshots are stored.
                properties:
                  s3:
                    description: s3 is an S3-compatible bucket.
                    properties:
                      bucket:
                        description: bucket is the bucket name. It must already exist.
                        minLength: 3
                        type: string
                      credentialsSecretRef:
                        description: |-
                          credentialsSecretRef names a Secret holding accessKeyID and
                          secretAccessKey (and optionally sessionToken, and ca.crt, a PEM bundle
                          that signs the endpoint). It is read from the controller's own
                          namespace, not the namespace of this object.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      endpoint:
                        description: |-
                          endpoint is the service URL, e.g. https://s3.eu-west-1.amazonaws.com or
                          http://minio.minio.svc:9000. The scheme selects TLS.
                        pattern: ^https?://[^/\s]+$
                        type: string
                      insecure:
                        description: |-
                          insecure permits a plain http:// endpoint. The access key id, the signed headers
                          and the session token then cross the network in clear, so the admission webhook refuses
                          http:// unless this is true. Changing it needs update on talosetcdbackups/secret-references,
                          like the endpoint. Unset (false) means https only.
                        type: boolean
                      prefix:
                        description: |-
                          prefix is the key prefix snapshots are written under, with no leading
                          or trailing slash. Snapshots of different clusters need different prefixes.
                        pattern: ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$
                        type: string
                      region:
                        description: region is the bucket's region; empty lets the
                          client detect it.
                        type: string
                    required:
                    - bucket
                    - credentialsSecretRef
                    - endpoint
                    - prefix
                    type: object
                required:
                - s3
                type: object
              retention:
                default:
                  keepLast: 24
                description: retention is how many snapshots to keep under the destination
                  prefix.
                properties:
                  keepLast:
                    default: 24
                    description: |-
                      keepLast keeps the newest N snapshots and deletes older ones after a
                      successful upload.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              schedule:
                default: 0 * * * *
                description: schedule is a standard five-field cron expression, evaluated
                  in UTC.
                minLength: 1
                type: string
              suspend:
                description: suspend stops new snapshots; existing ones are kept and
                  not pruned.
                type: boolean
            required:
            - clusterRef
            - destination
            type: object
            x-kubernetes-validations:
            - message: clusterRef cannot change after creation
              rule: self.clusterRef == oldSelf.clusterRef
