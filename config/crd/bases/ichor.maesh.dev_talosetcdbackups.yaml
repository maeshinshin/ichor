                description: 'conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: consecutiveFailures counts failed attempts since the
                  last success.
                format: int32
                type: integer
              lastAttemptTime:
                description: lastAttemptTime is when the newest attempt started, successful
                  or not.
                format: date-time
                type: string
              lastManualBackup:
                description: |-
                  lastManualBackup is the time of the newest backup-now request (BackupNowAnnotation) the
                  controller acted on; a request is acted on once, whether the snapshot succeeded or not.
                format: date-time
                type: string
              lastSnapshot:
                description: lastSnapshot is the newest snapshot this controller stored.
                properties:
                  key:
                    description: key is the object key within the bucket.
                    type: string
                  size:
                    description: size is the stored (encrypted) size in bytes.
                    format: int64
                    type: integer
                  sourceMachine:
                    description: sourceMachine is the TalosMachine the snapshot was
                      read from.
                    type: string
                  time:
                    description: time is when the snapshot was taken.
                    format: date-time
                    type: string
                required:
                - key
                - size
                - sourceMachine
                - time
                type: object
              lastSuccessTime:
                description: lastSuccessTime is when the newest successful attempt
                  finished.
                format: date-time
                type: string
              snapshots:
                description: |-
                  snapshots lists the snapshots kept in the destination after the last backup and prune,
                  newest first, so the UI and CLI can offer them for a restore without reading the bucket.
                items:
                  description: TalosEtcdBackupStored is one snapshot kept in the destination,
                    as the last listing saw it.
                  properties:
                    name:
                      description: 'name is the object name under the prefix: what
                        an etcd-restore operation''s spec.etcdRestore.snapshot says.'
                      type: string
                    size:
                      description: size is the stored (encrypted) size in bytes.
                      format: int64
                      type: integer
                    time:
                      description: time is when the snapshot was taken (encoded in
                        its name).
                      format: date-time
                      type: string
                  required:
                  - name
                  - size
                  - time
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
