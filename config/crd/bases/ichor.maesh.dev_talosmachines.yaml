---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: talosmachines.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: TalosMachine
    listKind: TalosMachineList
    plural: talosmachines
    shortNames:
    - tm
    singular: talosmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.approvalState
      name: Approval
      type: string
    - jsonPath: .spec.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosMachine is the Schema for the talosmachines API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TalosMachine
            properties:
              approvalDecision:
                description: |-
                  approvalDecision records who made the current approvalState decision,
                  when, and why. It is kept separate from approvalState, not folded
                  into it, so approvalState alone remains this machine's single source
                  of truth for approval status -- this struct asserts no approved/
                  rejected state of its own, only the record behind whichever state
                  approvalState already carries. Unset until the first approve/reject.
                properties:
                  actor:
                    description: |-
                      actor identifies who made the decision. Fixed to the backend's own
                      identity until OIDC login lands (ADR 0018); the field is added now
                      rather than later so every decision from here on has an actor
                      recorded, instead of leaving earlier decisions with none once a
                      real per-person identity exists to fill it.
                    type: string
                  at:
                    description: at is when the decision was made.
                    format: date-time
                    type: string
                  reason:
                    description: |-
                      reason is optional free text, symmetric between approve and reject --
                      AuditRecord's own wire comment already documents "reason" as "mainly
                      used for rejections," not exclusive to them.
                    type: string
                type: object
              approvalState:
                default: pending
                description: |-
                  approvalState records the human decision on this machine: pending (the
                  default, awaiting a decision), approved (the controller renders and
                  applies configuration), or rejected (an operator explicitly turned it
                  away; re-approving reverses it, docs/adr/0018). This replaces an
                  earlier plain "approved" bool, which had no way to represent
                  "rejected" without a second field claiming the same truth -- one
                  field is the source of truth for this machine's approval status.
                enum:
                - pending
                - approved
                - rejected
                type: string
              clusterRef:
                description: clusterRef names the TalosCluster this machine belongs
                  to.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: clusterRef.name is required
                  rule: self.name != ''
              endpoint:
                description: endpoint is the machine's Talos API address.
                minLength: 1
                type: string
              hostname:
                description: |-
                  hostname overrides the Kubernetes Node name; Talos derives one from the machine if unset.
                  It must be an RFC 1123 DNS label or subdomain (lower-case alphanumerics, '-' and '.').
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              identity:
                description: identity identifies the physical machine backing this
                  resource.
                properties:
                  macAddresses:
                    description: macAddresses are the machine's NIC MAC addresses,
                      used as an identity hint.
                    items:
                      type: string
                    type: array
                  serial:
                    description: serial is the machine's SMBIOS serial number, used
                      as an identity hint.
                    type: string
                  uuid:
                    description: uuid is the machine's SMBIOS UUID, the primary key
                      for identity.
                    minLength: 1
                    type: string
                required:
                - uuid
                type: object
              install:
                description: |-
                  install is where Talos installs itself on this machine (the design's `system` disk role,
                  ADR 0077). Unset renders no install configuration, which leaves a machine that boots from
                  an installed disk alone but gives a maintenance-mode machine nothing to install onto.
                properties:
                  disk:
                    description: |-
                      disk selects the system disk by a stable identifier. Required: the v1.14 install document
                      has no meaning without a disk to install onto.
                    properties:
                      busPath:
                        description: busPath is the disk's bus path, e.g. /pci0000:00/0000:00:17.0/ata1/host0/target0:0:0/0:0:0:0.
                        maxLength: 256
                        pattern: ^/[^"\s]+$
                        type: string
                      byIDPath:
                        description: byIDPath is a /dev/disk/by-id/ symlink of the
                          disk.
                        maxLength: 256
                        pattern: ^/dev/disk/by-id/[^/\s"]+$
                        type: string
                      devPath:
                        description: devPath is the kernel device path, e.g. /dev/sda.
                          Not stable across boots; prefer the others.
                        maxLength: 256
                        pattern: ^/dev/[^"\s]+$
                        type: string
                      serial:
                        description: serial is the disk's serial number.
                        maxLength: 256
                        minLength: 1
                        type: string
                      wwid:
                        description: wwid is the disk's World Wide Identifier.
                        maxLength: 256
                        minLength: 1
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of wwid, serial, byIDPath, busPath or devPath
                        must be set
                      rule: '(has(self.wwid) ? 1 : 0) + (has(self.serial) ? 1 : 0)
                        + (has(self.byIDPath) ? 1 : 0) + (has(self.busPath) ? 1 :
                        0) + (has(self.devPath) ? 1 : 0) == 1'
                  image:
                    description: |-
                      image is the installer image reference. Unset lets Talos use the installer of the
                      schematic it booted from, which only works when it booted an Image Factory asset.
                    maxLength: 512
                    type: string
                required:
                - disk
                type: object
              nodeLabels:
                additionalProperties:
                  type: string
                description: nodeLabels are applied to the Kubernetes Node, not to
                  this resource, which is why the field isn't called "labels" (ADR
                  0004).
                type: object
              role:
                description: |-
                  role is the machine's role in the cluster. Left unset by discovery, which
                  does not know it yet (ADR 0011); approval must set it before the
                  configuration reconciler can render anything for this machine.
                enum:
                - controlplane
                - worker
                type: string
            required:
            - clusterRef
            - endpoint
            - identity
            type: object
          status:
            description: status defines the observed state of TalosMachine
            properties:
              appliedConfigHash:
                description: |-
                  appliedConfigHash is the sha256 of the rendered configuration last confirmed applied to
                  the node (pkg/render's hash format), used for the convergence check on later reconciles.
                  It is a hash only, never the rendered configuration itself (principles 1 and 3).
                type: string
              conditions:
                description: conditions represent the current state of the TalosMachine
                  resource, kstatus-compatible.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configStoredAt:
                description: |-
                  configStoredAt is when the node accepted its initial configuration over the insecure
                  maintenance API. Once set, Ichor never applies to this node insecurely again; it only
                  follows the node to running. Empty for a node that has not been provisioned by Ichor.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation the
                  controller has reconciled.
                format: int64
                type: integer
              observedInputsHash:
                description: |-
                  observedInputsHash hashes the generations of every object that fed the rendered
                  configuration last confirmed to match the node: the TalosCluster, this TalosMachine,
                  and every TalosConfigPatch that applies to it. It is only updated when the node is
                  confirmed converged, so comparing it against the current generations is how the
                  reconciler tells a desired-state change (a generation moved) apart from drift (none
                  did, so the node must have). A hash only, never the generations or config themselves
                  (principle 3).
                type: string
              stage:
                description: |-
                  stage is the last stage the node was seen in on its way from maintenance mode to
                  running: maintenance, installing, rebooting or running (Talos's MachineStatus stages).
                  installing and rebooting right after the initial apply are inferred (the apply RPC only
                  means "stored"); running is read from the node. See ADR 0076.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
