# Adds namespace to all resources.
namespace: ichor-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: ichor-

resources:
- ../crd
- ../rbac
- ../manager
# ichor-ui's own Deployment/Service (ADR 0020): a plain single-replica base, same
# simplicity as ../manager's own kustomize base -- the 2-replica/PDB/anti-affinity
# treatment is a Helm-chart-only enrichment (design 2.4).
- ../manager-ui
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- ../webhook
# ValidatingAdmissionPolicy guarding TalosCluster.spec.cni.kubeProxy switches
# (docs/design/architecture.md, "CNI"; ADR 0013). Not generated by
# controller-gen -- see config/admission's own comment.
- ../admission
# The UI backend's own RBAC (ADR 0018, ADR 0020): a separate resource entry, not folded
# into ../rbac above, so ichor-ui's ServiceAccount/ClusterRole never share a kustomization
# with the controller's -- they must stay separate identities (architecture.md "Trust").
- ../rbac/ichor-ui
# The installer Job's own RBAC (docs/adr/0058), separate for the same reason.
- ../rbac/ichor-installer
# The Cilium Helm Job's own RBAC (ADR 0099), separate for the same reason.
- ../rbac/ichor-cni
# Ichor does not ship a cluster-wide certificate-issuing dependency (ADR 0006): the
# webhook serving certificate is generated at runtime by cert-controller, in-process
# in the manager, so there is no certmanager/ directory here and no caBundle shipped
# with this kustomization.
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [METRICS-WITH-CERTS] Shipped empty; cmd/main.go's second cert-controller rotator (ADR 0006,
# ADR 0031) fills it in at runtime once --metrics-cert-path is set below. Uncomment together with
# cert_metrics_manager_patch.yaml under patches: -- that patch is what actually sets the flag.
#- metrics_server_cert_secret.yaml
patches:
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
#
# target.name scopes this to the controller's own Deployment: with ../manager-ui's
# ichor-ui Deployment also present, an unscoped "kind: Deployment" target would try to
# apply the controller's own metrics/webhook patches to it too (it has no matching
# volumeMounts/args to patch, so the build fails outright).
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
    name: controller-manager

# [METRICS-WITH-CERTS] To scrape metrics over a verifiable TLS certificate instead of the
# ephemeral self-signed one controller-runtime generates by default, uncomment this patch
# together with metrics_server_cert_secret.yaml above; both are needed, same as [WEBHOOK]'s two
# files. No certManager/ directory and no external cert-issuing dependency either way (ADR 0006):
# the certificate is cert-controller's second in-process rotator (ADR 0031), not an external one.
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment
#    name: controller-manager

# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment
    name: controller-manager

# No replacements: the CA-injection annotations and dnsNames replacements that an
# external certificate issuer would need don't apply here. cert-controller injects
# caBundle directly via the Kubernetes API at runtime (ADR 0006), so there is nothing
# for kustomize to template.

# The kube-system objects are patched one level up, in ../installer: kustomize applies the
# patches before the namespace transformer above, so a patch in this kustomization is overwritten.
