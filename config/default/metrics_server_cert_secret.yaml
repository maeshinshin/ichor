# [METRICS-WITH-CERTS] Shipped empty: cmd/main.go's second cert-controller rotator fills it in
# at runtime (ADR 0006, ADR 0031), the same reason config/webhook/secret.yaml ships empty for the
# webhook cert. cert-controller has no Create path, only Update, so this Secret must already exist
# before the rotator's first reconcile -- that's what this file is for, not a placeholder to edit.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: metrics-server-cert
  namespace: system
