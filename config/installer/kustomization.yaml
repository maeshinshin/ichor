# The install manifest: config/default with the kube-system objects put back.
#
# The namespace transformer in ../default sets ichor-system on everything, and a patch inside
# that kustomization runs before the transformer (it was overwritten), so these patches live one
# level up: kustomize applies them to ../default's finished output. Build this directory, not
# ../default, wherever the kube-system objects must be right (build-installer).
#
# The Cilium Helm Job runs in kube-system: it needs
# hostNetwork, which Talos's default Pod Security admission config exempts only there. These
# patches put the Job's ServiceAccount, the controller's Role and RoleBinding for it, and the Job
# ServiceAccount's subject namespaces back to kube-system. The Helm release record's Role and its
# RoleBinding stay in ichor-system.
resources:
- ../default

patches:
- target: {version: v1, kind: ServiceAccount, name: ichor-cni}
  patch: |-
    - {op: replace, path: /metadata/namespace, value: kube-system}
- target: {group: rbac.authorization.k8s.io, version: v1, kind: Role, name: ichor-cni-job-role}
  patch: |-
    - {op: replace, path: /metadata/namespace, value: kube-system}
- target: {group: rbac.authorization.k8s.io, version: v1, kind: RoleBinding, name: ichor-cni-job-rolebinding}
  patch: |-
    - {op: replace, path: /metadata/namespace, value: kube-system}
    - {op: replace, path: /subjects/0/namespace, value: ichor-system}
- target: {group: rbac.authorization.k8s.io, version: v1, kind: RoleBinding, name: ichor-cni-rolebinding}
  patch: |-
    - {op: replace, path: /subjects/0/namespace, value: kube-system}
- target: {group: rbac.authorization.k8s.io, version: v1, kind: ClusterRoleBinding, name: ichor-cni-rolebinding}
  patch: |-
    - {op: replace, path: /subjects/0/namespace, value: kube-system}
- target: {group: rbac.authorization.k8s.io, version: v1, kind: Role, name: ichor-cni-records-role}
  patch: |-
    - {op: replace, path: /metadata/namespace, value: kube-system}
- target: {group: rbac.authorization.k8s.io, version: v1, kind: RoleBinding, name: ichor-cni-records-rolebinding}
  patch: |-
    - {op: replace, path: /metadata/namespace, value: kube-system}
    - {op: replace, path: /subjects/0/namespace, value: kube-system}
