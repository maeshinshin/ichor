apiVersion: apps/v1
kind: Deployment
metadata:
  name: ichor-ui
  namespace: system
  labels:
    app.kubernetes.io/component: ui
    control-plane: ui-backend
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: ui-backend
      app.kubernetes.io/name: ichor
  # Plain single replica, no PodDisruptionBudget or topologySpreadConstraints: this base
  # mirrors ../manager's own simplicity (2 replicas/PDB/anti-affinity is a Helm-chart-only
  # enrichment).
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: ui-backend
        app.kubernetes.io/name: ichor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: ichor-critical
      containers:
      - command:
        - /ichor-ui
        args:
          - --addr=:8443
        image: ichor-ui:latest
        name: ichor-ui
        env:
        # Where the secrets bundle lives.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        volumeMounts:
        # The Ichor serving certificate the controller keeps. Optional on the volume so
        # ichor-ui starts, and fails handshakes, until the controller has issued the first leaf.
        - name: ui-tls
          mountPath: /etc/ichor/ui-tls
          readOnly: true
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        # Readiness is an HTTPS probe (a TCP probe makes the TLS listener log a handshake error).
        # Liveness is a TCP connect: the Ichor-made leaf can arrive 60-90 s after the pod starts, and
        # an HTTPS liveness probe would restart the pod before it does.
        livenessProbe:
          tcpSocket:
            port: 8443
          initialDelaySeconds: 5
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /auth/config
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            # Two concurrent argon2id hashes (64 MiB each, internal/uiapi/user_hash.go) plus the process.
            memory: 384Mi
          requests:
            cpu: 10m
            memory: 64Mi
      # Fixed name, matching ../rbac/ichor-ui/service_account.yaml: the UI
      # backend's identity must stay separate from the controller's own.
      volumes:
      - name: ui-tls
        secret:
          secretName: ichor-oidc-tls
          optional: true
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      serviceAccountName: ichor-ui
      terminationGracePeriodSeconds: 10
