apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: ui
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: ichor-ui-service
  namespace: system
spec:
  ports:
    # Named so ../prometheus/ui-monitor.yaml's ServiceMonitor can target it by name,
    # mirroring dist/chart/templates/ui/ui-service.yaml.
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    control-plane: ui-backend
    app.kubernetes.io/name: ichor
