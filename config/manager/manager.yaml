apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
    # Pod Security Admission (ADR 0108): every pod in this namespace already meets "restricted"
    # (non-root, seccomp RuntimeDefault, no privilege escalation, all capabilities dropped, no host
    # namespaces or hostPath). The Cilium Helm Job needs hostNetwork and runs in kube-system.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.32
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: ichor
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: ichor
    spec:
      # Prefer a control plane (ADR 0108 hardware run): a node that an etcd restore leaves running keeps a
      # stale kube-proxy, and a controller on it cannot reach the kubernetes Service to repair that. Only a
      # preference: a cluster of workers only, or a tainted full control plane, still schedules it.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image with docker buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: ichor-critical
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: GOMEMLIMIT
          value: 400MiB
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        # Covers the start-up wait for the API server (up to 5m, cmd/waitapi.go); the liveness
        # probe only starts once this succeeds.
        startupProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 10
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
          # The probe itself is trivial; a 1 s timeout only fails when the pod is CPU-starved (hardware run
          # I), and a liveness restart takes the fail-closed admission webhook down. 3 x 20 s tolerates it.
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        # Hardware run I: OOMKilled at 256Mi on a 3 CP + 1 W cluster. Informer caches, the machine-config
        # renders and the Cilium values validation (about 15 MB of garbage per call) leave the Go heap near
        # 100 MB before it grows toward the limit; 512Mi keeps the headroom, and GOMEMLIMIT makes the GC work
        # before the kernel does. Keep GOMEMLIMIT at about 80% of the limit.
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: backup-spool
          mountPath: /var/spool/ichor
        # The new Kubernetes CA's certificate during a CA rotation (ADR 0063); survives a container restart.
        - name: api-trust
          mountPath: /var/run/ichor/trust
      volumes:
      - name: backup-spool
        emptyDir: {}
      - name: api-trust
        emptyDir: {}
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
---
# Keeps the controller (the only Talos writer) and the UI from being evicted before ordinary
# workloads under node pressure. A user-namespace pod cannot use system-cluster-critical, so Ichor
# ships its own class, below the system ones (ADR 0108).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: critical
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Ichor controller and UI pods.
