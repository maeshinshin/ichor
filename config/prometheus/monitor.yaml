# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # Ensure this is the name of the port that exposes HTTPS metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # insecureSkipVerify: true is the default here because, out of the box, the metrics
        # server presents controller-runtime's own ephemeral self-signed certificate (no CA
        # Prometheus could verify against). For a verifiable certificate instead, apply
        # config/prometheus/monitor_tls_patch.yaml and uncomment [METRICS-WITH-CERTS] in
        # config/default/kustomization.yaml, which together provision one via cert-controller's
        # second in-process rotator (ADR 0006, ADR 0031) -- not a certificate-issuing dependency.
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: ichor
