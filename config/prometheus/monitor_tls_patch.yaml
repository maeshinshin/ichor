# Patch for Prometheus ServiceMonitor to enable secure TLS configuration, verified against
# cert-controller's second in-process rotator (ADR 0006, ADR 0031), not an external certificate
# manager -- Ichor ships no cluster-wide certificate-issuing dependency.
#
# serverName is hardcoded, not substituted by a kustomize replacement (this project installs
# once per cluster with fixed names throughout, same reasoning as webhookServiceName in
# cmd/main.go): it must match the metrics Service's DNS name after namePrefix (config/default/
# metrics_service.yaml's "controller-manager-metrics-service" becomes
# "ichor-controller-manager-metrics-service" with the "ichor-" prefix config/default's
# kustomization.yaml sets) and its namespace after the "ichor-system" namespace transform.
- op: replace
  path: /spec/endpoints/0/tlsConfig
  value:
    serverName: ichor-controller-manager-metrics-service.ichor-system.svc
    insecureSkipVerify: false
    ca:
      secret:
        name: metrics-server-cert
        key: ca.crt
    cert:
      secret:
        name: metrics-server-cert
        key: tls.crt
    keySecret:
      name: metrics-server-cert
      key: tls.key
