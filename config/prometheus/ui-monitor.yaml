# Prometheus Monitor Service (Metrics) for ichor-ui, the UI backend (ADR 0020,
# ADR 0040). Unlike controller-manager-metrics-monitor above, this is HTTPS on
# ichor-ui's single port and verified against ichor-ui-ca (contrast with
# [PROMETHEUS-WITH-CERTS]'s monitor_tls_patch.yaml, which exists only for the controller's
# secure metrics port).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: ui-backend
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: ichor-ui-metrics-monitor
  namespace: system
spec:
  endpoints:
    # /metrics needs a Kubernetes token that may `get` the non-resource URL /metrics (ADR 0108).
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      path: /metrics
      port: https
      scheme: https
      # Verified against the Ichor serving CA the controller publishes (ADR 0105). The default
      # kustomize install uses the Ichor certificate; for an operator certificate, point ca at
      # its CA instead. The namespace is kustomize's (ichor-system) and the name carries namePrefix.
      tlsConfig:
        serverName: ichor-ui-service.ichor-system.svc
        ca:
          configMap:
            name: ichor-ui-ca
            key: ca.crt
  selector:
    matchLabels:
      control-plane: ui-backend
      app.kubernetes.io/name: ichor
