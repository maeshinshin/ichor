# Prometheus Monitor Service (Metrics) for ichor-ui, the UI backend (ADR 0020,
# ADR 0040). Unlike controller-manager-metrics-monitor above, this is plain HTTP on
# ichor-ui's single port: the UI backend is reached only in-cluster today
# (architecture.md "Trust"), the same trust boundary this scrape already crosses, so
# there is no second TLS story to configure (contrast with [PROMETHEUS-WITH-CERTS]'s
# monitor_tls_patch.yaml, which exists only for the controller's secure metrics port).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: ui-backend
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: ichor-ui-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: http
      scheme: http
  selector:
    matchLabels:
      control-plane: ui-backend
      app.kubernetes.io/name: ichor
