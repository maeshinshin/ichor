# Not bound to anyone. Bind it to the people who may reset a node, restore etcd, override a
# guard or remove an Ichor finalizer in an incident. Ichor checks this verb with a
# SelfSubjectAccessReview made as the user.
# The *_admin_role.yaml helpers list their verbs and do not include it.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: ichor-break-glass-role
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosconfigpatches
  - talosmachines
  verbs:
  - break-glass
