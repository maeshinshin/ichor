# Not bound to anyone. Bind it to the people who may download the new kubeconfig and talosconfig
# of a CA rotation from the UI. Those files hold cluster-admin private keys.
# Ichor checks this verb with a SelfSubjectAccessReview made as the user. Roles with verbs '*'
# on talosclusters (the taloscluster_*_role.yaml helpers) do not include it, because
# talosclusters/credentials is a subresource of its own.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: ichor-credentials-role
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters/credentials
  verbs:
  - download
# The certificate each of these downloads needs is asked of the controller with a TalosCredentialRequest; creating one is plain RBAC, the validating webhook checks the download verb above.
- apiGroups:
  - ichor.maesh.dev
  resources:
  - taloscredentialrequests
  verbs:
  - create
