# The controller may impersonate the automatic patcher's ServiceAccount, and no other (ADR 0116). A namespaced
# Role, so it names the ServiceAccount of this namespace only; the name is written with Ichor's prefix because
# kustomize does not rewrite resourceNames.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: auto-patch-impersonate-role
  namespace: system
rules:
- apiGroups:
  - ""
  resourceNames:
  - ichor-auto-patch
  resources:
  - serviceaccounts
  verbs:
  - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: auto-patch-impersonate-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-patch-impersonate-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
