# The Cilium Helm Job's permissions (ADR 0099, decision 2): what Helm needs to adopt and
# upgrade a release of the pinned Cilium chart, and to wait for its rollout. Cilium's chart
# creates the kinds listed here (with gatewayAPI.enabled: the GatewayClass and the ValidatingAdmissionPolicy
# with its binding; with ingressController.enabled: the IngressClass and an EndpointSlice; ADR 0099
# amendments); Helm keeps the release records in Secrets (the Role below).
#
# Not narrowable further, and the ADR says why: the clusterroles rule with escalate and bind.
# The base Cilium ClusterRoles and Roles (cilium, cilium-operator, cilium-config-agent, ...) grant more
# than this identity holds, so updating them needs escalate, and bind is needed for their bindings;
# together they are as strong as cluster-admin. What an optional feature adds (hubble-ui, clustermesh-apiserver,
# the Roles in cilium-secrets and kube-system) is held by this identity itself instead, because the
# apiserver sees no name on a create and so never honours escalate by resourceNames there (ADR 0099
# amendment 2026-11-06). That is why the ServiceAccount exists only for the Job (the controller can
# create the Job but holds none of this). No wildcard verbs or resources, and nothing for
# Ichor's own CRDs beyond reading the TalosCluster. A chart value that makes Cilium's chart itself
# create Secrets (hubble.tls.auto.method=helm, and clustermesh.apiserver.tls.auto.method=helm, the
# chart's default) is not covered: Ichor keeps cronJob.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cni-role
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
# Create and list cannot be limited by name in RBAC, so they stay for these kinds; get, update, patch and
# delete are limited to the names Cilium's chart renders, so this identity cannot change the
# ichor-controller-jobs policies that confine it (ADR 0099 amendment 2026-11-05;
# TestCNIRoleChangesOnlyTheObjectsCiliumRenders keeps the names equal to what the chart renders).
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  verbs:
  - create
  - list
- apiGroups:
  - admissionregistration.k8s.io
  resourceNames:
  - gateway.cilium.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  verbs:
  - delete
  - get
  - patch
  - update
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  verbs:
  - create
  - list
- apiGroups:
  - gateway.networking.k8s.io
  resourceNames:
  - cilium
  resources:
  - gatewayclasses
  verbs:
  - delete
  - get
  - patch
  - update
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - create
  - list
- apiGroups:
  - discovery.k8s.io
  resourceNames:
  - cilium-ingress
  resources:
  - endpointslices
  verbs:
  - delete
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - ingressclasses
  verbs:
  - create
  - list
- apiGroups:
  - networking.k8s.io
  resourceNames:
  - cilium
  resources:
  - ingressclasses
  verbs:
  - delete
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
# What the chart's ClusterRoles hubble-ui (hubble.ui.enabled) and clustermesh-apiserver (clustermesh.useAPIServer)
# grant, held by this identity itself rule for rule (ADR 0099 amendment 2026-11-06): the apiserver refuses to
# create a ClusterRole whose rules the creator does not hold, and `escalate` by name does not authorize a create.
# Read-only; most of it is already held above, the new part is nodes, componentstatuses, watch on namespaces and
# services, CustomResourceDefinitions, the cilium.io resources and EndpointSlice get.
# TestCNIJobHoldsWhatTheCiliumRolesItCreatesGrant renders the chart per feature and keeps this equal to what it needs.
- apiGroups:
  - ""
  resources:
  - componentstatuses
  - namespaces
  - nodes
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cilium.io
  resources:
  - ciliumendpoints
  - ciliumendpointslices
  - ciliumidentities
  - ciliumnodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - watch
# bind and escalate, by name, for the base objects only: the Roles and ClusterRoles the chart renders with no
# optional feature, which the bootstrap or the takeover already created and Helm only updates (the apiserver
# sees the name on an update, not on a create, so this works for an update). They hold many rules this identity
# does not. Everything an optional feature adds is held above or in the namespaced Roles (features_role.yaml), because
# `escalate` by name cannot authorize a create (ADR 0099 amendment 2026-11-06). The names are the ones the embedded
# Cilium chart renders under Ichor's values that this identity does not hold; TestCNIJobHoldsWhatTheCiliumRolesItCreatesGrant
# (dist/chart/cni_coverage_test.go) fails when the chart and these lists differ, in either direction.
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - cilium
  - cilium-operator
  resources:
  - clusterroles
  verbs:
  - bind
  - escalate
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - cilium-config-agent
  - cilium-operator-ztunnel
  resources:
  - roles
  verbs:
  - bind
  - escalate
---
# Helm's release records. They live in the controller's namespace, not in kube-system, so the
# one permission over Secrets stays a namespaced Role like every other in this tree (a
# cluster-wide Secret rule is refused by dist/chart's invariants); the controller already
# holds Secret access here, which is where the hand-over reads the record from.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cni-role
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
