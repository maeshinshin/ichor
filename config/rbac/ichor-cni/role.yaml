# The Cilium Helm Job's permissions (ADR 0099, decision 2): what Helm needs to adopt and
# upgrade a release of the pinned Cilium chart, and to wait for its rollout. Cilium's chart
# creates the kinds listed here (with gatewayAPI.enabled: the GatewayClass and the ValidatingAdmissionPolicy
# with its binding; with ingressController.enabled: the IngressClass and an EndpointSlice; ADR 0099
# amendments); Helm keeps the release records in Secrets (the Role below).
#
# Not narrowable further, and the ADR says why: the clusterroles rule with escalate and bind.
# The chart's ClusterRoles grant more than this identity holds, so applying them needs
# escalate, and bind is needed for the ClusterRoleBindings; together they are as strong as
# cluster-admin. That is why the ServiceAccount exists only for the Job (the controller can
# create the Job but holds none of this). No wildcard verbs or resources, and nothing for
# Ichor's own CRDs beyond reading the TalosCluster. A chart value that makes Cilium's chart itself
# create Secrets (hubble.tls.auto.method=helm, and clustermesh.apiserver.tls.auto.method=helm, the
# chart's default) is not covered: Ichor keeps cronJob.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cni-role
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - ingressclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
# bind and escalate, by name: Helm's escalation check (ADR 0108) lets the Job create a ClusterRole or
# Role it does not fully hold when it holds bind or escalate on that name. The names are the ones the
# embedded Cilium chart renders under Ichor's values, one list per kind; TestCNIEscalationNamesOnlyCiliumsRoles
# (dist/chart/admission_hardening_test.go) fails when the chart and these lists differ, in either direction.
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - cilium
  - cilium-operator
  - clustermesh-apiserver
  - hubble-ui
  resources:
  - clusterroles
  verbs:
  - bind
  - escalate
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - cilium-bgp-control-plane-secrets
  - cilium-config-agent
  - cilium-envoy-config-secrets
  - cilium-gateway-secrets
  - cilium-ingress-secrets
  - cilium-operator-gateway-secrets
  - cilium-operator-ingress-secrets
  - cilium-operator-tlsinterception-secrets
  - cilium-operator-ztunnel
  - cilium-tlsinterception-secrets
  - clustermesh-apiserver-generate-certs
  - hubble-generate-certs
  resources:
  - roles
  verbs:
  - bind
  - escalate
---
# Helm's release records. They live in the controller's namespace, not in kube-system, so the
# one permission over Secrets stays a namespaced Role like every other in this tree (a
# cluster-wide Secret rule is refused by dist/chart's invariants); the controller already
# holds Secret access here, which is where the hand-over reads the record from.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cni-role
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
