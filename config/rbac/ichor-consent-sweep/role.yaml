# The identity that removes the kube-proxy switch consent annotation once no switch needs it (ADR 0066,
# amendment 2026-11-22). The controller never writes a TalosCluster; it impersonates this ServiceAccount (the Role in
# impersonate_role.yaml) for that one metadata write. The TalosCluster admission webhook refuses anything else this
# user writes. It holds nothing else, and it is not bound to anyone but itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: consent-sweep-role
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  verbs:
  - patch
