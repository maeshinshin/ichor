# What the installer needs in kube-system, where the Cilium Helm Job's ServiceAccount, the
# controller's Role for that Job and their bindings live (ADR 0099 unit 7 as built, ADR 0100):
# the objects it applies there, nothing else. bind and escalate for the same reason as in
# role.yaml: the Role it applies grants Jobs and events, which this Role does not hold.
# config/default patches the namespaces of this file back to kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: installer-kube-system-role
  namespace: kube-system
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - bind
  - escalate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: installer-kube-system-rolebinding
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: installer-kube-system-role
subjects:
- kind: ServiceAccount
  name: installer
  namespace: system
