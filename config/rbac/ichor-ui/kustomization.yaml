# The UI backend's own RBAC base (docs/adr/0018), deliberately not a resource of
# ../kustomization.yaml: that file feeds config/default, which deploys the
# controller. ichor-ui has no Deployment/Service manifests yet (a later work unit);
# wiring this base in before that exists would deploy RBAC for nothing to use it.
# `make manifests-ichor-ui` regenerates role.yaml; it never touches ../role.yaml
# (ADR 0018) or anything controller-gen's main `make manifests` invocation owns.
resources:
- service_account.yaml
- role.yaml
- role_binding.yaml
