# The UI backend's own RBAC base (docs/adr/0018), wired into config/default as its
# own resource entry (ADR 0020), never merged with ../rbac: the controller's and the
# UI backend's ServiceAccount/ClusterRole must stay separate (architecture.md "Trust").
# `make manifests-ichor-ui` regenerates role.yaml from internal/uiapi/rbac_markers.go;
# it never touches ../role.yaml or anything controller-gen's main `make manifests`
# invocation owns.
resources:
- service_account.yaml
- role.yaml
- role_binding.yaml
- impersonate_role.yaml
- secrets_role_binding.yaml
