---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ichor-ui-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - list
- apiGroups:
  - ""
  resources:
  - groups
  - users
  verbs:
  - impersonate
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - apiextensions.k8s.io
  resourceNames:
  - gateways.gateway.networking.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  verbs:
  - get
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations/settings
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosetcdbackups
  verbs:
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches
  - talosoperations
  verbs:
  - create
  - delete
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines
  verbs:
  - delete
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosoperations/ca-rotation
  - talosoperations/etcd-restore
  - talosoperations/node-reset
  - talosoperations/node-shutdown
  - talosoperations/shutdown
  verbs:
  - start
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosstorages
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ichor-ui-role
  namespace: ichor-system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
- apiGroups:
  - ""
  resourceNames:
  - ichor-user-credentials
  resources:
  - secrets
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers
  verbs:
  - get
- apiGroups:
  - ichor.maesh.dev
  resources:
  - machinereclaims
  verbs:
  - create
  - get
  - list
  - update
