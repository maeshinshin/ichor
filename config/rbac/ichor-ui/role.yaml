---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ichor-ui-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - list
- apiGroups:
  - ""
  resourceNames:
  - ichor:admin
  - ichor:operator
  - ichor:viewer
  resources:
  - groups
  verbs:
  - impersonate
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - apiextensions.k8s.io
  resourceNames:
  - backendtlspolicies.gateway.networking.k8s.io
  - gatewayclasses.gateway.networking.k8s.io
  - gateways.gateway.networking.k8s.io
  - grpcroutes.gateway.networking.k8s.io
  - httproutes.gateway.networking.k8s.io
  - referencegrants.gateway.networking.k8s.io
  - tlsroutes.gateway.networking.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectaccessreviews
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  verbs:
  - get
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosconfigpatches
  - talosetcdbackups
  - talosmachines
  - talosoperations
  verbs:
  - get
  - list
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters/node-reader
  - talosclusters/public
  verbs:
  - issue
- apiGroups:
  - ichor.maesh.dev
  resources:
  - taloscredentialrequests
  verbs:
  - create
  - get
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosstorages
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ichor-ui-role
  namespace: ichor-system
rules:
- apiGroups:
  - ""
  resourceNames:
  - ichor-oidc-trust
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ""
  resourceNames:
  - ichor-user-credentials
  resources:
  - secrets
  verbs:
  - get
  - patch
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers
  verbs:
  - get
- apiGroups:
  - ichor.maesh.dev
  resources:
  - machinereclaims
  verbs:
  - get
  - list
