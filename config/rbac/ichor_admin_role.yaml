# Built-in role for the Ichor users group ichor:admin (docs/adr/0094): everything
# ichor-operator has, plus deleting machines and clusters, user management and the explicit
# verbs: `start` on the destructive TalosOperation kinds, `update` on the trust configuration
# and on user passwords, `update` on talosclusters/cilium-values (the Cilium Helm values, ADR 0131), `override` (ADR 0065), `reclaim` on machinereclaims (ADR 0107) and `download` (ADR 0084, ADR 0094). It does
# not hold secrets, impersonate or cluster-admin. Bound by ichor_roles_binding.yaml.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: admin
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosconfigpatches
  - talosetcdbackups
  - talosmachines
  - talosoperations
  - talosstorages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches
  - talosoperations
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosetcdbackups
  - talosmachines
  verbs:
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines/approval
  verbs:
  - approve
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines/endpoint
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosmachines
  verbs:
  - delete
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers/password
  - talosclusters/authentication
  - talosclusters/cilium-values
  - talosclusters/secret-references
  - talosetcdbackups/secret-references
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations/version
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - machinereclaims
  verbs:
  - create
  - get
  - list
  - update
  - reclaim
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations/settings
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosoperations/ca-rotation
  - talosoperations/etcd-restore
  - talosoperations/key-rotation
  - talosoperations/node-reset
  - talosoperations/node-shutdown
  - talosoperations/shutdown
  verbs:
  - start
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosconfigpatches
  - talosmachines
  verbs:
  - override
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters/credentials
  - talosclusters/talosconfig-reader
  - talosmachines/etcd-snapshot
  - talosmachines/packet-capture
  - talosmachines/support-bundle
  verbs:
  - download
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosetcdbackups
  verbs:
  - create
  - delete
# Every download asks the controller for a short-lived certificate with a TalosCredentialRequest (ADR 0108);
# creating one is plain RBAC, the validating webhook checks the download verb.
- apiGroups:
  - ichor.maesh.dev
  resources:
  - taloscredentialrequests
  verbs:
  - create
  - get
