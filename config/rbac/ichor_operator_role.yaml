# Built-in role for the Ichor users group ichor:operator: everything
# ichor-viewer has, plus the routine writes. Starting a destructive TalosOperation (shutdown,
# ca-rotation, etcd-restore, node reset or shutdown) needs the `start` verb that only
# ichor-admin holds. Bound by ichor_roles_binding.yaml.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: operator
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosconfigpatches
  - talosetcdbackups
  - talosmachines
  - talosoperations
  - talosstorages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches
  - talosoperations
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosmachines
  verbs:
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines/approval
  verbs:
  - approve
