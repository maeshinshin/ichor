# This rule is not used by the project ichor itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants every ordinary verb over ichor.maesh.dev, listed one by one: a '*' would also grant
# the custom verbs (break-glass, approve, ...), which stay an explicit grant.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: ichoruser-admin-role
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers/status
  verbs:
  - get
