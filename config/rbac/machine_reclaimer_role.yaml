# For granting "Reset and add" to people who are not ichor:admin (ichor_admin_role.yaml holds these
# rules already; docs/adr/0107). Bind it with an explicit RoleBinding to the people who may reset a
# machine that another Talos cluster configured and add it here (docs/adr/0103, section 2.2).
# Ichor's webhook checks the verb `reclaim` with a SubjectAccessReview as the user, on every
# create and on every write of confirmUUID.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  # kustomize's namePrefix ichor- makes this ichor-machine-reclaimer; the chart renders the same name.
  name: machine-reclaimer
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - machinereclaims
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - reclaim
