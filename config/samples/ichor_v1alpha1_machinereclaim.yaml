# "Reset and add" (ADR 0103 section 2.2, ADR 0107). Normally created by the UI together with the credential
# Secret named below; needs the verb "reclaim" on machinereclaims (no installation switch).
apiVersion: ichor.maesh.dev/v1alpha1
kind: MachineReclaim
metadata:
  name: machinereclaim-sample
spec:
  address: 192.0.2.10
  credentialSecretRef: machinereclaim-sample-credential
  ttl: 15m
