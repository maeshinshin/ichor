apiVersion: ichor.maesh.dev/v1alpha1
kind: TalosStoragePreset
metadata:
  labels:
    app.kubernetes.io/name: ichor
    app.kubernetes.io/managed-by: kustomize
  name: talosstoragepreset-sample
spec:
  clusterRef:
    name: taloscluster-sample
  nodes:
    matchLabels:
      storage: "true"
  diskPreset: longhorn-v1
  diskSelector: disk.transport == "nvme"
