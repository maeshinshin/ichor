---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-ichor-maesh-dev-v1alpha1-taloscluster
  failurePolicy: Ignore
  name: mtaloscluster-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - talosclusters
  sideEffects: None
  timeoutSeconds: 5
