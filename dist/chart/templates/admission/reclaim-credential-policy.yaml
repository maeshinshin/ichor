{{- if .Values.admission.enabled }}
# Mirrors config/admission/reclaim-credential-policy.yaml: ichor-ui may
# create only the override credential Secret. Enforced by the apiserver, independent of the
# webhook and of the controller.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ichor-ui-reclaim-credential
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: from-ichor-ui
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:ichor-ui'
  validations:
    - expression: object.type == 'ichor.maesh.dev/foreign-talosconfig'
      message: ichor-ui may only create Secrets of type ichor.maesh.dev/foreign-talosconfig
      reason: Forbidden
    - expression: >-
        has(object.metadata.labels) && 'ichor.maesh.dev/reclaim' in object.metadata.labels
      message: the credential Secret must carry the label ichor.maesh.dev/reclaim
      reason: Forbidden
    - expression: >-
        has(object.data) && size(object.data) == 1 && 'talosconfig' in object.data
      message: the credential Secret must hold exactly the key talosconfig
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ichor-ui-reclaim-credential-binding
spec:
  policyName: ichor-ui-reclaim-credential
  validationActions: ["Deny"]
{{- end }}
