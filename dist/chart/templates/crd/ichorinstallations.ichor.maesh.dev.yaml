{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ichorinstallations.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: IchorInstallation
    listKind: IchorInstallationList
    plural: ichorinstallations
    singular: ichorinstallation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Target
      type: string
    - jsonPath: .status.installedVersion
      name: Installed
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IchorInstallation is the Schema for the ichorinstallations API: Ichor's own version, a
          cluster-scoped singleton.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of IchorInstallation
            properties:
              defaults:
                description: defaults holds defaults for objects created later; an
                  existing object is never touched.
                properties:
                  driftPolicy:
                    description: |-
                      driftPolicy is the default for a new TalosCluster's spec.driftPolicy. It takes the
                      values of that field (warnOnly, autoCorrect); ADR 0105's "enforce" is autoCorrect.
                    enum:
                    - warnOnly
                    - autoCorrect
                    type: string
                type: object
              deployment:
                description: deployment records who deploys this Ichor (ADR 0105).
                properties:
                  manager:
                    description: manager is installer (the installer Job, `ichor init`)
                      or helm. Omitted means installer.
                    enum:
                    - installer
                    - helm
                    type: string
                type: object
              installerRepository:
                default: ghcr.io/maeshinshin/ichor-installer
                description: |-
                  installerRepository is the image repository of the installer image; the Job runs
                  <installerRepository>:<version>. Point it at a mirror or private registry if you need to.
                minLength: 1
                type: string
              reclaim:
                description: |-
                  reclaim is deprecated and ignored (ADR 0107): "Reset and add" has no installation switch;
                  RBAC alone (the reclaim verb on machinereclaims) decides who may use it. The field stays so
                  that an installed object keeps validating. The admission webhook warns when it is set.
                properties:
                  enabled:
                    description: enabled is deprecated and ignored (ADR 0107).
                    type: boolean
                type: object
              updateCheck:
                description: updateCheck holds the switch for the check of newer Ichor
                  releases (ADR 0114).
                properties:
                  enabled:
                    description: |-
                      enabled turns the check on or off. Unset falls back to the controller flag, which the chart
                      sets from updateCheck.enabled (default true). Off stops the registry request and removes
                      the controller's egress rule for it.
                    type: boolean
                type: object
              users:
                description: users holds the sign-in lifetimes of ADR 0094.
                properties:
                  refreshLifetime:
                    description: refreshLifetime is the lifetime of a refresh token,
                      1h to 720h. Unset falls back to the flag.
                    type: string
                    x-kubernetes-validations:
                    - message: refreshLifetime must be between 1h and 720h
                      rule: duration(self) >= duration('1h') && duration(self) <=
                        duration('720h')
                  tokenTTL:
                    description: tokenTTL is the lifetime of an issued token, 1m to
                      1h. Unset falls back to the flag.
                    type: string
                    x-kubernetes-validations:
                    - message: tokenTTL must be between 1m and 1h
                      rule: duration(self) >= duration('1m') && duration(self) <=
                        duration('1h')
                type: object
                x-kubernetes-validations:
                - message: tokenTTL must not exceed refreshLifetime
                  rule: '!has(self.tokenTTL) || !has(self.refreshLifetime) || duration(self.tokenTTL)
                    <= duration(self.refreshLifetime)'
              version:
                description: |-
                  version is the Ichor version the installation should run, as a semantic version with a
                  leading v (v0.4.0). The installer Job runs the image for this version, which carries
                  that version's own manifests.
                pattern: ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$
                type: string
            required:
            - version
            type: object
          status:
            description: status defines the observed state of IchorInstallation
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the IchorInstallation resource. UpToDate is
                  True when installedVersion equals spec.version. An ExternalSuggested condition
                  from an older build is removed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effective:
                description: |-
                  effective shows each runtime setting with the value in force and where it came from.
                  Written by the controller.
                properties:
                  driftPolicy:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  manager:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  reclaimEnabled:
                    description: 'reclaimEnabled is deprecated: the controller no
                      longer reports it (ADR 0107).'
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  refreshLifetime:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  tokenTTL:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  updateCheck:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                type: object
              installedVersion:
                description: |-
                  installedVersion is the version of the running controller, reported by the controller
                  itself: the single source of "what is installed", which is also what the CLI compares
                  itself against (ADR 0059).
                type: string
              latestRelease:
                description: |-
                  latestRelease is the newest final release the controller found in the chart repository
                  (ADR 0114). Unset until the first check, and cleared while the check is off.
                properties:
                  checkedAt:
                    description: checkedAt is when the last check finished, successful
                      or not.
                    format: date-time
                    type: string
                  error:
                    description: error is the failure of the last check; empty after
                      a successful one.
                    type: string
                  version:
                    description: |-
                      version is the highest final release found, with a leading v. A failed check keeps the
                      value of the last good one.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the singleton must be named ichor
          rule: self.metadata.name == 'ichor'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
