{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ichorinstallations.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: IchorInstallation
    listKind: IchorInstallationList
    plural: ichorinstallations
    singular: ichorinstallation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Target
      type: string
    - jsonPath: .status.installedVersion
      name: Installed
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IchorInstallation is the Schema for the ichorinstallations API: Ichor's own version, a
          cluster-scoped singleton.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of IchorInstallation
            properties:
              autoPatch:
                description: |-
                  autoPatch lets the controller apply patch releases of the running minor by itself.
                  Off unless enabled here or by the chart.
                properties:
                  acknowledgedHalt:
                    description: |-
                      acknowledgedHalt is how a person clears a halt: the name of the operation (namespace/name) that halted
                      automatic patching, as status.autoPatch.haltedOperation shows it. The controller never edits spec, so it
                      reads this and resumes when it equals the halted operation; a later halt names another operation.
                    type: string
                  components:
                    description: |-
                      components are the components whose patches are applied automatically: talos, kubernetes, cilium.
                      Unset or empty means all three. cilium is accepted and does nothing: Cilium moves only to the chart the
                      running Ichor embeds, which a person starts.
                    items:
                      enum:
                      - talos
                      - kubernetes
                      - cilium
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  enabled:
                    description: |-
                      enabled turns automatic patching on or off. Unset falls back to the controller flag, which the chart
                      sets from autoPatch.enabled (default false).
                    type: boolean
                  window:
                    description: |-
                      window is a daily UTC window "HH:MM-HH:MM" in which an automatic upgrade may start; it may wrap
                      midnight (22:00-02:00). Unset means any time.
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                type: object
              defaults:
                description: defaults holds defaults for objects created later; an
                  existing object is never touched.
                properties:
                  driftPolicy:
                    description: |-
                      driftPolicy is the default for a new TalosCluster's spec.driftPolicy. It takes the
                      values of that field (warnOnly, autoCorrect) "enforce" is autoCorrect.
                    enum:
                    - warnOnly
                    - autoCorrect
                    type: string
                type: object
              deployment:
                description: deployment records who deploys this Ichor.
                properties:
                  manager:
                    description: manager is installer (the installer Job, `ichor init`)
                      or helm. Omitted means installer.
                    enum:
                    - installer
                    - helm
                    type: string
                type: object
              installerDigest:
                description: |-
                  installerDigest pins the installer image to a digest ("sha256:" and 64 hex digits). Unset, the
                  controller resolves the tag <version> in installerRepository itself when it creates the Job and
                  records the digest in status.installerImage. Set, it never resolves the tag, so the registry
                  is only asked for the signature (none when installerSignature says skip). Change it together with
                  version.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              installerRepository:
                default: ghcr.io/maeshinshin/ichor-installer
                description: |-
                  installerRepository is the image repository of the installer image; the Job runs
                  <installerRepository>@<digest>, where the digest is installerDigest or the one <version> resolves
                  to in that repository when the Job is created. Point it at a mirror or private registry
                  if you need to; a mirror has to carry the image's signature too (the OCI referrers), or
                  installerSignature has to say skip.
                minLength: 1
                type: string
              installerSignature:
                description: |-
                  installerSignature says how the signature of the installer image is checked before the Job runs.
                  Unset means required.
                properties:
                  mode:
                    default: required
                    description: mode is required (the default) or skip.
                    enum:
                    - required
                    - skip
                    type: string
                  reason:
                    description: |-
                      reason is deprecated: unused, kept so the schema never drops a field. skip no longer needs
                      one and nothing reads it.
                    maxLength: 512
                    type: string
                required:
                - mode
                type: object
              reclaim:
                description: |-
                  reclaim is deprecated and ignored: "Reset and add" has no installation switch;
                  RBAC alone (the reclaim verb on machinereclaims) decides who may use it. The field stays so
                  that an installed object keeps validating. The admission webhook warns when it is set.
                properties:
                  enabled:
                    description: enabled is deprecated and ignored.
                    type: boolean
                type: object
              updateCheck:
                description: updateCheck holds the switch for the check of newer Ichor
                  releases.
                properties:
                  enabled:
                    description: |-
                      enabled turns the check on or off. Unset falls back to the controller flag, which the chart
                      sets from updateCheck.enabled (default true). Off stops the registry request and removes
                      the controller's egress rule for it.
                    type: boolean
                type: object
              users:
                description: users holds the sign-in lifetimes.
                properties:
                  refreshLifetime:
                    description: refreshLifetime is the lifetime of a refresh token,
                      1h to 720h. Unset falls back to the flag.
                    type: string
                    x-kubernetes-validations:
                    - message: refreshLifetime must be between 1h and 720h
                      rule: duration(self) >= duration('1h') && duration(self) <=
                        duration('720h')
                  tokenTTL:
                    description: tokenTTL is the lifetime of an issued token, 1m to
                      1h. Unset falls back to the flag.
                    type: string
                    x-kubernetes-validations:
                    - message: tokenTTL must be between 1m and 1h
                      rule: duration(self) >= duration('1m') && duration(self) <=
                        duration('1h')
                type: object
                x-kubernetes-validations:
                - message: tokenTTL must not exceed refreshLifetime
                  rule: '!has(self.tokenTTL) || !has(self.refreshLifetime) || duration(self.tokenTTL)
                    <= duration(self.refreshLifetime)'
              version:
                description: |-
                  version is the Ichor version the installation should run, as a semantic version with a
                  leading v (v0.4.0). The installer Job runs the image for this version, which carries
                  that version's own manifests.
                pattern: ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$
                type: string
            required:
            - version
            type: object
          status:
            description: status defines the observed state of IchorInstallation
            properties:
              autoPatch:
                description: autoPatch is what the automatic patcher last did and
                  why it stopped.
                properties:
                  haltedOperation:
                    description: |-
                      haltedOperation is the automatic operation (namespace/name) that failed or paused and stopped
                      automatic patching; empty when it is not halted.
                    type: string
                  lastOperation:
                    description: lastOperation is the operation (namespace/name) the
                      patcher started last.
                    type: string
                  lastStartedAt:
                    description: lastStartedAt is when it started.
                    format: date-time
                    type: string
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the IchorInstallation resource. UpToDate is
                  True when installedVersion equals spec.version. An ExternalSuggested condition
                  from an older build is removed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effective:
                description: |-
                  effective shows each runtime setting with the value in force and where it came from.
                  Written by the controller.
                properties:
                  autoPatch:
                    description: autoPatch is "true" or "false".
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  autoPatchComponents:
                    description: autoPatchComponents is the comma-separated list of
                      components in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  autoPatchWindow:
                    description: autoPatchWindow is the daily UTC window in force;
                      empty means any time.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  driftPolicy:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  manager:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  reclaimEnabled:
                    description: 'reclaimEnabled is deprecated: the controller no
                      longer reports it.'
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  refreshLifetime:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  tokenTTL:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                  updateCheck:
                    description: IchorEffectiveValue is one setting in force.
                    properties:
                      source:
                        description: source is spec when the field is set, deployment
                          when the flag or chart value applies.
                        enum:
                        - spec
                        - deployment
                        type: string
                      value:
                        description: value is the setting as a string.
                        type: string
                    required:
                    - source
                    - value
                    type: object
                type: object
              installedVersion:
                description: |-
                  installedVersion is the version of the running controller, reported by the controller
                  itself: the single source of "what is installed", which is also what the CLI compares
                  itself against.
                type: string
              installerImage:
                description: |-
                  installerImage is the installer image the last Ichor upgrade ran, by digest, and whether its
                  signature was checked.
                properties:
                  digest:
                    description: digest is the image digest the Job runs, "sha256:...".
                    type: string
                  reason:
                    description: 'reason is deprecated: unused, kept so the schema
                      never drops a field. It is no longer written.'
                    type: string
                  repository:
                    description: repository is the image repository the Job pulled
                      from.
                    type: string
                  resolvedAt:
                    description: resolvedAt is when the controller resolved and checked
                      the image.
                    format: date-time
                    type: string
                  signer:
                    description: signer is the identity the signature matched (the
                      certificate subject pattern); empty when Skipped.
                    type: string
                  verification:
                    description: |-
                      verification is Verified when a cosign signature of the release workflow for version matched the
                      digest, Skipped when spec.installerSignature said skip.
                    enum:
                    - Verified
                    - Skipped
                    type: string
                  version:
                    description: version is the Ichor version the image was resolved
                      for.
                    type: string
                type: object
              latestRelease:
                description: |-
                  latestRelease is the newest final release the controller found in the chart repository. Unset until the first check, and cleared while the check is off.
                properties:
                  checkedAt:
                    description: checkedAt is when the last check finished, successful
                      or not.
                    format: date-time
                    type: string
                  error:
                    description: error is the failure of the last check; empty after
                      a successful one.
                    type: string
                  version:
                    description: |-
                      version is the highest final release found, with a leading v. A failed check keeps the
                      value of the last good one.
                    type: string
                type: object
              upgradeTargets:
                description: |-
                  upgradeTargets are the Talos and Kubernetes releases the controller found in their image
                  repositories. Unset until the first check, and cleared while the check is off.
                properties:
                  checkedAt:
                    description: checkedAt is when the last listing finished, successful
                      or not.
                    format: date-time
                    type: string
                  cilium:
                    description: |-
                      cilium is deprecated and unused. It held the Cilium patches whose images verified; Cilium now moves only to the chart the running Ichor embeds (amendment 2026-11-04 (3)), so
                      the controller no longer writes it and clears what an earlier controller wrote. Kept so the schema does
                      not lose a field an installed build had.
                    items:
                      type: string
                    type: array
                  ciliumError:
                    description: 'ciliumError is deprecated and unused, like cilium:
                      the controller no longer lists Cilium releases.'
                    type: string
                  error:
                    description: error is the failure of the last listing; a list
                      that failed keeps its last good value.
                    type: string
                  kubernetes:
                    description: kubernetes are the final Kubernetes releases, newest
                      first, with a leading v.
                    items:
                      type: string
                    type: array
                  kubernetesError:
                    description: kubernetesError is why the last listing of the Kubernetes
                      releases failed; empty when it succeeded.
                    type: string
                  talos:
                    description: talos are the final Talos releases, newest first,
                      with a leading v.
                    items:
                      type: string
                    type: array
                  talosError:
                    description: |-
                      talosError is why the last listing of the Talos releases failed; empty when it succeeded. The
                      other lists are unaffected.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the singleton must be named ichor
          rule: self.metadata.name == 'ichor'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
