{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: talosclusters.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: TalosCluster
    listKind: TalosClusterList
    plural: talosclusters
    shortNames:
    - tcl
    singular: taloscluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.talosVersion
      name: Talos
      type: string
    - jsonPath: .spec.kubernetesVersion
      name: Kubernetes
      type: string
    - jsonPath: .spec.controlPlane.count
      name: Control Plane
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosCluster is the Schema for the talosclusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TalosCluster
            properties:
              controlPlane:
                description: controlPlane configures the control-plane topology.
                properties:
                  count:
                    description: count is the number of control-plane nodes; 2 and
                      4 are rejected because they don't improve etcd availability
                      over 1 or 3.
                    enum:
                    - 1
                    - 3
                    - 5
                    format: int32
                    type: integer
                  schedulable:
                    description: schedulable controls whether control planes accept
                      workloads; required with no default because nothing on the object
                      can resolve an auto value before any machine exists (ADR 0008).
                    enum:
                    - "true"
                    - "false"
                    type: string
                required:
                - count
                - schedulable
                type: object
              driftPolicy:
                default: warnOnly
                description: |-
                  driftPolicy controls what the reconciler does when a node's live configuration no
                  longer matches what Ichor last rendered for it, and nothing on Ichor's side (this
                  TalosCluster, a TalosConfigPatch, or the TalosMachine) has changed since Ichor last
                  confirmed the two matched: warnOnly leaves the node as it is and reports the drift
                  through a condition; autoCorrect re-applies, but only when every changed field is
                  reboot-free (pkg/fieldmeta) -- a reboot-requiring or install-time-only drift is always
                  just reported, regardless of this setting. Defaults to warnOnly: unlike
                  controlPlane.schedulable (ADR 0008), the two values here are not wrong half the
                  time each -- silently changing a node is the one that can surprise, so it is never
                  the default.
                enum:
                - warnOnly
                - autoCorrect
                type: string
              endpoint:
                description: endpoint is the cluster's control-plane endpoint.
                properties:
                  address:
                    description: 'address is the endpoint''s address: an IP for vip/node,
                      or a hostname for loadBalancer/dns.'
                    minLength: 1
                    type: string
                  type:
                    description: type is the kind of address the endpoint resolves
                      through.
                    enum:
                    - vip
                    - loadBalancer
                    - dns
                    - node
                    type: string
                required:
                - address
                - type
                type: object
              kubernetesVersion:
                description: kubernetesVersion is the Kubernetes release this cluster
                  runs.
                pattern: ^v\d+\.\d+\.\d+$
                type: string
              schematic:
                description: schematic is the Image Factory schematic used for this
                  cluster's installer image.
                properties:
                  id:
                    description: id is the Image Factory schematic ID.
                    minLength: 1
                    type: string
                required:
                - id
                type: object
              secretsRef:
                description: secretsRef names the Secret holding the Talos, Kubernetes
                  and etcd CA bundle, in this TalosCluster's namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: secretsRef.name is required
                  rule: self.name != ''
              talosVersion:
                description: talosVersion is the Talos release this cluster renders
                  configuration for.
                pattern: ^v\d+\.\d+\.\d+$
                type: string
              versionContract:
                description: versionContract is required rather than defaulted, so
                  that a machinery bump cannot silently change what gets applied (ADR
                  0004, principle 4).
                pattern: ^v\d+\.\d+$
                type: string
            required:
            - controlPlane
            - endpoint
            - kubernetesVersion
            - secretsRef
            - talosVersion
            - versionContract
            type: object
          status:
            description: status defines the observed state of TalosCluster
            properties:
              conditions:
                description: conditions represent the current state of the TalosCluster
                  resource, kstatus-compatible.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the most recent generation the
                  controller has reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
