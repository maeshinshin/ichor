                description: controlPlane configures the control-plane topology.
                properties:
                  count:
                    description: count is the number of control-plane nodes; 2 and
                      4 are rejected because they don't improve etcd availability
                      over 1 or 3.
                    enum:
                    - 1
                    - 3
                    - 5
                    format: int32
                    type: integer
                  schedulable:
                    description: schedulable controls whether control planes accept
                      workloads; required with no default because nothing on the object
                      can resolve an auto value before any machine exists.
                    enum:
                    - "true"
                    - "false"
                    type: string
                required:
                - count
                - schedulable
                type: object
              controlPlaneMetrics:
                description: |-
                  controlPlaneMetrics exposes the control-plane metrics Talos binds locally and restricts
                  scraping to a CIDR. Unset (the default) leaves the Talos defaults alone.
                properties:
                  allowedCIDRs:
                    description: |-
                      allowedCIDRs are the only sources that may reach the metrics ports (TCP 10257, 10259 and
                      2381) on control-plane nodes. Every other port keeps Talos's default firewall action
                      (accept). A prefix length of 0 is rejected: that would be no restriction at all.
                    items:
                      maxLength: 43
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-validations:
                    - message: allowedCIDRs must be valid CIDRs with a prefix length
                        above 0
                      rule: self.all(c, isCIDR(c) && cidr(c).prefixLength() > 0)
                  enabled:
                    default: false
                    description: |-
                      enabled binds the metrics endpoints on all addresses and adds ingress firewall rules that
                      drop connections to those ports from any source outside allowedCIDRs.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: 'allowedCIDRs needs at least one CIDR when enabled: the
                    metrics are never exposed without a source restriction'
                  rule: '!self.enabled || (has(self.allowedCIDRs) && self.allowedCIDRs.size()
                    > 0)'
