                        secret, so they stay a plain typed field here rather than behind a reference. Checked
                        here, not left to machinery: pkg/machinery/config/types/v1alpha1's own ValidateAtRuntime
                        has no validator at all for RegistryMirrorConfig/RegistryConfig, so an
                        endpoint shaped wrong would otherwise reach a node's machine config unexamined, exactly
                        the gap spec.discovery's own CEL above already closes for its addresses.
                      items:
                        maxLength: 2048
                        type: string
                      maxItems: 8
                      minItems: 1
                      type: array
                      x-kubernetes-validations:
                      - message: endpoints must be valid URLs
                        rule: self.all(e, isURL(e))
                    host:
                      description: |-
                        host is the registry host (and port, if not the default) this entry's mirror and
                        credentials apply to, matching RegistriesConfig's own map key: the first segment of an
                        image reference, "docker.io" being the default one, or "*" for a fallback mirror. TLS
                        config (RegistryConfig.tls) uses the same key but never the "*" fallback; this field
                        carries both mirror and auth, so "*" is only meaningful when authSecretRef is unset.
                      maxLength: 255
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: host must be "*" or a hostname[:port]
                        rule: self == '*' || self.matches('^[a-zA-Z0-9.-]+(:[0-9]{1,5})?$')
                    overridePath:
                      description: |-
                        overridePath makes the nodes use every endpoint's path as given, without adding the
                        /v2/ suffix (RegistryMirrorConfig.endpoints[].overridePath). It applies to all of this
                        entry's endpoints; Talos allows it per endpoint, and a mix cannot be recorded here.
                      type: boolean
                    skipFallback:
                      description: |-
                        skipFallback stops nodes falling back to host itself when none of the endpoints has the
                        image (RegistryMirrorConfig.skipFallback). Default false, Talos's own default.
                      type: boolean
                    username:
                      description: |-
                        username is this registry's non-secret auth username (RegistryAuthConfig.username). Optional: some private
                        registries authenticate on password/token alone.
                      type: string
                  required:
                  - endpoints
                  - host
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - host
                x-kubernetes-list-type: map
              schematic:
                description: schematic is the Image Factory schematic used for this
                  cluster's installer image.
                properties:
                  id:
                    description: id is the Image Factory schematic ID.
                    minLength: 1
                    type: string
                required:
                - id
                type: object
              secretsRef:
                description: |-
                  secretsRef names the Secret holding the Talos, Kubernetes and etcd CA bundle. The Secret lives in the
                  controller's own namespace (not necessarily this TalosCluster's), because Kubernetes RBAC cannot restrict
                  Secret reads to "wherever the referencing TalosCluster happens to live" at anything narrower than
                  cluster-wide.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: secretsRef.name is required
                  rule: self.name != ''
              security:
                description: |-
                  security holds opt-in hardening of this cluster: an ingress firewall, Cilium
                  WireGuard encryption, Pod Security levels, an audit policy preset and disk encryption.
                  Unset (the default) changes nothing.
                properties:
                  audit:
                    description: |-
                      audit selects a kube-apiserver audit policy preset. Restarts the kube-apiserver on every
                      control plane, no node reboot. Needs versionContract v1.14 or later.
                    properties:
                      policy:
                        description: |-
                          policy is the preset. metadata records who did what, without bodies, for every request
                          (Talos's own default). rbacChanges is metadata plus the full request and response of
                          changes to roles and bindings. writes is metadata plus the request body of every change.
                          Secrets, configmaps, service account tokens and token reviews are never logged above
                          metadata in any preset.
                        enum:
                        - metadata
                        - rbacChanges
                        - writes
                        type: string
                    required:
                    - policy
                    type: object
                  diskEncryption:
                    description: |-
                      diskEncryption encrypts the STATE and EPHEMERAL volumes with LUKS2. Talos encrypts a
                      volume only when it creates it, so on a cluster that already has machines it needs the
                      wipe-and-rejoin path (see docs/guides/hardening.md) and the confirm annotation.
                    properties:
                      kmsEndpoint:
                        description: |-
                          kmsEndpoint is the KMS server, as a URL with a scheme (https://kms.example.com:4443). A
                          scheme other than https is refused.
                        maxLength: 253
                        type: string
                      requireSecureBoot:
                        description: |-
                          requireSecureBoot makes enrolling a TPM key fail unless SecureBoot is enabled in the
                          firmware. Without SecureBoot a TPM key gives no boot-chain protection.
                        type: boolean
                      type:
                        description: |-
                          type is where the key comes from. tpm seals it in the machine's TPM 2.0 (bound to PCR 7);
                          nodeID derives it from the node UUID, which protects only against a removed disk; kms has
                          a KMS server seal and unseal it.
                        enum:
                        - tpm
                        - nodeID
                        - kms
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: kmsEndpoint is required for type kms and not allowed
                        otherwise
                      rule: 'self.type == ''kms'' ? has(self.kmsEndpoint) && self.kmsEndpoint
                        != ” : !has(self.kmsEndpoint)'
                    - message: requireSecureBoot applies to type tpm only
                      rule: self.type == 'tpm' || !has(self.requireSecureBoot)
                  firewall:
                    description: |-
                      firewall turns on Talos's ingress firewall in block mode with the rules a Talos cluster
                      needs, plus the sources you list. No reboot.
                    properties:
                      allow:
                        description: |-
                          allow opens further host ports, for services running with host networking (an ingress
                          controller on 80 and 443, a node exporter). Everything not listed is blocked.
                        items:
                          description: TalosClusterFirewallRule is one extra firewall
                            rule of spec.security.firewall.allow.
                          properties:
                            cidrs:
                              description: cidrs are the sources allowed to reach
                                the ports.
                              items:
                                maxLength: 43
                                type: string
                              maxItems: 16
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: atomic
                              x-kubernetes-validations:
                              - message: cidrs must be valid CIDRs
                                rule: self.all(c, isCIDR(c))
                            name:
                              description: name identifies the rule; it becomes ichor-fw-allow-<name>
                                in the machine config.
                              pattern: ^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$
                              type: string
                            ports:
                              description: ports are single ports ("443") or inclusive
                                ranges ("8000-8100").
                              items:
                                pattern: ^[0-9]{1,5}(-[0-9]{1,5})?$
                                type: string
                              maxItems: 16
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: atomic
                            protocol:
                              description: protocol is tcp or udp.
                              enum:
                              - tcp
                              - udp
                              type: string
                          required:
                          - cidrs
                          - name
                          - ports
                          - protocol
                          type: object
                        maxItems: 32
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      apiServerCIDRs:
                        description: |-
                          apiServerCIDRs are further sources allowed to reach the Kubernetes API (6443), for users and
                          load balancers.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: apiServerCIDRs must be valid CIDRs
                          rule: self.all(c, isCIDR(c))
                      controlPlaneCIDRs:
                        description: |-
                          controlPlaneCIDRs are the addresses of the control planes only; etcd and the control planes'
                          own reach to apid and the kubelet are limited to them. Unset means nodeCIDRs.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: controlPlaneCIDRs must be valid CIDRs with a prefix
                            length above 0
                          rule: self.all(c, isCIDR(c) && cidr(c).prefixLength() >
                            0)
                      controllerCIDRs:
                        description: |-
                          controllerCIDRs are the addresses Ichor's controller connects from. They are always allowed
                          to reach apid and the Kubernetes API. The admission webhook refuses a value that does not
                          contain the address the controller reaches the cluster endpoint from.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: controllerCIDRs must be valid CIDRs with a prefix
                            length above 0
                          rule: self.all(c, isCIDR(c) && cidr(c).prefixLength() >
                            0)
                      enabled:
                        default: false
                        description: enabled turns the firewall on.
                        type: boolean
                      kubeSpan:
                        description: |-
                          kubeSpan allows KubeSpan's WireGuard port (UDP 51820) from anywhere; set it when the
                          cluster uses KubeSpan.
                        type: boolean
                      nodeCIDRs:
                        description: nodeCIDRs are the addresses of all the cluster's
                          machines, control planes and workers.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: nodeCIDRs must be valid CIDRs with a prefix length
                            above 0
                          rule: self.all(c, isCIDR(c) && cidr(c).prefixLength() >
                            0)
                      talosAPICIDRs:
                        description: talosAPICIDRs are further sources allowed to
                          reach apid (50000), for operators using talosctl.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: talosAPICIDRs must be valid CIDRs
                          rule: self.all(c, isCIDR(c))
                    type: object
                    x-kubernetes-validations:
                    - message: 'controllerCIDRs and nodeCIDRs need at least one CIDR
                        when enabled: without them Ichor or the nodes would lose access'
                      rule: '!self.enabled || (has(self.controllerCIDRs) && self.controllerCIDRs.size()
                        > 0 && has(self.nodeCIDRs) && self.nodeCIDRs.size() > 0)'
                  podSecurity:
                    description: |-
                      podSecurity sets the Pod Security admission levels of the kube-apiserver. Restarts the
                      kube-apiserver on every control plane, no node reboot. Needs versionContract v1.14 or later.
                    properties:
                      audit:
                        description: audit is the level above which violations are
                          recorded in the audit log.
                        enum:
                        - privileged
                        - baseline
                        - restricted
                        type: string
                      enforce:
                        description: enforce is the level a pod must meet to be admitted.
                        enum:
                        - privileged
                        - baseline
                        - restricted
                        type: string
                      exemptNamespaces:
                        description: exemptNamespaces are added to the exempt namespaces
                          (kube-system stays exempt).
                        items:
                          maxLength: 63
                          type: string
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: set
                      warn:
                        description: warn is the level above which violations produce
                          a warning to the client.
                        enum:
                        - privileged
                        - baseline
                        - restricted
                        type: string
                    type: object
                  wireGuard:
                    description: |-
                      wireGuard turns on Cilium's transparent WireGuard encryption of pod traffic between nodes.
                      A rolling restart of the Cilium agents, no node reboot.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          enabled sets encryption.enabled=true and encryption.type=wireguard in the managed Cilium
                          values. It wins over any encryption.* the user values set. When the firewall is on, UDP
                          51871 is opened between nodes.
                        type: boolean
                      nodeEncryption:
                        description: |-
                          nodeEncryption also encrypts node-to-node traffic that is not pod traffic
                          (encryption.nodeEncryption).
                        type: boolean
                    type: object
                type: object
              talosVersion:
                description: talosVersion is the Talos release this cluster renders
                  configuration for.
                pattern: ^v\d+\.\d+\.\d+$
                type: string
              versionContract:
                description: versionContract is required rather than defaulted, so
                  that a machinery bump cannot silently change what gets applied (principle 4).
                pattern: ^v\d+\.\d+$
                type: string
            required:
            - controlPlane
            - endpoint
            - kubernetesVersion
            - secretsRef
            - talosVersion
            - versionContract
            type: object
          status:
            description: status defines the observed state of TalosCluster
            properties:
              certificates:
                description: |-
                  certificates lists when each cluster certificate authority in the secrets
                  bundle expires, so an approaching expiry is visible before it locks anyone
                  out. Read from the bundle, never from a node.
                items:
                  description: CertificateExpiry is one certificate authority's end
                    of validity.
                  properties:
                    name:
                      description: 'name is which authority: talos, kubernetes, kubernetes-aggregator
                        or etcd.'
                      maxLength: 63
                      minLength: 1
                      type: string
                    notAfter:
                      description: notAfter is the certificate's last instant of validity.
                      format: date-time
                      type: string
                  required:
                  - name
                  - notAfter
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              cni:
                description: cni is the observed CNI state that is not a spec ingredient.
                properties:
                  appliedValuesHash:
                    description: |-
                      appliedValuesHash is the hash of the effective Cilium values the last successful Helm Job
                      applied. The controller starts a new Job when the hash of
                      spec.cni.cilium.values (merged with Ichor's defaults) differs from it. Written by the
                      controller only.
                    type: string
                  availableChartVersion:
                    description: |-
                      availableChartVersion is the Cilium chart version the running Ichor ships when it differs
                      from the installed release; empty when up to date. It backs the
                      CiliumUpgradeAvailable condition.
                    type: string
                  detected:
                    description: |-
                      detected is the CNI the cluster is observed to run, read-only display and the
                      network-policy gate. Written by the controller only.
                    enum:
                    - cilium
                    - flannel
                    - calico
                    - other
                    - none
                    type: string
                  detectedVersion:
                    description: detectedVersion is the image tag of the detected
                      CNI's DaemonSet where one exposes it.
                    type: string
                  kubeProxy:
                    description: |-
                      kubeProxy is the mode the Talos side (cluster.proxy.disabled) is rendered for. Unset until
                      a kube-proxy switch first runs, which means "render whatever the patches say"; once set,
                      pkg/render appends it as the last patch, so it wins over any patch. Only the
                      TalosOperation of kind cni writes it, and only after the new side is verified.
                    enum:
                    - enabled
                    - replaced
                    type: string
                  takenOverInlineManifest:
                    description: |-
                      takenOverInlineManifest is the name of the cluster.inlineManifests entry of the adopted
                      machines that held the Cilium DaemonSet Ichor took over, which pkg/render stops rendering
                      once CNIHandover is True. The controller copies it from the
                      TalosClusterCNIInlineManifestAnnotation when the hand-over completes; empty when the
                      adopted Cilium was not in an inline manifest.
                    type: string
                type: object
              conditions:
                description: conditions represent the current state of the TalosCluster
                  resource, kstatus-compatible.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the most recent generation the
                  controller has reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
