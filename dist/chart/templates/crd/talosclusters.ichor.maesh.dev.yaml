                    type: object
                  kubeProxy:
                    default: enabled
                    description: |-
                      kubeProxy is enabled (Talos's own default) or replaced by the CNI. Replacing it splits the
                      setting across two owners -- Talos (cluster.proxy.disabled, written by Ichor) and the CNI
                      (written by Argo CD) -- so a consistency check reads the CNI's live configuration and
                      reports a mismatch as a health failure.
                    enum:
                    - enabled
                    - replaced
                    type: string
                  preset:
                    default: cilium
                    description: |-
                      preset selects the CNI this cluster bootstraps. Cilium is the only CNI Ichor installs; unmanaged leaves the CNI of an adopted cluster exactly as it is, and
                      the webhook accepts it on create only for an object carrying the adoption annotation. The
                      values flannel and custom are deprecated, unused and kept so the CRD never drops a value.
                    enum:
                    - flannel
                    - cilium
                    - custom
                    - unmanaged
                    type: string
                  tunnel:
                    description: |-
                      tunnel is Cilium's tunnel protocol. It only applies to the cilium preset; empty means
                      Cilium's default (vxlan). Immutable once set.
                    enum:
                    - vxlan
                    - geneve
                    type: string
                  unmanaged:
                    description: |-
                      unmanaged configures the unmanaged preset. Only valid when preset is unmanaged;
                      when omitted there, talosCNI is default.
                    properties:
                      talosCNI:
                        default: default
                        description: |-
                          talosCNI is default (the machine config has no CNI selection, so Talos runs its own
                          flannel or whatever cluster.network.cni selects by default; render emits nothing about the
                          CNI) or none (render emits cluster.network.cni.name: none).
                        enum:
                        - default
                        - none
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: cni.preset cannot change after the cluster is created;
                    swapping a CNI takes the network down
                  rule: self.preset == oldSelf.preset
                - message: custom must be set when, and only when, preset is custom
                  rule: 'self.preset == ''custom'' ? has(self.custom) : !has(self.custom)'
                - message: flannel cannot replace kube-proxy
                  rule: self.preset != 'flannel' || self.kubeProxy == 'enabled'
                - message: cni.tunnel cannot change once set, and an existing cluster
                    can only record vxlan (its running default); changing the tunnel
                    protocol takes pod networking down
                  rule: 'has(oldSelf.tunnel) ? (has(self.tunnel) && self.tunnel ==
                    oldSelf.tunnel) : (!has(self.tunnel) || self.tunnel == ''vxlan'')'
                - message: cni.tunnel only applies to the cilium preset
                  rule: '!has(self.tunnel) || self.preset == ''cilium'''
                - message: cni.cilium only applies to the cilium preset; Ichor does
                    not manage the CNI when preset is unmanaged
                  rule: self.preset != 'unmanaged' || !has(self.cilium)
                - message: cni.unmanaged only applies to the unmanaged preset
                  rule: '!has(self.unmanaged) || self.preset == ''unmanaged'''
