{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: talosclusters.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: TalosCluster
    listKind: TalosClusterList
    plural: talosclusters
    shortNames:
    - tcl
    singular: taloscluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.talosVersion
      name: Talos
      type: string
    - jsonPath: .spec.kubernetesVersion
      name: Kubernetes
      type: string
    - jsonPath: .spec.controlPlane.count
      name: Control Plane
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Transitioning')].status
      name: Transitioning
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosCluster is the Schema for the talosclusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TalosCluster
            properties:
              authentication:
                description: |-
                  authentication declares who the kube-apiserver trusts to sign users in with a JWT: Ichor's
                  own issuer and up to three external OIDC providers. It is rendered into Talos's
                  KubeAuthenticationConfig document, so it needs versionContract v1.14 or later, and changing
                  it needs the update verb on talosclusters/authentication. Unset (the default) renders the
                  Talos default: no JWT authenticator, anonymous access to the health endpoints only.
                properties:
                  external:
                    description: |-
                      external lists the external OIDC providers the kube-apiserver also trusts. Keep it equal
                      to ichorUI.oidc.*: that is what the UI signs in against, this is what the
                      kube-apiserver accepts.
                    items:
                      description: TalosClusterExternalIssuer is one external OIDC
                        provider (as the kube-apiserver sees it).
                      properties:
                        audiences:
                          description: audiences are the accepted aud values (the
                            OIDC client IDs).
                          items:
                            maxLength: 253
                            minLength: 1
                            type: string
                          maxItems: 8
                          minItems: 1
                          type: array
                        certificateAuthority:
                          description: |-
                            certificateAuthority is a PEM bundle (public certificates only) that verifies the provider's
                            TLS certificate. Empty uses the control plane's system roots.
                          maxLength: 65536
                          type: string
                        groupsClaim:
                          default: groups
                          description: groupsClaim is the token claim that lists the
                            user's groups.
                          maxLength: 63
                          minLength: 1
                          type: string
                        groupsPrefix:
                          default: 'oidc:'
                          description: groupsPrefix is put in front of every group,
                            with the same restrictions as usernamePrefix.
                          maxLength: 63
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: 'the prefix ichor: is reserved for Ichor''s own
                              groups'
                            rule: '!self.startsWith(''ichor:'')'
                        issuerURL:
                          description: issuerURL is the provider's issuer, an https
                            URL without query or fragment.
                          maxLength: 253
                          pattern: ^https://[^\s/?#@]+(/[^\s?#]*)?$
                          type: string
                        usernameClaim:
                          default: email
                          description: usernameClaim is the token claim that names
                            the user.
                          maxLength: 63
                          minLength: 1
                          type: string
                        usernamePrefix:
                          default: 'oidc:'
                          description: |-
                            usernamePrefix is put in front of every username. It cannot be empty or start with
                            "ichor:", so an external user can never be mistaken for an Ichor user.
                          maxLength: 63
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: 'the prefix ichor: is reserved for Ichor''s own
                              users'
                            rule: '!self.startsWith(''ichor:'')'
                      required:
                      - audiences
                      - issuerURL
                      type: object
                    maxItems: 3
                    type: array
                    x-kubernetes-list-map-keys:
                    - issuerURL
                    x-kubernetes-list-type: map
                  ichor:
                    description: |-
                      ichor turns on Ichor's own OIDC issuer (ichor-ui) as a kube-apiserver authenticator.
                      Users appear as ichor:<name>, groups as ichor:<role>.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          enabled renders Ichor's issuer into the kube-apiserver. It needs the trust ConfigMap
                          ichor-oidc-trust (the controller publishes it); without it the render fails and says so.
                        type: boolean
                      url:
                        description: url is the external https URL of ichor-ui. It
                          is the issuer (the iss claim of every token).
                        maxLength: 253
                        pattern: ^https://[^\s/?#@]+(/[^\s?#]*)?$
                        type: string
                    required:
                    - url
                    type: object
                type: object
              certSANs:
                description: |-
                  certSANs are extra subject alternative names (hostnames, IPs) for the Talos API certificate
                  of every node and for the kube-apiserver serving certificate: machine.certSANs and
                  KubeAPIServerConfig.certExtraSANs, which Talos's generator writes together from one list.
                  The cluster endpoint host is not added for you here; list it if the nodes should serve it.
                  Unset adds none.
                items:
                  maxLength: 253
                  type: string
                maxItems: 64
                type: array
              cni:
                default:
                  kubeProxy: enabled
                  preset: cilium
                description: |-
                  cni configures which CNI preset this cluster bootstraps and how kube-proxy is split
                  between Talos and the CNI (docs/design/architecture.md, "CNI").
                properties:
                  cilium:
                    description: cilium holds the user layer of Cilium's Helm values.
                    properties:
                      values:
                        description: |-
                          values is the user layer of Cilium's Helm values. Effective values are Ichor's defaults,
                          then these deep-merged on top, then the Ichor-owned keys (ipam.mode,
                          securityContext.capabilities.ciliumAgent, securityContext.capabilities.cleanCiliumState,
                          cgroup.autoMount.enabled, cgroup.hostRoot, k8sServiceHost, k8sServicePort,
                          kubeProxyReplacement, tunnelProtocol); a value for an owned key is a validation error.
                          The merged values must stay under 64 KiB.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    type: object
                  custom:
                    description: |-
                      custom is deprecated, unused; kept so the CRD never drops a field. It declared
                      the chart/manifest source for a user-supplied CNI.
                    properties:
                      source:
                        description: source points at the chart or manifests for this
                          CNI.
                        properties:
                          chart:
                            description: chart is a Helm chart name within repoURL;
                              set instead of path.
                            type: string
                          path:
                            description: path is a directory within repoURL holding
                              plain manifests; set instead of chart.
                            type: string
                          repoURL:
                            description: repoURL is the Git or Helm repository the
                              CNI is fetched from.
                            minLength: 1
                            type: string
                          targetRevision:
                            description: targetRevision is the Git ref or chart version
                              to fetch.
                            minLength: 1
                            type: string
                        required:
                        - repoURL
                        - targetRevision
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of chart or path must be set
                          rule: '(has(self.chart) ? 1 : 0) + (has(self.path) ? 1 :
                            0) == 1'
                    required:
                    - source
                    type: object
                  kubeProxy:
                    default: enabled
                    description: |-
                      kubeProxy is enabled (Talos's own default) or replaced by the CNI. Replacing it splits the
                      setting across two places -- Talos (cluster.proxy.disabled) and the Cilium release
                      (kubeProxyReplacement), both written by Ichor -- so a consistency check reads the CNI's live configuration and
                      reports a mismatch as a health failure.
                    enum:
                    - enabled
                    - replaced
                    type: string
                  preset:
                    default: cilium
                    description: |-
                      preset selects the CNI this cluster bootstraps. Cilium is the only CNI Ichor installs; unmanaged leaves the CNI
                      of an adopted cluster exactly as it is, and
                      the webhook accepts it on create only for an object carrying the adoption annotation. The
                      values flannel and custom are deprecated, unused and kept so the CRD never drops a value.
                    enum:
                    - flannel
                    - cilium
                    - custom
                    - unmanaged
                    type: string
                  tunnel:
                    description: |-
                      tunnel is Cilium's tunnel protocol. It only applies to the cilium preset; empty means
                      Cilium's default (vxlan). Immutable once set.
                    enum:
                    - vxlan
                    - geneve
                    type: string
                  unmanaged:
                    description: |-
                      unmanaged configures the unmanaged preset. Only valid when preset is unmanaged;
                      when omitted there, talosCNI is default.
                    properties:
                      talosCNI:
                        default: default
                        description: |-
                          talosCNI is default (the machine config has no CNI selection, so Talos runs its own
                          flannel or whatever cluster.network.cni selects by default; render emits nothing about the
                          CNI) or none (render emits cluster.network.cni.name: none).
                        enum:
                        - default
                        - none
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: cni.preset cannot change after the cluster is created;
                    swapping a CNI takes the network down
                  rule: self.preset == oldSelf.preset
                - message: custom must be set when, and only when, preset is custom
                  rule: 'self.preset == ''custom'' ? has(self.custom) : !has(self.custom)'
                - message: flannel cannot replace kube-proxy
                  rule: self.preset != 'flannel' || self.kubeProxy == 'enabled'
                - message: cni.tunnel cannot change once set, and an existing cluster
                    can only record vxlan (its running default); changing the tunnel
                    protocol takes pod networking down
                  rule: 'has(oldSelf.tunnel) ? (has(self.tunnel) && self.tunnel ==
                    oldSelf.tunnel) : (!has(self.tunnel) || self.tunnel == ''vxlan'')'
                - message: cni.tunnel only applies to the cilium preset
                  rule: '!has(self.tunnel) || self.preset == ''cilium'''
                - message: cni.cilium only applies to the cilium preset; Ichor does
                    not manage the CNI when preset is unmanaged
                  rule: self.preset != 'unmanaged' || !has(self.cilium)
                - message: cni.unmanaged only applies to the unmanaged preset
                  rule: '!has(self.unmanaged) || self.preset == ''unmanaged'''
              containerd:
                description: |-
                  containerd holds typed settings for the containerd instance every node runs. Unset (the
                  default) changes nothing.
                properties:
                  deviceOwnershipFromSecurityContext:
                    description: |-
                      deviceOwnershipFromSecurityContext sets containerd's device_ownership_from_security_context, so
                      a container's block and character devices are owned by the pod's runAsUser and fsGroup instead
                      of root. Non-root workloads such as KubeVirt VMs and CDI importers need it to open a
                      volumeMode: Block volume. A containerd restart on every node, no node reboot; pods already
                      running keep their device ownership until they are recreated. Needs versionContract v1.14 or
                      later. False (the default) renders nothing.
                    type: boolean
                type: object
              controlPlane:
                description: controlPlane configures the control-plane topology.
                properties:
                  count:
                    description: count is the number of control-plane nodes; 2 and
                      4 are rejected because they don't improve etcd availability
                      over 1 or 3.
                    enum:
                    - 1
                    - 3
                    - 5
                    format: int32
                    type: integer
                  omitDefaultNodeLabels:
                    description: |-
                      omitDefaultNodeLabels renders the control planes without the labels Talos's generator adds
                      to them (node-role.kubernetes.io/control-plane and
                      node.kubernetes.io/exclude-from-external-load-balancers). `ichor adopt` sets it when the
                      control planes it takes over do not carry them, so that adopting does not change the
                      nodes: the exclude label removes a node from Service type=LoadBalancer membership. A
                      cluster Ichor creates leaves it unset and gets Talos's defaults.
                    type: boolean
                  schedulable:
                    description: |-
                      schedulable controls whether control planes accept workloads; required with no default because nothing on the
                      object can resolve an auto value before any machine exists.
                    enum:
                    - "true"
                    - "false"
                    type: string
                required:
                - count
                - schedulable
                type: object
              controlPlaneMetrics:
                description: |-
                  controlPlaneMetrics exposes the control-plane metrics Talos binds locally and restricts
                  scraping to a CIDR. Unset (the default) leaves the Talos defaults alone.
                properties:
                  allowedCIDRs:
                    description: |-
                      allowedCIDRs are the only sources that may reach the metrics ports (TCP 10257, 10259 and
                      2381) on control-plane nodes. Every other port keeps Talos's default firewall action
                      (accept). A prefix length of 0 is rejected: that would be no restriction at all.
                    items:
                      maxLength: 43
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-validations:
                    - message: allowedCIDRs must be valid CIDRs with a prefix length
                        above 0
                      rule: self.all(c, isCIDR(c) && cidr(c).prefixLength() > 0)
                  enabled:
                    default: false
                    description: |-
                      enabled binds the metrics endpoints on all addresses and adds ingress firewall rules that
                      drop connections to those ports from any source outside allowedCIDRs.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: 'allowedCIDRs needs at least one CIDR when enabled: the
                    metrics are never exposed without a source restriction'
                  rule: '!self.enabled || (has(self.allowedCIDRs) && self.allowedCIDRs.size()
                    > 0)'
              discovery:
                description: |-
                  discovery lists maintenance-mode candidates for the controller to probe directly. Empty (the
                  default) disables discovery: the controller opens no connection at all.
                properties:
                  addresses:
                    description: addresses are specific IPv4 candidates to probe,
                      each on Talos's fixed maintenance API port.
                    items:
                      maxLength: 15
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-validations:
                    - message: addresses must be IPv4 addresses
                      rule: self.all(a, isIP(a) && ip(a).family() == 4)
                  cidrs:
                    description: |-
                      cidrs are IPv4 address ranges to probe, one maintenance-mode connection attempt per address
                      in range. Each must be /24 or smaller (at most 256 addresses).
                    items:
                      maxLength: 18
                      type: string
                    maxItems: 4
                    type: array
                    x-kubernetes-validations:
                    - message: cidrs must be IPv4 and /24 or smaller
                      rule: self.all(c, isCIDR(c) && cidr(c).ip().family() == 4 &&
                        cidr(c).prefixLength() >= 24)
                type: object
              driftPolicy:
                description: |-
                  driftPolicy controls what the reconciler does when a node's live configuration no
                  longer matches what Ichor last rendered for it, and nothing on Ichor's side (this
                  TalosCluster, a TalosConfigPatch, or the TalosMachine) has changed since Ichor last
                  confirmed the two matched: warnOnly leaves the node as it is and reports the drift
                  through a condition; autoCorrect re-applies, but only when every changed field is
                  reboot-free (pkg/fieldmeta) -- a reboot-requiring or install-time-only drift is always
                  just reported, regardless of this setting. Defaults to warnOnly: unlike
                  controlPlane.schedulable, the two values here are not wrong half the
                  time each -- silently changing a node is the one that can surprise, so it is never
                  the default. The CRD carries no default: the defaulting webhook fills warnOnly, or the
                  installation's spec.defaults.driftPolicy, at create; an empty value is warnOnly.
                enum:
                - warnOnly
                - autoCorrect
                type: string
              endpoint:
                description: endpoint is the cluster's control-plane endpoint.
                properties:
                  address:
                    description: |-
                      address is the endpoint's address: an IP for vip, or an IP or a DNS host name for node, where the name is
                      the load balancer's when one is in front of the control planes.
                    minLength: 1
                    type: string
                  type:
                    description: |-
                      type is the kind of address the endpoint resolves through. vip is an address Ichor itself puts on every
                      control plane that has a spec.network, as a shared IP on its primary link. node is any other address: one
                      control plane's own, or a hardware load balancer's or a DNS name's in front of the control planes, which
                      Ichor does not configure. loadBalancer is deprecated and refused: use node.
                    enum:
                    - vip
                    - loadBalancer
                    - node
                    type: string
                required:
                - address
                - type
                type: object
              imageFactoryURL:
                description: |-
                  imageFactoryURL is the base URL of the Image Factory this cluster's installer images and schematics come
                  from: an https URL with a host and an optional port, and no path. Ichor registers schematics there
                  (a storage preset's extensions) and names it in the installer images it renders
                  (<host>/metal-installer/<schematic>:<version>). Unset means https://factory.talos.dev. Set it for a
                  self-hosted or air-gapped Image Factory.
                type: string
              kubernetesVersion:
                description: kubernetesVersion is the Kubernetes release this cluster
                  runs.
                pattern: ^v\d+\.\d+\.\d+$
                type: string
              network:
                description: |-
                  network sets the pod and service subnets. Unset keeps Talos's defaults. It
                  cannot change once set.
                properties:
                  podSubnets:
                    description: podSubnets are the pod CIDRs, at most one per IP
                      family.
                    items:
                      maxLength: 43
                      type: string
                    maxItems: 2
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: podSubnets must be valid CIDRs
                      rule: self.all(c, isCIDR(c))
                  serviceSubnets:
                    description: serviceSubnets are the service CIDRs, at most one
                      per IP family.
                    items:
                      maxLength: 43
                      type: string
                    maxItems: 2
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: serviceSubnets must be valid CIDRs
                      rule: self.all(c, isCIDR(c))
                type: object
                x-kubernetes-validations:
                - message: network cannot change after it is set; Kubernetes cannot
                    renumber a live cluster
                  rule: self == oldSelf
              registries:
                description: |-
                  registries declares this cluster's private registry mirrors and where their pull
                  credentials live, pushed to every node through the system layer (docs/design/architecture.md "Monitoring and
                  registry mirrors"). Empty (the default) configures no
                  mirrors at all -- mirrors stay entirely optional. listType=map on host (rather
                  than a CEL uniqueness rule, same as status.conditions below) is what the structural schema
                  itself rejects a duplicate host under -- a CEL self.exists_one rule over this list was
                  tried first and rejected by envtest's apiserver: with MaxItems=32 its estimated cost
                  exceeds the per-field budget by 32x (quadratic in list length), and still contributed
                  enough to blow the whole-schema budget by 3.3x alongside this CRD's existing CEL rules.
                items:
                  description: |-
                    TalosClusterRegistry declares one private registry mirror this cluster's nodes pull through,
                    and where its pull credentials live. The mirror endpoints and (non-secret) username are typed
                    fields, same as any other machine-config value; the password-shaped credentials
                    (RegistryAuthConfig.{password,auth,identityToken}) are not, because they would let this value
                    -- carried on TalosCluster, a CR that lives in Git -- put a registry password in Git (design
                    principle 2). authSecretRef points at a Kubernetes Secret
                    instead; the render-time injection that resolves it never writes the resolved value back onto
                    any CR (pkg/render.ResolveRegistryAuth, pkg/render.Render).
                  properties:
                    authSecretRef:
                      description: |-
                        authSecretRef names a Secret, read in the controller's own namespace (the same reasoning
                        as secretsRef below: RBAC cannot scope a Secret read to "wherever this TalosCluster
                        happens to live" below cluster-wide), holding this registry's password-shaped
                        credentials. Unset means an anonymous mirror -- a public registry needing no credentials
                        at all, not an error. Set but unresolvable (Secret missing, or present but carrying none
                        of its three recognized keys) is: pkg/render.ResolveRegistryAuth fails the render rather
                        than silently producing a mirror with no auth, since that would look identical to a
                        working one until the first pull fails on the node. A corev1.LocalObjectReference, not a
                        SecretKeySelector: machinery's RegistryAuthConfig carries three mutually-exclusive
                        credential shapes (password, auth, identityToken, matching docker config.json's own auth
                        forms) that one registry's credentials pick at most one of, so one reference to a Secret
                        with those three well-known keys covers it -- same shape secretsRef already uses for
                        bundleSecretKey, rather than three separate single-key selectors for a value that is, in
                        practice, one secret.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    endpoints:
                      description: |-
                        endpoints are the mirror endpoint URLs for host (RegistryMirrorConfig.endpoints) -- not
                        secret, so they stay a plain typed field here rather than behind a reference. Checked
                        here, not left to machinery: pkg/machinery/config/types/v1alpha1's own ValidateAtRuntime
                        has no validator at all for RegistryMirrorConfig/RegistryConfig, so an
                        endpoint shaped wrong would otherwise reach a node's machine config unexamined, exactly
                        the gap spec.discovery's own CEL above already closes for its addresses.
                      items:
                        maxLength: 2048
                        type: string
                      maxItems: 8
                      minItems: 1
                      type: array
                      x-kubernetes-validations:
                      - message: endpoints must be valid URLs
                        rule: self.all(e, isURL(e))
                    host:
                      description: |-
                        host is the registry host (and port, if not the default) this entry's mirror and
                        credentials apply to, matching RegistriesConfig's own map key: the first segment of an
                        image reference, "docker.io" being the default one, or "*" for a fallback mirror. TLS
                        config (RegistryConfig.tls) uses the same key but never the "*" fallback; this field
                        carries both mirror and auth, so "*" is only meaningful when authSecretRef is unset.
                      maxLength: 255
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: host must be "*" or a hostname[:port]
                        rule: self == '*' || self.matches('^[a-zA-Z0-9.-]+(:[0-9]{1,5})?$')
                    overridePath:
                      description: |-
                        overridePath makes the nodes use every endpoint's path as given, without adding the
                        /v2/ suffix (RegistryMirrorConfig.endpoints[].overridePath). It applies to all of this
                        entry's endpoints; Talos allows it per endpoint, and a mix cannot be recorded here.
                      type: boolean
                    skipFallback:
                      description: |-
                        skipFallback stops nodes falling back to host itself when none of the endpoints has the
                        image (RegistryMirrorConfig.skipFallback). Default false, Talos's own default.
                      type: boolean
                    username:
                      description: |-
                        username is this registry's non-secret auth username (RegistryAuthConfig.username). Optional: some private
                        registries authenticate on password/token alone.
                      type: string
                  required:
                  - endpoints
                  - host
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - host
                x-kubernetes-list-type: map
              schematic:
                description: schematic is the Image Factory schematic used for this
                  cluster's installer image.
                properties:
                  id:
                    description: id is the Image Factory schematic ID.
                    minLength: 1
                    type: string
                required:
                - id
                type: object
              secretsRef:
                description: |-
                  secretsRef names the Secret holding the cluster's Talos secrets bundle under the key "secrets.yaml", in
                  the format `talosctl gen secrets` writes: the Talos API, Kubernetes, Kubernetes aggregator and etcd CA
                  certificates and private keys, the Kubernetes service account key, the cluster ID and secret, the bootstrap
                  and trustd tokens, and the etcd encryption secret. Ichor adds its rotation state to the same Secret while a
                  rotation runs. The Secret lives in the controller's
                  own namespace (not necessarily this TalosCluster's), because Kubernetes RBAC cannot restrict
                  Secret reads to "wherever the referencing TalosCluster happens to live" at anything narrower than
                  cluster-wide.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: secretsRef.name is required
                  rule: self.name != ''
              security:
                description: |-
                  security holds opt-in hardening of this cluster: an ingress firewall, Cilium
                  WireGuard encryption, Pod Security levels, an audit policy preset and disk encryption.
                  Unset (the default) changes nothing.
                properties:
                  audit:
                    description: |-
                      audit selects a kube-apiserver audit policy preset. Restarts the kube-apiserver on every
                      control plane, no node reboot. Needs versionContract v1.14 or later.
                    properties:
                      policy:
                        description: |-
                          policy is the preset. metadata records who did what, without bodies, for every request
                          (Talos's own default). rbacChanges is metadata plus the full request and response of
                          changes to roles and bindings. writes is metadata plus the request body of every change.
                          Secrets, configmaps, service account tokens and token reviews are never logged above
                          metadata in any preset.
                        enum:
                        - metadata
                        - rbacChanges
                        - writes
                        type: string
                    required:
                    - policy
                    type: object
                  diskEncryption:
                    description: |-
                      diskEncryption encrypts the STATE and EPHEMERAL volumes with LUKS2. Talos encrypts a
                      volume only when it creates it, so on a cluster that already has machines it needs the
                      wipe-and-rejoin path (see docs/guides/hardening.md) and the confirm annotation.
                    properties:
                      kmsEndpoint:
                        description: |-
                          kmsEndpoint is the KMS server, as a URL with a scheme (https://kms.example.com:4443). A
                          scheme other than https is refused.
                        maxLength: 253
                        type: string
                      requireSecureBoot:
                        description: |-
                          requireSecureBoot makes enrolling a TPM key fail unless SecureBoot is enabled in the
                          firmware. Without SecureBoot a TPM key gives no boot-chain protection.
                        type: boolean
                      type:
                        description: |-
                          type is where the key comes from. tpm seals it in the machine's TPM 2.0 (bound to PCR 7);
                          nodeID derives it from the node UUID, which protects only against a removed disk; kms has
                          a KMS server seal and unseal it.
                        enum:
                        - tpm
                        - nodeID
                        - kms
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: kmsEndpoint is required for type kms and not allowed
                        otherwise
                      rule: 'self.type == ''kms'' ? has(self.kmsEndpoint) && size(self.kmsEndpoint)
                        > 0 : !has(self.kmsEndpoint)'
                    - message: requireSecureBoot applies to type tpm only
                      rule: self.type == 'tpm' || !has(self.requireSecureBoot)
                  firewall:
                    description: |-
                      firewall turns on Talos's ingress firewall in block mode with the rules a Talos cluster
                      needs, plus the sources you list. No reboot.
                    properties:
                      allow:
                        description: |-
                          allow opens further host ports, for services running with host networking (an ingress
                          controller on 80 and 443, a node exporter). Everything not listed is blocked.
                        items:
                          description: TalosClusterFirewallRule is one extra firewall
                            rule of spec.security.firewall.allow.
                          properties:
                            cidrs:
                              description: cidrs are the sources allowed to reach
                                the ports.
                              items:
                                maxLength: 43
                                type: string
                              maxItems: 16
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: atomic
                              x-kubernetes-validations:
                              - message: cidrs must be valid CIDRs
                                rule: self.all(c, isCIDR(c))
                            name:
                              description: name identifies the rule; it becomes ichor-fw-allow-<name>
                                in the machine config.
                              pattern: ^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$
                              type: string
                            ports:
                              description: ports are single ports ("443") or inclusive
                                ranges ("8000-8100").
                              items:
                                pattern: ^[0-9]{1,5}(-[0-9]{1,5})?$
                                type: string
                              maxItems: 16
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: atomic
                            protocol:
                              description: protocol is tcp or udp.
                              enum:
                              - tcp
                              - udp
                              type: string
                          required:
                          - cidrs
                          - name
                          - ports
                          - protocol
                          type: object
                        maxItems: 32
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      apiServerCIDRs:
                        description: |-
                          apiServerCIDRs are further sources allowed to reach the Kubernetes API (6443), for users and
                          load balancers.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: apiServerCIDRs must be valid CIDRs
                          rule: self.all(c, isCIDR(c))
                      controlPlaneCIDRs:
                        description: |-
                          controlPlaneCIDRs are the addresses of the control planes only; etcd and the control planes'
                          own reach to apid and the kubelet are limited to them. Unset means nodeCIDRs.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: controlPlaneCIDRs must be valid CIDRs with a prefix
                            length above 0
                          rule: self.all(c, isCIDR(c) && cidr(c).prefixLength() >
                            0)
                      controllerCIDRs:
                        description: |-
                          controllerCIDRs are the addresses Ichor's controller connects from. They are always allowed
                          to reach apid and the Kubernetes API. The admission webhook refuses a value that does not
                          contain the address the controller reaches the cluster endpoint from.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: controllerCIDRs must be valid CIDRs with a prefix
                            length above 0
                          rule: self.all(c, isCIDR(c) && cidr(c).prefixLength() >
                            0)
                      enabled:
                        default: false
                        description: enabled turns the firewall on.
                        type: boolean
                      kubeSpan:
                        description: |-
                          kubeSpan allows KubeSpan's WireGuard port (UDP 51820) from anywhere; set it when the
                          cluster uses KubeSpan.
                        type: boolean
                      nodeCIDRs:
                        description: nodeCIDRs are the addresses of all the cluster's
                          machines, control planes and workers.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: nodeCIDRs must be valid CIDRs with a prefix length
                            above 0
                          rule: self.all(c, isCIDR(c) && cidr(c).prefixLength() >
                            0)
                      talosAPICIDRs:
                        description: talosAPICIDRs are further sources allowed to
                          reach apid (50000), for operators using talosctl.
                        items:
                          maxLength: 43
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: talosAPICIDRs must be valid CIDRs
                          rule: self.all(c, isCIDR(c))
                    type: object
                    x-kubernetes-validations:
                    - message: 'controllerCIDRs and nodeCIDRs need at least one CIDR
                        when enabled: without them Ichor or the nodes would lose access'
                      rule: '!self.enabled || (has(self.controllerCIDRs) && self.controllerCIDRs.size()
                        > 0 && has(self.nodeCIDRs) && self.nodeCIDRs.size() > 0)'
                  kernelLockdown:
                    description: |-
                      kernelLockdown is the kernel lockdown level the nodes are expected to run with. Ichor checks
                      it and reports a node below it; it does not render it, because the kernel command line is
                      embedded in the UKI (build it into the boot asset with an Image Factory schematic whose
                      extraKernelArgs has lockdown=confidentiality, and set spec.schematic). SecureBoot images run
                      at integrity by themselves in Talos v1.14.
                    enum:
                    - integrity
                    - confidentiality
                    type: string
                  kubeletServingCertificates:
                    description: |-
                      kubeletServingCertificates makes every kubelet serve a certificate signed by the Kubernetes
                      CA instead of a self-signed one. Ichor's controller approves the kubelets'
                      serving-certificate requests itself, for the machines it manages and nothing else. A
                      kubelet restart on every node, no node reboot.
                    properties:
                      enabled:
                        default: false
                        description: enabled turns serverTLSBootstrap on and the controller's
                          approval of the requests on.
                        type: boolean
                      verifyFromAPIServer:
                        description: |-
                          verifyFromAPIServer also makes the kube-apiserver check the kubelets' certificates against
                          the Kubernetes CA (--kubelet-certificate-authority). Ichor renders it only once every
                          machine has been issued a serving certificate (condition KubeletServingCertificates), and
                          keeps it once rendered. It restarts the kube-apiserver on every control plane. Until then
                          the apiserver does not verify the kubelets, as before.
                        type: boolean
                    type: object
                    x-kubernetes-validations:
                    - message: verifyFromAPIServer needs enabled
                      rule: '!has(self.verifyFromAPIServer) || !self.verifyFromAPIServer
                        || (has(self.enabled) && self.enabled)'
                  podSecurity:
                    description: |-
                      podSecurity sets the Pod Security admission levels of the kube-apiserver. Restarts the
                      kube-apiserver on every control plane, no node reboot. Needs versionContract v1.14 or later.
                    properties:
                      audit:
                        description: audit is the level above which violations are
                          recorded in the audit log.
                        enum:
                        - privileged
                        - baseline
                        - restricted
                        type: string
                      enforce:
                        description: enforce is the level a pod must meet to be admitted.
                        enum:
                        - privileged
                        - baseline
                        - restricted
                        type: string
                      exemptNamespaces:
                        description: exemptNamespaces are added to the exempt namespaces
                          (kube-system stays exempt).
                        items:
                          maxLength: 63
                          type: string
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: set
                      warn:
                        description: warn is the level above which violations produce
                          a warning to the client.
                        enum:
                        - privileged
                        - baseline
                        - restricted
                        type: string
                    type: object
                  secureBoot:
                    description: |-
                      secureBoot asks for UEFI SecureBoot with Talos's UKI images. It picks the
                      installer image variant and reports each node's actual state; it never changes an installed
                      node, because Talos cannot convert a GRUB install and the firmware keys are not Talos's.
                    properties:
                      mode:
                        description: |-
                          mode is Off (the default: the stock installer, nothing reported), Preferred (Ichor uses the
                          SecureBoot installer where it chooses one and reports nodes without SecureBoot) or Required
                          (as Preferred, a TPM disk key must check SecureBoot, enabling it needs the confirm
                          annotation while any approved machine lacks SecureBoot, and a machine in maintenance mode
                          without SecureBoot is not given its first configuration). A node that already runs
                          SecureBoot is upgraded with the SecureBoot installer whatever the mode.
                        enum:
                        - "Off"
                        - Preferred
                        - Required
                        type: string
                    required:
                    - mode
                    type: object
                  wireGuard:
                    description: |-
                      wireGuard turns on Cilium's transparent WireGuard encryption of pod traffic between nodes.
                      A rolling restart of the Cilium agents, no node reboot.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          enabled sets encryption.enabled=true and encryption.type=wireguard in the managed Cilium
                          values. It wins over any encryption.* the user values set. When the firewall is on, UDP
                          51871 is opened between nodes.
                        type: boolean
                      nodeEncryption:
                        description: |-
                          nodeEncryption also encrypts node-to-node traffic that is not pod traffic
                          (encryption.nodeEncryption).
                        type: boolean
                    type: object
                type: object
              talosVersion:
                description: talosVersion is the Talos release this cluster renders
                  configuration for.
                pattern: ^v\d+\.\d+\.\d+$
                type: string
              versionContract:
                description: |-
                  versionContract is required rather than defaulted, so that a machinery bump cannot silently change what gets
                  applied (principle 4).
                pattern: ^v\d+\.\d+$
                type: string
            required:
            - controlPlane
            - endpoint
            - kubernetesVersion
            - secretsRef
            - talosVersion
            - versionContract
            type: object
          status:
            description: status defines the observed state of TalosCluster
            properties:
              certificates:
                description: |-
                  certificates lists when each cluster certificate authority in the secrets
                  bundle expires, so an approaching expiry is visible before it locks anyone
                  out. Read from the bundle, never from a node.
                items:
                  description: CertificateExpiry is one certificate authority's end
                    of validity.
                  properties:
                    name:
                      description: 'name is which authority: talos, kubernetes, kubernetes-aggregator
                        or etcd.'
                      maxLength: 63
                      minLength: 1
                      type: string
                    notAfter:
                      description: notAfter is the certificate's last instant of validity.
                      format: date-time
                      type: string
                  required:
                  - name
                  - notAfter
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              cni:
                description: cni is the observed CNI state that is not a spec ingredient.
                properties:
                  appliedValuesHash:
                    description: |-
                      appliedValuesHash is the hash of the effective Cilium values the last successful Helm Job
                      applied. The controller starts a new Job when the hash of
                      spec.cni.cilium.values (merged with Ichor's defaults) differs from it. Written by the
                      controller only.
                    type: string
                  availableChartVersion:
                    description: |-
                      availableChartVersion is the Cilium chart version the running Ichor ships when it differs
                      from the installed release; empty when up to date. It backs the
                      CiliumUpgradeAvailable condition.
                    type: string
                  detected:
                    description: |-
                      detected is the CNI the cluster is observed to run, read-only display and the
                      network-policy gate. Written by the controller only.
                    enum:
                    - cilium
                    - flannel
                    - calico
                    - other
                    - none
                    type: string
                  detectedVersion:
                    description: detectedVersion is the image tag of the detected
                      CNI's DaemonSet where one exposes it.
                    type: string
                  imageOverride:
                    description: |-
                      imageOverride is the Cilium patch an earlier Ichor recorded as the images the release runs over the embedded
                      chart. Ichor sets no new one (amendment 2026-11-04 (3)). A recorded patch
                      newer than the embedded chart keeps being rendered, so an Ichor upgrade never steps Cilium back, and the
                      CiliumUpgradeAvailable condition says so; the controller clears it once the embedded chart reaches the patch.
                    properties:
                      images:
                        additionalProperties:
                          type: string
                        description: |-
                          images maps each image key to the reference the Job runs: "agent", "operator" and "hubble-relay"
                          are repository:tag@sha256:digest, verified against the Cilium release signature.
                        type: object
                      version:
                        description: version is the patch, with a leading v (v1.20.5).
                        pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
                        type: string
                    required:
                    - images
                    - version
                    type: object
                  jobFailures:
                    description: |-
                      jobFailures is how many Cilium Helm Jobs failed in a row for the values whose hash is
                      jobFailuresHash, counted when the controller removes a failed Job to try again. Each failure
                      doubles the wait before the next attempt (a minute, up to 30 minutes), so a Job that keeps failing
                      does not hold the cluster operation lock in a near-continuous loop. Other values (another hash)
                      start again at once, and a successful Job clears it. Written by the controller only.
                    format: int32
                    type: integer
                  jobFailuresHash:
                    description: jobFailuresHash is the effective-values hash jobFailures
                      counts for.
                    type: string
                  kubeProxy:
                    description: |-
                      kubeProxy is the mode the Talos side (cluster.proxy.disabled) is rendered for. Unset until
                      a kube-proxy switch first runs, which means "render whatever the patches say"; once set,
                      pkg/render appends it as the last patch, so it wins over any patch. Only the
                      TalosOperation of kind cni writes it, and only after the new side is verified.
                    enum:
                    - enabled
                    - replaced
                    type: string
                  takenOverInlineManifest:
                    description: |-
                      takenOverInlineManifest is the name of the cluster.inlineManifests entry of the adopted
                      machines that held the Cilium DaemonSet Ichor took over, which pkg/render stops rendering
                      once CNIHandover is True. The controller copies it from the
                      TalosClusterCNIInlineManifestAnnotation when the hand-over completes; empty when the
                      adopted Cilium was not in an inline manifest.
                    type: string
                type: object
              conditions:
                description: conditions represent the current state of the TalosCluster
                  resource, kstatus-compatible.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the most recent generation the
                  controller has reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
