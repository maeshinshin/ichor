{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: talosmachines.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: TalosMachine
    listKind: TalosMachineList
    plural: talosmachines
    shortNames:
    - tm
    singular: talosmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.approvalState
      name: Approval
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .spec.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosMachine is the Schema for the talosmachines API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TalosMachine
            properties:
              approvalDecision:
                description: |-
                  approvalDecision records who made the current approvalState decision,
                  when, and why. It is kept separate from approvalState, not folded
                  into it, so approvalState alone remains this machine's single source
                  of truth for approval status -- this struct asserts no approved/
                  rejected state of its own, only the record behind whichever state
                  approvalState already carries. Unset until the first approve/reject.
                properties:
                  actor:
                    description: |-
                      actor identifies who made the decision. Fixed to the backend's own
                      identity until OIDC login lands (ADR 0018); the field is added now
                      rather than later so every decision from here on has an actor
                      recorded, instead of leaving earlier decisions with none once a
                      real per-person identity exists to fill it.
                    type: string
                  at:
                    description: at is when the decision was made.
                    format: date-time
                    type: string
                  reason:
                    description: |-
                      reason is deprecated: unused, kept so the schema never drops a field (ADR 0130). It is no longer
                      asked for or written; decisions made before it carry the text they were given.
                    type: string
                type: object
              approvalState:
                default: pending
                description: |-
                  approvalState records the human decision on this machine: pending (the
                  default, awaiting a decision), approved (the controller renders and
                  applies configuration), or rejected (an operator explicitly turned it
                  away; re-approving reverses it, docs/adr/0018). This replaces an
                  earlier plain "approved" bool, which had no way to represent
                  "rejected" without a second field claiming the same truth -- one
                  field is the source of truth for this machine's approval status.
                enum:
                - pending
                - approved
                - rejected
                type: string
              clusterRef:
                description: clusterRef names the TalosCluster this machine belongs
                  to.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: clusterRef.name is required
                  rule: self.name != ''
              disks:
                description: |-
                  disks assign roles to disks other than the system disk (spec.install): ephemeral puts
                  EPHEMERAL on its own disk, userVolume provisions a named user volume (ADR 0092).
                items:
                  description: |-
                    TalosMachineDiskRole gives one non-system disk a role (ADR 0092). The disk is identified the
                    same way as spec.install.disk.
                  properties:
                    disk:
                      description: disk selects the disk.
                      properties:
                        busPath:
                          description: busPath is the disk's bus path, e.g. /pci0000:00/0000:00:17.0/ata1/host0/target0:0:0/0:0:0:0.
                          maxLength: 256
                          pattern: ^/[^"\s]+$
                          type: string
                        byIDPath:
                          description: byIDPath is a /dev/disk/by-id/ symlink of the
                            disk.
                          maxLength: 256
                          pattern: ^/dev/disk/by-id/[^/\s"]+$
                          type: string
                        devPath:
                          description: devPath is the kernel device path, e.g. /dev/sda.
                            Not stable across boots; prefer the others.
                          maxLength: 256
                          pattern: ^/dev/[^"\s]+$
                          type: string
                        serial:
                          description: serial is the disk's serial number.
                          maxLength: 256
                          minLength: 1
                          type: string
                        wwid:
                          description: wwid is the disk's World Wide Identifier.
                          maxLength: 256
                          minLength: 1
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of wwid, serial, byIDPath, busPath or
                          devPath must be set
                        rule: '(has(self.wwid) ? 1 : 0) + (has(self.serial) ? 1 :
                          0) + (has(self.byIDPath) ? 1 : 0) + (has(self.busPath) ?
                          1 : 0) + (has(self.devPath) ? 1 : 0) == 1'
                    maxSize:
                      description: maxSize caps a user volume, e.g. 200GiB. Unset
                        lets it use the whole disk.
                      pattern: ^[1-9][0-9]*(MiB|GiB|TiB)$
                      type: string
                    name:
                      description: name is the user volume's name; it is mounted at
                        /var/mnt/<name>.
                      maxLength: 32
                      pattern: ^[A-Za-z0-9-]+$
                      type: string
                    role:
                      description: role is ephemeral (EPHEMERAL on this disk) or userVolume
                        (a user volume on it).
                      enum:
                      - ephemeral
                      - userVolume
                      type: string
                  required:
                  - disk
                  - role
                  type: object
                  x-kubernetes-validations:
                  - message: name is required for userVolume and not allowed for ephemeral,
                      and so is maxSize
                    rule: 'self.role == ''userVolume'' ? has(self.name) : (!has(self.name)
                      && !has(self.maxSize))'
                maxItems: 8
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: at most one disk can have the ephemeral role
                  rule: self.filter(d, d.role == 'ephemeral').size() <= 1
                - message: userVolume names must be unique
                  rule: self.all(a, !(a.role == 'userVolume' && has(a.name)) || self.filter(b,
                    b.role == 'userVolume' && has(b.name) && b.name == a.name).size()
                    == 1)
              endpoint:
                description: endpoint is the machine's Talos API address.
                minLength: 1
                type: string
              hostname:
                description: |-
                  hostname overrides the Kubernetes Node name; Talos derives one from the machine if unset.
                  It must be an RFC 1123 DNS label or subdomain (lower-case alphanumerics, '-' and '.').
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              identity:
                description: identity identifies the physical machine backing this
                  resource.
                properties:
                  macAddresses:
                    description: macAddresses are the machine's NIC MAC addresses,
                      used as an identity hint.
                    items:
                      type: string
                    type: array
                  serial:
                    description: serial is the machine's SMBIOS serial number, used
                      as an identity hint.
                    type: string
                  uuid:
                    description: uuid is the machine's SMBIOS UUID, the primary key
                      for identity.
                    minLength: 1
                    type: string
                required:
                - uuid
                type: object
              install:
                description: |-
                  install is where Talos installs itself on this machine (the design's `system` disk role,
                  ADR 0077). Unset renders no install configuration, which leaves a machine that boots from
                  an installed disk alone but gives a maintenance-mode machine nothing to install onto.
                properties:
                  disk:
                    description: |-
                      disk selects the system disk by a stable identifier. Required: the v1.14 install document
                      has no meaning without a disk to install onto.
                    properties:
                      busPath:
                        description: busPath is the disk's bus path, e.g. /pci0000:00/0000:00:17.0/ata1/host0/target0:0:0/0:0:0:0.
                        maxLength: 256
                        pattern: ^/[^"\s]+$
                        type: string
                      byIDPath:
                        description: byIDPath is a /dev/disk/by-id/ symlink of the
                          disk.
                        maxLength: 256
                        pattern: ^/dev/disk/by-id/[^/\s"]+$
                        type: string
                      devPath:
                        description: devPath is the kernel device path, e.g. /dev/sda.
                          Not stable across boots; prefer the others.
                        maxLength: 256
                        pattern: ^/dev/[^"\s]+$
                        type: string
                      serial:
                        description: serial is the disk's serial number.
                        maxLength: 256
                        minLength: 1
                        type: string
                      wwid:
                        description: wwid is the disk's World Wide Identifier.
                        maxLength: 256
                        minLength: 1
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of wwid, serial, byIDPath, busPath or devPath
                        must be set
                      rule: '(has(self.wwid) ? 1 : 0) + (has(self.serial) ? 1 : 0)
                        + (has(self.byIDPath) ? 1 : 0) + (has(self.busPath) ? 1 :
                        0) + (has(self.devPath) ? 1 : 0) == 1'
                  image:
                    description: |-
                      image is the installer image reference. Unset lets Talos use the installer of the
                      schematic it booted from, which only works when it booted an Image Factory asset.
                    maxLength: 512
                    type: string
                  wipe:
                    description: |-
                      wipe is the install-time wipe flag of the node's configuration (UnattendedInstallConfig
                      provisioning.wipe, machine.install.wipe before v1.14). It is read only when Talos
                      installs, so on a running node it records what the configuration says and does nothing.
                      Default false, which is what Talos's generator writes.
                    type: boolean
                required:
                - disk
                type: object
              network:
                description: |-
                  network is the machine's primary network link and how it is addressed (ADR 0092). Unset
                  leaves networking to Talos's default (DHCP on every physical link).
                properties:
                  addresses:
                    description: addresses are the static addresses with their prefix
                      length, e.g. 192.168.1.10/24.
                    items:
                      type: string
                      x-kubernetes-validations:
                      - message: each address must be an IP with a prefix length,
                          like 192.168.1.10/24
                        rule: isCIDR(self)
                    maxItems: 4
                    type: array
                    x-kubernetes-list-type: atomic
                  addressing:
                    default: dhcp
                    description: addressing is dhcp (the default) or static.
                    enum:
                    - dhcp
                    - static
                    type: string
                  dnsServers:
                    description: dnsServers are resolver addresses, in order. Valid
                      with either addressing.
                    items:
                      type: string
                      x-kubernetes-validations:
                      - message: each DNS server must be an IP address
                        rule: isIP(self)
                    maxItems: 4
                    type: array
                    x-kubernetes-list-type: atomic
                  gateway:
                    description: gateway is the default gateway; unset adds no default
                      route.
                    type: string
                    x-kubernetes-validations:
                    - message: gateway must be an IP address
                      rule: isIP(self)
                  mac:
                    description: mac is the link's permanent hardware address, as
                      discovery reported it.
                    pattern: ^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$
                    type: string
                  vlanID:
                    description: vlanID puts the addressing on a VLAN of the link
                      instead of the link itself.
                    format: int32
                    maximum: 4094
                    minimum: 1
                    type: integer
                required:
                - mac
                type: object
                x-kubernetes-validations:
                - message: static addressing needs addresses; dhcp takes no addresses
                    or gateway
                  rule: '(has(self.addressing) ? self.addressing : ''dhcp'') == ''static''
                    ? (has(self.addresses) && size(self.addresses) > 0) : (!has(self.addresses)
                    && !has(self.gateway))'
              nodeLabels:
                additionalProperties:
                  type: string
                description: nodeLabels are applied to the Kubernetes Node, not to
                  this resource, which is why the field isn't called "labels" (ADR
                  0004).
                type: object
              role:
                description: |-
                  role is the machine's role in the cluster. Left unset by discovery, which
                  does not know it yet (ADR 0011); approval must set it before the
                  configuration reconciler can render anything for this machine.
                enum:
                - controlplane
                - worker
                type: string
            required:
            - clusterRef
            - endpoint
            - identity
            type: object
          status:
            description: status defines the observed state of TalosMachine
            properties:
              apiServerRestartPaths:
                description: |-
                  apiServerRestartPaths lists the configuration field paths whose pending change needs no reboot
                  but restarts the node's kube-apiserver (pkg/fieldmeta's APIServerRestart class), while Ready is
                  False with reason APIServerRestartRequired; empty otherwise. This reconciler never applies them
                  (it would restart every control plane's API server at about the same time); a config-rollout
                  TalosOperation (ADR 0080) does, one control plane at a time.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              appliedConfigHash:
                description: |-
                  appliedConfigHash is the sha256 of the rendered configuration last confirmed applied to
                  the node (pkg/render's hash format), used for the convergence check on later reconciles.
                  It is a hash only, never the rendered configuration itself (principles 1 and 3).
                type: string
              conditions:
                description: conditions represent the current state of the TalosMachine
                  resource, kstatus-compatible.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configStoredAt:
                description: |-
                  configStoredAt is when the node accepted its initial configuration over the insecure
                  maintenance API. Once set, Ichor never applies to this node insecurely again; it only
                  follows the node to running. Empty for a node that has not been provisioned by Ichor.
                format: date-time
                type: string
              discoveredDisks:
                description: |-
                  discoveredDisks lists the installable disks (no CD-ROM, no read-only one) the node reported
                  through its maintenance-mode API when discovery last probed it (ADR 0112). Approval picks the
                  install disk and disk roles from this list, and DiscoveryWarnings checks a choice against it.
                  Empty until a probe has recorded one.
                items:
                  description: |-
                    TalosMachineDiscoveredDisk is one installable disk the node reported in maintenance mode (ADR 0112).
                    The identifiers are the ones a TalosMachineDisk selector can name; the size, model and transport tell
                    the disks apart for a person. No pattern is set on them: the values are what Talos reported, and a
                    status write must not fail on a device name the CRD would not have written.
                  properties:
                    busPath:
                      description: busPath is the disk's bus path, as reported.
                      maxLength: 256
                      type: string
                    byIDPath:
                      description: byIDPath is the disk's /dev/disk/by-id/ symlink,
                        as reported.
                      maxLength: 256
                      type: string
                    devPath:
                      description: devPath is the kernel device path, as reported.
                        Not stable across boots.
                      maxLength: 256
                      type: string
                    model:
                      description: model is the disk's model name, as reported.
                      maxLength: 256
                      type: string
                    serial:
                      description: serial is the disk's serial number, as reported.
                      maxLength: 256
                      type: string
                    sizeBytes:
                      description: sizeBytes is the disk size in bytes.
                      format: int64
                      type: integer
                    transport:
                      description: transport is the bus the disk is attached over
                        (sata, nvme, scsi, virtio, ...), as reported.
                      maxLength: 64
                      type: string
                    wwid:
                      description: wwid is the disk's World Wide Identifier, as reported.
                      maxLength: 256
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              discoveredLinks:
                description: |-
                  discoveredLinks lists the physical links with a permanent MAC address the node reported
                  through its maintenance-mode API when discovery last probed it (ADR 0112). Approval picks the
                  primary NIC from this list. Empty until a probe has recorded one.
                items:
                  description: |-
                    TalosMachineDiscoveredLink is one physical link with a permanent MAC address the node reported in
                    maintenance mode (ADR 0112). Its PermanentMAC is the value TalosMachineNetwork.MAC matches.
                  properties:
                    driver:
                      description: driver is the kernel driver that owns the NIC,
                        as reported.
                      maxLength: 256
                      type: string
                    linkUp:
                      description: linkUp is true when the link reports carrier.
                      type: boolean
                    name:
                      description: name is the kernel link name (eno1, enp3s0, ...),
                        as reported; it can change between boots.
                      maxLength: 256
                      type: string
                    permanentMAC:
                      description: permanentMAC is the hardware address burned into
                        the NIC.
                      maxLength: 17
                      type: string
                    speedMbit:
                      description: speedMbit is the negotiated speed in Mbit/s, or
                        0 when the link does not report one.
                      format: int32
                      type: integer
                  required:
                  - name
                  - permanentMAC
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              kubeletServingCertificate:
                description: |-
                  kubeletServingCertificate is the latest kubelet serving certificate Ichor approved for this
                  machine's node and the Kubernetes CA issued (spec.security.kubeletServingCertificates, ADR
                  0125). Empty while the option is off or no request has been issued yet.
                properties:
                  issuedAt:
                    description: issuedAt is when the Kubernetes CA signed it (the
                      certificate's NotBefore).
                    format: date-time
                    type: string
                  notAfter:
                    description: notAfter is when it expires; the kubelet asks for
                      a new one before that.
                    format: date-time
                    type: string
                  request:
                    description: request is the name of the CertificateSigningRequest
                      Ichor approved.
                    type: string
                type: object
              maintenanceFingerprint:
                description: |-
                  maintenanceFingerprint is the SPKI fingerprint (SHA-256, base64) of the
                  certificate the node's maintenance-mode Talos API presented when it was discovered. The
                  controller pushes the first machine configuration, which carries the CA keys, only to a node
                  that presents this certificate again (ADR 0108). A node that was never discovered through
                  this controller (added by IP, reclaimed) is pinned at its first provisioning probe instead.
                  It is refreshed while the machine is not approved. Talos issues a new certificate when the
                  node reboots or changes address; an operator who has checked the new one accepts it with
                  the TalosMachineTrustMaintenanceFingerprintAnnotation.
                type: string
              nodeName:
                description: |-
                  nodeName is the Kubernetes node name the node reports (its Nodename resource), recorded
                  once it is read so that views can name a machine that has no spec.hostname. Empty until
                  the node has been read.
                type: string
              observedEndpoint:
                description: |-
                  observedEndpoint is the node's Talos API address when it moved away from spec.endpoint (a
                  new DHCP lease, a recreated pod). The controller never changes spec, so it records the
                  address here, found by discovery matching the node's identity (ADR 0011) or from the node's
                  Kubernetes Node address, and dials it in preference to spec.endpoint (ADR 0086).
                type: string
              observedEndpointFor:
                description: |-
                  observedEndpointFor is the spec.endpoint that observedEndpoint was recorded against. When an
                  operator edits spec.endpoint, the two differ and observedEndpoint is ignored.
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation the
                  controller has reconciled.
                format: int64
                type: integer
              observedInputsHash:
                description: |-
                  observedInputsHash hashes the generations of every object that fed the rendered
                  configuration last confirmed to match the node: the TalosCluster, this TalosMachine,
                  and every TalosConfigPatch that applies to it. It is only updated when the node is
                  confirmed converged, so comparing it against the current generations is how the
                  reconciler tells a desired-state change (a generation moved) apart from drift (none
                  did, so the node must have). A hash only, never the generations or config themselves
                  (principle 3).
                type: string
              observedReconcileRequest:
                description: |-
                  observedReconcileRequest is the value of the ichor.maesh.dev/reconcile-requested annotation
                  at the last reconcile. An etcd restore (ADR 0089) writes a fresh token there and waits for
                  it to appear here, which proves the machine was looked at again after the rollback.
                type: string
              rebootPaths:
                description: |-
                  rebootPaths lists the configuration field paths whose pending change needs a reboot, while
                  Ready is False with reason RebootRequired; empty otherwise. A config-rollout
                  TalosOperation (ADR 0080) applies them; the plan shown before starting one reads this.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              schematic:
                description: |-
                  schematic is the Image Factory schematic ID the node's running system was built from,
                  read from the node (its ImageFactorySchematic resource) on every reconcile that reaches
                  it. Empty when the node did not boot an Image Factory asset or was never read. It is what
                  a Talos upgrade and its plan compare spec.schematic against (ADR 0023, Amendment).
                type: string
              security:
                description: |-
                  security is the boot security the node reported on the last reconcile that reached it (its
                  SecurityState and KernelCmdline resources, ADR 0123). Unset until a node has been read.
                properties:
                  bootedWithUKI:
                    description: |-
                      bootedWithUKI is true when the node booted a Unified Kernel Image. A node that did not (a
                      GRUB install) cannot get SecureBoot without a reinstall.
                    type: boolean
                  kernelLockdown:
                    description: |-
                      kernelLockdown is the lockdown level in effect: the last lockdown= word of the kernel
                      command line, else integrity under SecureBoot (Talos v1.14's implicit level), else none.
                    enum:
                    - none
                    - integrity
                    - confidentiality
                    type: string
                  moduleSignatureEnforced:
                    description: moduleSignatureEnforced is true when the kernel only
                      loads signed modules.
                    type: boolean
                  pcrSigningKeyFingerprint:
                    description: |-
                      pcrSigningKeyFingerprint is the fingerprint of the key that signs the PCR measurements of the
                      booted UKI (SecurityState.pcrSigningKeyFingerprint); empty when the node reports none.
                    maxLength: 128
                    type: string
                  secureBoot:
                    description: secureBoot is true when the node booted with UEFI
                      SecureBoot enabled.
                    type: boolean
                  ukiSigningKeyFingerprint:
                    description: |-
                      ukiSigningKeyFingerprint is the UKI signing key fingerprint of Talos's SecurityState. Talos
                      v1.14 does not fill it, so it stays empty; pcrSigningKeyFingerprint is the one it reports.
                      Kept for compatibility (CRD fields are append-only).
                    maxLength: 128
                    type: string
                type: object
              stage:
                description: |-
                  stage is the last stage the node was seen in on its way from maintenance mode to
                  running: maintenance, installing, rebooting or running (Talos's MachineStatus stages).
                  installing and rebooting right after the initial apply are inferred (the apply RPC only
                  means "stored"); running is read from the node. See ADR 0076.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
