{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: talosoperations.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: TalosOperation
    listKind: TalosOperationList
    plural: talosoperations
    shortNames:
    - top
    singular: talosoperation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.paused
      name: Paused
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TalosOperation is the Schema for the talosoperations API. It is a record
          of an imperative action in progress, not a declarative desired state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TalosOperation
            properties:
              caRotation:
                description: |-
                  caRotation chooses which CAs a ca-rotation-kind operation replaces. Absent means the
                  Talos API CA and the Kubernetes API CA, as before.
                properties:
                  targets:
                    description: |-
                      targets lists the CAs to replace: talos, kubernetes, etcd, kubernetes-aggregator. Empty means
                      talos and kubernetes. The set is fixed when the rotation starts; the new CAs saved in the bundle
                      Secret are what a restarted controller follows.
                    items:
                      enum:
                      - talos
                      - kubernetes
                      - etcd
                      - kubernetes-aggregator
                      type: string
                    maxItems: 4
                    type: array
                    x-kubernetes-list-type: set
                type: object
              clusterRef:
                description: clusterRef names the TalosCluster this operation acts
                  on.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: clusterRef.name is required
                  rule: self.name != ''
              cni:
                description: |-
                  cni says which cni-kind operation this is. Absent means the kube-proxy switch;
                  action upgrade is a Cilium chart upgrade.
                properties:
                  action:
                    description: 'action is upgrade: run the Cilium Helm Job to move
                      the release to the chart this Ichor embeds.'
                    enum:
                    - upgrade
                    type: string
                  chartVersion:
                    description: |-
                      chartVersion is the Cilium chart version the operation upgrades to. The executor refuses to
                      run when the controller embeds another version (it was upgraded after the operation was created).
                    minLength: 1
                    type: string
                  imageVersion:
                    description: |-
                      imageVersion is deprecated and unused. An earlier Ichor made the upgrade a Cilium patch with it. Cilium now moves
                      only to the chart the running Ichor embeds (amendment 2026-11-04
                      (3)): the executor refuses an operation that sets it. Kept so the schema does not lose a field an
                      installed build had.
                    pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
                    type: string
                required:
                - action
                - chartVersion
                type: object
              etcdRestore:
                description: etcdRestore is the snapshot of an etcd-restore-kind operation.
                properties:
                  backupRef:
                    description: |-
                      backupRef names the TalosEtcdBackup (same namespace) whose storage holds the snapshot. Its
                      credentials, prefix and the cluster's secrets bundle (the decryption key) are what the
                      controller reads the snapshot with.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: backupRef.name is required
                      rule: self.name != ''
                  confirm:
                    description: 'confirm must equal the cluster''s name: the restore
                      rewinds the whole cluster, so the name is typed.'
                    type: string
                  reason:
                    description: |-
                      reason is deprecated: unused, kept so the schema never drops a field. It was the
                      override reason the restore was started under; it is no longer required, asked for or read.
                    type: string
                  snapshot:
                    description: |-
                      snapshot is the object name of the snapshot under the backup's prefix, as listed in the
                      backup's status.snapshots.
                    pattern: ^etcd-[0-9]{8}T[0-9]{6}Z\.snapshot\.age$
                    type: string
                required:
                - backupRef
                - confirm
                - snapshot
                type: object
              keyRotation:
                description: 'keyRotation is the key-rotation kind''s request: which
                  keys, and how long the old service-account key is kept.'
                properties:
                  ignoreLegacyTokens:
                    default: false
                    description: |-
                      ignoreLegacyTokens lets the rotation drop the old service-account key although Secrets of type
                      kubernetes.io/service-account-token that it signed still exist. Those tokens stop working when the key
                      is dropped. By default the operation waits until none is left.
                    type: boolean
                  targets:
                    description: |-
                      targets names the keys to replace: serviceAccount (the key that signs ServiceAccount tokens),
                      secretbox (the key Secrets are encrypted with in etcd), or both.
                    items:
                      enum:
                      - serviceAccount
                      - secretbox
                      type: string
                    maxItems: 2
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  tokenSettle:
                    description: |-
                      tokenSettle is how long the old service-account key is kept after the new one signs, so that the
                      projected tokens of running pods are re-issued under the new one. The default is 90 minutes and the
                      shortest accepted is 75 minutes (a shorter one makes pods that still hold an old token fail until the
                      kubelet refreshes it). Raise it when workloads request projected tokens that live longer than an hour.
                      Ignored without the serviceAccount target.
                    type: string
                required:
                - targets
                type: object
              kind:
                description: |-
                  kind names which upgrade this is: talos (spec.talosVersion/schematic),
                  kubernetes (spec.kubernetesVersion), or ichor (the controller/CRDs/UI
                  install), cni (a spec.cni.kubeProxy switch), shutdown (a
                  planned stop of the whole cluster), or ca-rotation (the Talos API and
                  Kubernetes API CAs). This CRD and its controller only
                  store and report it -- each kind's own execution is a separate unit's work.
                  shutdown and ca-rotation are the exceptions: each runs its own state machine.
                  config applies the pending reboot-requiring configuration changes, one machine at a time
                  with a reboot each.
                  etcd-restore rewinds the cluster to a stored etcd snapshot.
                  key-rotation replaces the service-account signing key and the secretbox key.
                enum:
                - talos
                - kubernetes
                - ichor
                - cni
                - shutdown
                - ca-rotation
                - config
                - node
                - etcd-restore
                - key-rotation
                type: string
              maxUnavailable:
                default: 1
                description: |-
                  maxUnavailable caps how many worker machines this operation advances
                  at once. Control planes are never parallel: this operation advances
                  exactly one at a time, and only once every control plane has
                  finished, regardless of this value.
                format: int32
                minimum: 1
                type: integer
              node:
                description: 'node is the action of a node-kind operation: which machine
                  and what to do to it.'
                properties:
                  action:
                    description: |-
                      action is what to do: reboot, shutdown, restart-service, etcd-defrag (control planes),
                      etcd-forfeit-leadership (the control plane that leads etcd), or reset (the removal flow with
                      the node wiped). etcd member removal is not an action: it is part of removal.
                    enum:
                    - reboot
                    - shutdown
                    - restart-service
                    - etcd-defrag
                    - etcd-forfeit-leadership
                    - reset
                    type: string
                  allowLeader:
                    default: false
                    description: |-
                      allowLeader lets etcd-defrag run on the member that currently leads a multi-member etcd.
                      By default it is refused there.
                    type: boolean
                  breakGlassReason:
                    description: |-
                      breakGlassReason is the earlier name of overrideReason, kept because CRD fields are append-only
                      and operations written by older builds carry it. Deprecated: use override.
                      Ichor's own CLI and UI never set it; its text is not read, but a value still counts, and is gated
                      by the same verb, as an override.
                    minLength: 1
                    type: string
                  confirm:
                    description: confirm must equal the machine's name for reset,
                      the typed confirmation of an irreversible action.
                    type: string
                  machineRef:
                    description: machineRef names the TalosMachine the action runs
                      on.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: machineRef.name is required
                      rule: self.name != ''
                  override:
                    description: |-
                      override asks to override a safety check: the last-worker guard for reboot and shutdown, or the
                      reset's own gate. It is only honoured when the creator holds the
                      override verb on the machine (the override webhook checks), and it goes into the audit record and
                      an Event.
                    type: boolean
                  overrideReason:
                    description: |-
                      overrideReason is deprecated: unused, kept so the schema never drops a field. It was the
                      optional reason for an override; no client sets it and nothing reads it. A value written
                      by an older build still counts as an override (see Overrides).
                    minLength: 1
                    type: string
                  powerOff:
                    description: |-
                      powerOff makes the node power off after the reset wipes it instead of rebooting into maintenance
                      mode. Only with the reset action; unset keeps the reboot, which is what a reset did before
                      the field existed. The UI and `ichor delete node` set it unless asked to reboot.
                    type: boolean
                  service:
                    description: |-
                      service is the Talos service restart-service restarts. Only kubelet, containerd and cri
                      are allowed; etcd, apid, trustd and machined never are.
                    enum:
                    - kubelet
                    - containerd
                    - cri
                    type: string
                  wipeMode:
                    description: |-
                      wipeMode makes a reset wipe more than the STATE and EPHEMERAL partitions: system-disk erases
                      the whole system disk (boot and EFI included, so the node boots a boot image again instead of
                      its installed UKI, which is what installing it afresh from a SecureBoot ISO needs), all erases the
                      same system disk and never a user disk. Only with the reset action; unset keeps the STATE and EPHEMERAL wipe.
                    enum:
                    - system-disk
                    - all
                    type: string
                required:
                - action
                - machineRef
                type: object
                x-kubernetes-validations:
                - message: service is required for restart-service and only allowed
                    there
                  rule: 'self.action == ''restart-service'' ? has(self.service) :
                    !has(self.service)'
                - message: reset needs confirm equal to the machine name
                  rule: self.action != 'reset' || (has(self.confirm) && self.confirm
                    == self.machineRef.name)
                - message: allowLeader only applies to etcd-defrag
                  rule: '!self.allowLeader || self.action == ''etcd-defrag'''
                - message: wipeMode only applies to reset
                  rule: '!has(self.wipeMode) || self.action == ''reset'''
                - message: powerOff only applies to reset
                  rule: '!has(self.powerOff) || self.action == ''reset'''
              paused:
                default: false
                description: |-
                  paused stops the operation from advancing any further machine. It
                  does not undo a machine already advanced, and it does not release
                  the cluster lock -- the operation is not finished, only halted.
                  It has no effect on an etcd restore that has started: the
                  restore takes the Kubernetes API away and the controller drives it to the
                  end, or to a failed step that pauses it, whatever this field says.
                type: boolean
            required:
            - clusterRef
            - kind
            type: object
            x-kubernetes-validations:
            - message: clusterRef cannot change after creation
              rule: self.clusterRef == oldSelf.clusterRef
            - message: kind cannot change after creation
              rule: self.kind == oldSelf.kind
            - message: spec.node is required for the node kind and only allowed there
              rule: (self.kind == 'node') == has(self.node)
            - message: spec.cni is only allowed for the cni kind
              rule: '!has(self.cni) || self.kind == ''cni'''
            - message: cni cannot change after creation
              rule: has(self.cni) == has(oldSelf.cni) && (!has(self.cni) || self.cni
                == oldSelf.cni)
            - message: spec.keyRotation is required for the key-rotation kind and
                only allowed there
              rule: (self.kind == 'key-rotation') == has(self.keyRotation)
            - message: keyRotation cannot change after creation
              rule: has(self.keyRotation) == has(oldSelf.keyRotation) && (!has(self.keyRotation)
                || self.keyRotation == oldSelf.keyRotation)
            - message: spec.etcdRestore is required for the etcd-restore kind and
                only allowed there
              rule: (self.kind == 'etcd-restore') == has(self.etcdRestore)
            - message: an etcd restore needs spec.etcdRestore.confirm equal to the
                cluster name
              rule: '!has(self.etcdRestore) || self.etcdRestore.confirm == self.clusterRef.name'
            - message: etcdRestore cannot change after creation
              rule: has(self.etcdRestore) == has(oldSelf.etcdRestore) && (!has(self.etcdRestore)
                || self.etcdRestore == oldSelf.etcdRestore)
            - message: node cannot change after creation
              rule: has(self.node) == has(oldSelf.node) && (!has(self.node) || self.node
                == oldSelf.node)
            - message: spec.caRotation is only allowed for the ca-rotation kind
              rule: '!has(self.caRotation) || self.kind == ''ca-rotation'''
            - message: caRotation cannot change after creation
              rule: has(self.caRotation) == has(oldSelf.caRotation) && (!has(self.caRotation)
                || self.caRotation == oldSelf.caRotation)
          status:
            description: status defines the observed state of TalosOperation
            properties:
              caRotation:
                description: |-
                  caRotation is the ca-rotation kind's state machine: which stage every node is being taken
                  to, and which CA is accepted and which issues in it. Public fingerprints only.
                properties:
                  apiServerInstances:
                    additionalProperties:
                      type: string
                    description: |-
                      apiServerInstances is, for each control plane the current stage was applied to in a rotation that
                      restarts kube-apiserver (the Kubernetes or the aggregator CA), the kube-apiserver container it ran in
                      just before the apply. The stage is verified once that control plane runs another one and answers
                      /readyz, so the operation is not Completed while a restart is still to come. Emptied when the stage
                      changes. Not a secret.
                    type: object
                  appliedAt:
                    description: |-
                      appliedAt is when the current stage was last applied to a machine; a kube-apiserver whose container did
                      not change within a minute of it is taken as not restarted by this stage.
                    format: date-time
                    type: string
                  certificates:
                    description: |-
                      certificates lists the two rotated CAs and, for the current stage, which fingerprint issues
                      and which are accepted.
                    items:
                      description: |-
                        CARotationCertificate is one rotated CA. Fingerprints are the SHA-256 of the certificate's DER,
                        hex encoded; none of this is secret.
                      properties:
                        accepted:
                          description: accepted lists the CAs, besides the issuing
                            one, that nodes accept in the current stage.
                          items:
                            type: string
                          type: array
                        issuing:
                          description: issuing is the CA that issues certificates
                            in the current stage.
                          type: string
                        name:
                          description: |-
                            name is talos (the Talos API CA), kubernetes (the Kubernetes API CA), etcd (the etcd CA) or
                            kubernetes-aggregator (the aggregator, or front-proxy, CA).
                          type: string
                        next:
                          description: |-
                            next is the new CA, whose key is in the bundle Secret's rotation.yaml until the rotation
                            is finalized.
                          type: string
                        previous:
                          description: previous is the CA the rotation started from.
                          type: string
                      required:
                      - name
                      - next
                      - previous
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  etcdRebootBootID:
                    description: |-
                      etcdRebootBootID is the boot ID etcdRebooting had when its reboot was requested; the reboot has
                      happened once the node reports another one. Not a secret.
                    type: string
                  etcdRebooting:
                    description: |-
                      etcdRebooting is the control plane whose reboot was requested and is not yet over; empty between
                      two reboots.
                    type: string
                  etcdRestarted:
                    description: |-
                      etcdRestarted names the control planes that were rebooted, and are healthy again, in the current
                      stage, in the order they were rebooted (Talos does not restart etcd on a configuration
                      change and its etcd service has no restart API, so a member loads the stage's CA with a node
                      reboot). Emptied when the stage changes.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  etcdRestartedAt:
                    description: etcdRestartedAt is when the reboot of the control
                      plane in etcdRebooting, or the last one, was requested.
                    format: date-time
                    type: string
                  stage:
                    description: |-
                      stage is the stage every node is being taken to; see the CARotationStage* constants.
                      Empty until the new CAs have been generated and saved.
                    enum:
                    - Accepting
                    - AwaitingCredentials
                    - Issuing
                    - Dropping
                    - Finalizing
                    - Done
                    type: string
                type: object
              conditions:
                description: conditions represent the current state of the TalosOperation
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              etcdRestore:
                description: etcdRestore is the etcd-restore kind's state machine.
                properties:
                  message:
                    description: message is a plain-English line about what the operation
                      is doing or waiting for.
                    type: string
                  reconcileRequest:
                    description: reconcileRequest is the token every TalosMachine
                      was asked to acknowledge in the last step.
                    type: string
                  requestedAt:
                    description: requestedAt is when the destructive part started;
                      waits are bounded from it.
                    format: date-time
                    type: string
                  snapshotTime:
                    description: snapshotTime is when the snapshot being restored
                      was taken.
                    format: date-time
                    type: string
                  step:
                    description: |-
                      step is Wiping, Recovering, Rejoining or Reconciling; empty until the snapshot was verified and
                      the marker written.
                    enum:
                    - Wiping
                    - Recovering
                    - Rejoining
                    - Reconciling
                    type: string
                  target:
                    description: target is the control plane the snapshot is recovered
                      on.
                    type: string
                type: object
              failureReason:
                description: |-
                  failureReason explains why phase is Paused when the cause is a
                  machine's own failed step, as opposed to spec.paused.
                type: string
              finishedAt:
                description: finishedAt is when the operation reached Completed.
                format: date-time
                type: string
              fromVersion:
                description: |-
                  fromVersion is deprecated and unused: Ichor no longer writes or reads it. The from-version
                  now lives in the ichor.maesh.dev/from-version annotation (OperationFromVersionAnnotation).
                  The field stays so the CRD never drops a field an installed version has.
                type: string
              keyRotation:
                description: |-
                  keyRotation is the key-rotation kind's state machine: which stage every control plane is being taken to,
                  which key signs or encrypts in it, and the progress of the re-encryption. Public identifiers only.
                properties:
                  keys:
                    description: |-
                      keys lists the rotated keys and, for the current stage, which one signs or encrypts and which are
                      accepted. Public identifiers only; no key material.
                    items:
                      description: |-
                        KeyRotationKey is one rotated key. Identifiers are public: the SHA-256 of the service-account public key's
                        DER, or a salted hash prefix of the secretbox secret.
                      properties:
                        accepted:
                          description: accepted lists the keys, besides the active
                            one, that verify or decrypt in the current stage.
                          items:
                            type: string
                          type: array
                        active:
                          description: active is the key that signs (serviceAccount)
                            or encrypts (secretbox) in the current stage.
                          type: string
                        name:
                          description: name is serviceAccount or secretbox.
                          type: string
                        next:
                          description: next is the new key, held in the bundle Secret's
                            keyrotation.yaml until the rotation is finalized.
                          type: string
                        previous:
                          description: previous is the key the rotation started from.
                          type: string
                      required:
                      - name
                      - next
                      - previous
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  reencryption:
                    description: reencryption is the progress of the Reencrypting
                      stage.
                    properties:
                      rewritten:
                        description: |-
                          rewritten is how many Secrets the last complete sweep stored again under the new key. The stage ends
                          after a sweep that rewrote none.
                        format: int64
                        type: integer
                      scanned:
                        description: scanned is how many Secrets the last complete
                          sweep looked at.
                        format: int64
                        type: integer
                      sweeps:
                        description: sweeps is how many complete passes over every
                          Secret have run.
                        format: int32
                        type: integer
                    type: object
                  restart:
                    description: |-
                      restart is the control plane whose kube-apiserver the current stage restarted last, and the container
                      it ran before. The stage waits for another container and /readyz before it visits the next control plane.
                    properties:
                      instance:
                        description: instance is the kube-apiserver container that
                          ran before the restart.
                        type: string
                      machine:
                        description: machine is the TalosMachine whose control plane
                          was told to restart its kube-apiserver.
                        type: string
                    required:
                    - machine
                    type: object
                  settlingSince:
                    description: |-
                      settlingSince is when the SettlingTokens stage started waiting for the projected tokens signed by the old
                      service-account key to be re-issued. The wait ends spec.keyRotation.tokenSettle after it.
                    format: date-time
                    type: string
                  stage:
                    description: |-
                      stage is the stage every control plane is being taken to; see the KeyRotationStage* constants. Empty
                      until the new keys have been generated and saved.
                    enum:
                    - Accepting
                    - Issuing
                    - Reencrypting
                    - SettlingTokens
                    - Dropping
                    - Finalizing
                    - Done
                    type: string
                type: object
              kubernetes:
                description: |-
                  kubernetes is the kubernetes kind's state machine: which of the three stages the machines
                  are being taken through.
                properties:
                  stage:
                    description: |-
                      stage is APIServers (kube-apiserver on every control plane), ControlPlaneComponents
                      (controller-manager and scheduler on every control plane; the kubelets and kube-proxy still on
                      the old version), KubeProxy (kube-proxy and the bootstrap manifests) or Kubelets (every
                      kubelet, control planes first, then workers).
                    enum:
                    - APIServers
                    - ControlPlaneComponents
                    - KubeProxy
                    - Kubelets
                    type: string
                type: object
              lastRetry:
                description: |-
                  lastRetry is the time of the retry request (the ichor.maesh.dev/retry annotation) the
                  controller last acted on: it cleared failureReason and ran the failed step again.
                format: date-time
                type: string
              machines:
                description: |-
                  machines records every machine this operation has ever selected, and
                  how far each got. A name's absence means "never selected" -- held,
                  not yet its turn, or the operation finished before it was reached --
                  not a fourth phase value.
                items:
                  description: |-
                    TalosOperationMachineStatus is one machine's progress within a
                    TalosOperation.
                  properties:
                    bootID:
                      description: |-
                        bootID is the machine's boot ID recorded just before it was asked to
                        stop (shutdown kind only; empty for the other kinds, and for a machine
                        that was already unreachable). A different boot ID later is how the
                        operation knows the machine has been powered back on.
                      type: string
                    finishedAt:
                      description: finishedAt is when this machine's step was reported
                        done.
                      format: date-time
                      type: string
                    name:
                      description: name is the TalosMachine's name.
                      type: string
                    phase:
                      description: |-
                        phase is this machine's own progress: InProgress (advance was called,
                        not yet done) or Completed (advance reported done). A machine never
                        appears here until it has been selected at least once; one that is
                        held, or simply not yet reached, is absent, not listed as some third
                        phase.
                      enum:
                      - InProgress
                      - Completed
                      type: string
                    startedAt:
                      description: startedAt is when the operation first selected
                        this machine.
                      format: date-time
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              message:
                description: |-
                  message is what an InProgress operation is doing or waiting for right now, as the controller
                  last saw it ("waiting for the ichor-ui Deployment to finish rolling out (1 of 2 updated
                  replicas are available)"). It is replaced when it changes and cleared in every other phase;
                  a pause says why in failureReason or the Paused condition, a finished operation in its Events.
                type: string
              node:
                description: node is the node kind's state machine.
                properties:
                  machineUID:
                    description: |-
                      machineUID is the UID of the TalosMachine a reset started on. The wait for the removal
                      flow ends when that object is gone or replaced by one with another UID: discovery may
                      recreate a pending machine with the same name within seconds, and that one is never the
                      operation's to delete.
                    type: string
                  message:
                    description: message is a plain-English line about what the operation
                      is doing or waiting for.
                    type: string
                  requestedAt:
                    description: requestedAt is when the action was sent; the wait
                      for its effect is bounded from it.
                    format: date-time
                    type: string
                  step:
                    description: |-
                      step is empty until the action was sent, then Requested (waiting for its effect) or
                      Removing (a reset waiting for the removal flow).
                    enum:
                    - Requested
                    - Removing
                    type: string
                type: object
              phase:
                description: |-
                  phase is this operation's own state-machine phase (see the
                  TalosOperationPhase* constants). The whole state machine lives here,
                  not in the controller's memory, so a restart resumes from exactly
                  this value and the machines list below, not from scratch
                  (docs/design/architecture.md, "Upgrades": "the status-held state
                  machine").
                enum:
                - Pending
                - InProgress
                - Paused
                - ShutDown
                - Completed
                type: string
              toVersion:
                description: |-
                  toVersion is the Ichor version an ichor operation upgrades to: the controller copies
                  IchorInstallation.spec.version here once, when the upgrade starts, and never rewrites it.
                  It is empty on other kinds and on operations that started before it existed.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
