{{- if .Values.metricsCert.enabled }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  # Fixed name, not release-templated: cmd/main.go's second cert-controller rotator
  # hardcodes this Secret's name, same reason
  # ichor-webhook-server-cert is fixed too. No data: cert-controller fills it in at
  # runtime; it has no Create path, so this must already exist.
  name: ichor-metrics-server-cert
  namespace: {{ .Release.Namespace }}
{{- end }}
