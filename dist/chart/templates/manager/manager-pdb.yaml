{{- if and (or (not (hasKey .Values.manager "enabled")) (.Values.manager.enabled)) .Values.manager.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
    control-plane: controller-manager
  name: {{ include "ichor.resourceName" (dict "suffix" "controller-manager-pdb" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.manager.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ichor.name" . }}
      control-plane: controller-manager
{{- end }}
