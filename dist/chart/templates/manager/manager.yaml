{{- if or (not (hasKey .Values.manager "enabled")) (.Values.manager.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
    control-plane: controller-manager
    {{- with .Values.manager.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "ichor.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.manager.annotations }}
  annotations:
    {{- toYaml .Values.manager.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.manager.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ichor.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "ichor.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: controller-manager
        {{- with .Values.manager.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        {{- else }}
        # Bind to :0 to disable the controller-runtime managed metrics server
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address=:8081
        # The controller creates the IchorInstallation once if it is absent, recorded as installed by
        # Helm (docs/adr/0105).
        - --deployed-by=helm
        {{- if and .Values.ichorUI.enabled .Values.ichorUI.users.enabled }}
        # Keeps the signing keys, the internal TLS and the trust ConfigMap of ichor-ui's own issuer
        # (docs/adr/0094).
        - --user-issuer
        - --oidc-refresh-lifetime={{ .Values.ichorUI.users.refreshLifetime }}
        {{- end }}
        {{- with .Values.ichorUI.users.externalURL }}
        - --ui-external-url={{ . }}
        {{- end }}
        {{- if .Values.settings.readOnly }}
        # The runtime settings are owned by this deployment: spec.users/defaults are ignored and denied (ADR 0105).
        - --settings-read-only
        {{- end }}
        # Whether the controller looks for a newer release in the chart repository (ADR 0114).
        - --update-check={{ .Values.updateCheck.enabled }}
        {{- if eq (toString .Values.networkPolicy.cilium.enabled) "false" }}
        # Explicit opt-out: the installer Job skips Ichor's CiliumNetworkPolicies (ADR 0100).
        - --no-cilium-policies
        {{- end }}
        {{- if not .Values.networkPolicy.cilium.dynamicTalosEgress }}
        - --talos-egress-policy=false
        {{- end }}
        - --talos-egress-policy-name={{ include "ichor.resourceName" (dict "suffix" "controller-talos-egress" "context" $) }}
        {{- range .Values.manager.args }}
        - {{ . }}
        {{- end }}
        # Unconditional, not gated on metricsCert.enabled: cert-controller fills
        # this path in-process (ADR 0006), regardless of that toggle. Matches
        # config/default/manager_webhook_patch.yaml, which patches it in always.
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- if .Values.metricsCert.enabled }}
        # Gated, unlike the webhook path above: a real metrics certificate is optional
        # (controller-runtime's own ephemeral self-signed one is the default, see
        # cmd/main.go). cert-controller's second in-process rotator (ADR 0006, ADR 0031)
        # fills this path in when requested. Matches
        # config/default/cert_metrics_manager_patch.yaml.
        - --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs
        {{- end }}
        command:
        - /manager
        env:
{{- if or .Values.manager.env (and (kindIs "map" .Values.manager.envOverrides) (not (empty .Values.manager.envOverrides))) }}
          {{- if .Values.manager.env }}
          {{- toYaml .Values.manager.env | nindent 10 }}
          {{- end }}
          {{- if kindIs "map" .Values.manager.envOverrides }}
          {{- range $k, $v := .Values.manager.envOverrides }}
          - name: {{ $k }}
            value: {{ $v | quote }}
          {{ end }}
          {{- end }}
          {{- else }}
          []
          {{- end }}
        image: "{{ .Values.manager.image.repository }}{{- if not (contains "@" .Values.manager.image.repository) }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 10
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- if .Values.manager.resources }}
          {{- toYaml .Values.manager.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.manager.securityContext }}
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        volumeMounts:
          {{- if .Values.manager.extraVolumeMounts }}
          {{- toYaml .Values.manager.extraVolumeMounts | nindent 10 }}
          {{- end }}
          # TalosEtcdBackup stages one encrypted snapshot here (cmd/main.go's backupSpoolDir, ADR 0047).
          - mountPath: /var/spool/ichor
            name: backup-spool
          # Extra API-server CA certificate during a CA rotation (ADR 0063).
          - mountPath: /var/run/ichor/trust
            name: api-trust
          # Unconditional, not gated on metricsCert.enabled: see the arg above.
          - mountPath: /tmp/k8s-webhook-server/serving-certs
            name: webhook-certs
            readOnly: true
          {{- if .Values.metricsCert.enabled }}
          - mountPath: /tmp/k8s-metrics-server/metrics-certs
            name: metrics-certs
            readOnly: true
          {{- end }}
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "ichor.serviceAccountName" . }}
      {{- if and (hasKey .Values.manager "terminationGracePeriodSeconds") (ne .Values.manager.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.manager.terminationGracePeriodSeconds }}
      {{- end }}
      volumes:
        {{- if .Values.manager.extraVolumes }}
        {{- toYaml .Values.manager.extraVolumes | nindent 8 }}
        {{- end }}
      - name: backup-spool
        emptyDir: {}
      - name: api-trust
        emptyDir: {}
      - name: webhook-certs
        secret:
          optional: true
          # Fixed name: matches the Secret's own fixed name (extras/webhook-server-cert.yaml).
          secretName: ichor-webhook-server-cert
      {{- if .Values.metricsCert.enabled }}
      - name: metrics-certs
        secret:
          optional: true
          # Fixed name: matches the Secret's own fixed name (extras/metrics-server-cert.yaml).
          secretName: ichor-metrics-server-cert
      {{- end }}
{{- end }}
