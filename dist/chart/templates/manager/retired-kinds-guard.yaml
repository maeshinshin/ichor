{{- /*
ADR 0168's guard for Helm. The installer refuses a leftover retired kind (internal/installer
checkRetiredKinds), but a Helm install or upgrade does not run the installer Job. This hook runs
the manager binary in --check-retired-kinds mode, which exits non-zero while a retired kind
(TalosStorage) still holds an object, so the release fails before the controller changes.

Inferred, not established: that a pre-upgrade hook runs before the chart's other resources are
applied on upgrade. This is carried over from the install lifecycle. If Helm applies the new
resources first, this guard runs too late; the installer's refusal does not depend on it.

Not established either: what Helm does on upgrade when the TalosStorage CRD template is removed
from the chart while its previous manifest carried helm.sh/resource-policy: keep. The guard does
not depend on that.

pre-install runs it too, so an install onto a cluster that still keeps the old CRD is guarded.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ichor-retired-kinds-guard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ichor-retired-kinds-guard
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosstorages
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ichor-retired-kinds-guard
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ichor-retired-kinds-guard
subjects:
- kind: ServiceAccount
  name: ichor-retired-kinds-guard
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ichor-retired-kinds-guard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "ichor.labels" . | nindent 8 }}
    spec:
      serviceAccountName: ichor-retired-kinds-guard
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: retired-kinds-guard
        image: "{{ .Values.manager.image.repository }}{{- if not (contains "@" .Values.manager.image.repository) }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}{{- end }}"
        args:
        - --check-retired-kinds
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
