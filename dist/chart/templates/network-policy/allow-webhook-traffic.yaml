{{- if and .Values.networkPolicy.enabled .Values.webhook.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ichor.name" . }}
  name: {{ include "ichor.resourceName" (dict "suffix" "allow-webhook-traffic" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: {{ include "ichor.name" . }}
  policyTypes:
    - Ingress
  ingress:
    # No `from`: the apiserver calls from a node's address, which Cilium labels remote-node and no
    # namespaceSelector or ipBlock matches (docs.cilium.io/en/stable/security/policy/layer3/). The webhook is TLS-only.
    - ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
{{- end }}
