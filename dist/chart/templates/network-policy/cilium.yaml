{{- /*
Ichor's CiliumNetworkPolicies, the chart's copy of config/cilium-network-policy. On by
default where Cilium's CiliumNetworkPolicy API is served (networkPolicy.cilium.enabled null), forced
either way by true or false. Every port below is the one the Deployments open, from the same values.
*/ -}}
{{- /* "true" when the policies are rendered: forced by networkPolicy.cilium.enabled, or (unset) when the
cluster serves Cilium's API. helm template has no cluster, so it renders nothing unless forced. */}}
{{- define "ichor.cnp.enabled" -}}
{{- $e := .Values.networkPolicy.cilium.enabled -}}
{{- if kindIs "invalid" $e -}}
{{- if .Capabilities.APIVersions.Has "cilium.io/v2/CiliumNetworkPolicy" }}true{{ end -}}
{{- else if $e }}true{{ end -}}
{{- end }}
{{- define "ichor.cnp.meta" -}}
labels:
  app.kubernetes.io/managed-by: {{ .ctx.Release.Service }}
  app.kubernetes.io/name: {{ include "ichor.name" .ctx }}
name: {{ include "ichor.resourceName" (dict "suffix" .suffix "context" .ctx) }}
namespace: {{ .ctx.Release.Namespace }}
{{- end }}
{{- define "ichor.cnp.apiserver" -}}
- toEntities:
  - kube-apiserver
  toPorts:
  - ports:
    - port: "6443"
      protocol: TCP
{{- end }}
{{- define "ichor.cnp.dns" -}}
- toEndpoints:
  - matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:k8s-app: kube-dns
  toPorts:
  - ports:
    - port: "53"
      protocol: UDP
    - port: "53"
      protocol: TCP
    # Through Cilium's DNS proxy, which lets the controller's toFQDNs policy learn addresses.
    rules:
      dns:
      - matchPattern: "*"
{{- end }}
{{- /* Egress outside the cluster on the given TCP ports. The dot is a dict: ports, and cidrs. With cidrs the
rule names them, without the whole world is allowed. */}}
{{- define "ichor.cnp.world" -}}
{{- if .cidrs }}
- toCIDR:
  {{- range .cidrs }}
  - {{ . | quote }}
  {{- end }}
{{- else }}
- toEntities:
  - world
{{- end }}
  toPorts:
  - ports:
    {{- range .ports }}
    - port: {{ . | quote }}
      protocol: TCP
    {{- end }}
{{- end }}
{{- if include "ichor.cnp.enabled" . }}
{{- $name := include "ichor.name" . }}
{{- $ports := .Values.networkPolicy.cilium.externalPorts }}
{{- $external := dict "ports" $ports "cidrs" .Values.networkPolicy.cilium.externalCIDRs }}
{{- $talosCIDRs := .Values.networkPolicy.cilium.talosCIDRs }}
{{- $externalCIDRs := .Values.networkPolicy.cilium.externalCIDRs }}
{{- $dynamic := .Values.networkPolicy.cilium.dynamicTalosEgress }}
{{- $metricsNamespaces := .Values.networkPolicy.cilium.metricsNamespaces }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  {{- include "ichor.cnp.meta" (dict "suffix" "default-deny" "ctx" $) | nindent 2 }}
spec:
  description: Everything in the namespace is denied unless a policy below allows it.
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}
{{- if .Values.manager.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  {{- include "ichor.cnp.meta" (dict "suffix" "controller-manager" "ctx" $) | nindent 2 }}
spec:
  description: The controller.
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: {{ $name }}
  ingress:
  {{- if .Values.webhook.enabled }}
  # The API server calls the admission webhooks.
  - fromEntities:
    - kube-apiserver
    # A call from the apiserver to a pod on another node arrives SNATed to its node's
    # cilium_host address, which the receiving agent labels remote-node only.
    - remote-node
    toPorts:
    - ports:
      - port: {{ .Values.webhook.port | quote }}
        protocol: TCP
  {{- end }}
  # The kubelet's probes.
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  {{- if .Values.metrics.enabled }}
  # /metrics: in-cluster scrapers only; with metricsNamespaces, only pods of those namespaces.
  - {{ if $metricsNamespaces }}fromEndpoints:
    {{- range $metricsNamespaces }}
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: {{ . | quote }}
    {{- end }}{{ else }}fromEntities:
    - cluster{{ end }}
    toPorts:
    - ports:
      - port: {{ .Values.metrics.port | quote }}
        protocol: TCP
  {{- end }}
  egress:
  {{- include "ichor.cnp.apiserver" . | nindent 2 }}
  # Talos nodes of this cluster: apid, the API server's /readyz and etcd's peer port. Machines outside it
  # come from ichor-controller-talos-egress (the controller keeps it), or from world when
  # networkPolicy.cilium.dynamicTalosEgress is false.
  - toEntities:
    - host
    - remote-node
    {{- if and (not $talosCIDRs) (not $dynamic) }}
    - world
    {{- end }}
    toPorts:
    - ports:
      - port: "50000"
        protocol: TCP
      - port: "6443"
        protocol: TCP
      - port: "2380"
        protocol: TCP
  {{- if $talosCIDRs }}
  - toCIDR:
    {{- range $talosCIDRs }}
    - {{ . | quote }}
    {{- end }}
    toPorts:
    - ports:
      - port: "50000"
        protocol: TCP
      - port: "6443"
        protocol: TCP
      - port: "2380"
        protocol: TCP
  {{- end }}
  {{- include "ichor.cnp.dns" . | nindent 2 }}
  {{- if or (not $dynamic) $externalCIDRs }}
  # TalosEtcdBackup's S3 endpoint (dynamic mode: the controller's policy names it; these CIDRs are the fallback).
  {{- include "ichor.cnp.world" $external | nindent 2 }}
  {{- end }}
{{- end }}
{{- if .Values.ichorUI.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  {{- include "ichor.cnp.meta" (dict "suffix" "ui" "ctx" $) | nindent 2 }}
spec:
  description: ichor-ui.
  endpointSelector:
    matchLabels:
      control-plane: ui-backend
      app.kubernetes.io/name: {{ $name }}
  ingress:
  # Users, in-cluster ingress and gateways, the kubelet's probes, port-forwards.
  - {{ if .Values.networkPolicy.cilium.uiIngressCIDRs }}fromCIDR:
    {{- range .Values.networkPolicy.cilium.uiIngressCIDRs }}
    - {{ . | quote }}
    {{- end }}
    toPorts:
    - ports:
      - port: {{ .Values.ichorUI.port | quote }}
        protocol: TCP
  - {{ end }}fromEntities:
    {{- if not .Values.networkPolicy.cilium.uiIngressCIDRs }}
    - world
    {{- end }}
    - cluster
    toPorts:
    - ports:
      - port: {{ .Values.ichorUI.port | quote }}
        protocol: TCP
  {{- if .Values.ichorUI.users.enabled }}
  # The API server reads the issuer's discovery document and JWKS.
  - fromEntities:
    - kube-apiserver
    # A call from the apiserver to a pod on another node arrives SNATed to its node's
    # cilium_host address, which the receiving agent labels remote-node only.
    - remote-node
    toPorts:
    - ports:
      - port: {{ .Values.ichorUI.users.internalPort | quote }}
        protocol: TCP
  {{- end }}
  egress:
  {{- include "ichor.cnp.apiserver" . | nindent 2 }}
  # Talos nodes of this cluster; the rest by ichor-controller-talos-egress, which selects these pods too.
  - toEntities:
    - host
    - remote-node
    {{- if and (not $talosCIDRs) (not $dynamic) }}
    - world
    {{- end }}
    toPorts:
    - ports:
      - port: "50000"
        protocol: TCP
  {{- if $talosCIDRs }}
  - toCIDR:
    {{- range $talosCIDRs }}
    - {{ . | quote }}
    {{- end }}
    toPorts:
    - ports:
      - port: "50000"
        protocol: TCP
  {{- end }}
  {{- include "ichor.cnp.dns" . | nindent 2 }}
  # The external OIDC issuer.
  {{- include "ichor.cnp.world" $external | nindent 2 }}
{{- end }}
{{- if .Values.installer.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  {{- include "ichor.cnp.meta" (dict "suffix" "installer" "ctx" $) | nindent 2 }}
spec:
  description: The installer Job. It talks to the API server and nothing else.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ichor-installer
  egress:
  {{- include "ichor.cnp.apiserver" . | nindent 2 }}
{{- end }}
# No policy for the Cilium Helm Job: it runs on the host network in kube-system, which CiliumNetworkPolicy
# does not govern.
{{- end }}
