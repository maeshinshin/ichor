{{- if .Values.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
    control-plane: controller-manager
  name: {{ include "ichor.resourceName" (dict "suffix" "controller-manager-metrics-monitor" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  - {{- if .Values.metrics.secure }}
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    {{- end }}
    path: /metrics
    port: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    scheme: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    {{- if .Values.metrics.secure }}
    tlsConfig:
      serverName: {{ include "ichor.resourceName" (dict "suffix" "controller-manager-metrics-service" "context" $) }}.{{ .Release.Namespace }}.svc
      {{- if .Values.metricsCert.enabled }}
      # Fixed name, not release-templated: matches extras/metrics-server-cert.yaml's own
      # fixed name, same reasoning as the webhook Secret (ADR 0006, ADR 0031).
      ca:
        secret:
          name: ichor-metrics-server-cert
          key: ca.crt
      cert:
        secret:
          name: ichor-metrics-server-cert
          key: tls.crt
      keySecret:
        name: ichor-metrics-server-cert
        key: tls.key
      {{- else }}
      insecureSkipVerify: true
      {{- end }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ichor.name" . }}
      control-plane: controller-manager
{{- end }}
