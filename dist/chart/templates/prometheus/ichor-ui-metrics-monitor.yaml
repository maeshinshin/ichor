{{- if and .Values.prometheus.enabled .Values.ichorUI.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
    control-plane: ui-backend
  # Fixed name, not release-templated: matches ichor-ui-service's own fixed name
  # (templates/ui/ui-service.yaml's own comment, ADR 0020).
  name: ichor-ui-metrics-monitor
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  # ichor-ui answers /metrics only to a caller with a Kubernetes token that may `get` the non-resource
  # URL /metrics (docs/adr/0108): the scraping Prometheus ServiceAccount needs the metrics-reader ClusterRole.
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    path: /metrics
    port: https
    # ichor-ui serves /metrics on the same HTTPS port and mux as its Connect API
    # (cmd/ichor-ui/main.go, docs/adr/0105). The scrape verifies the certificate against the CA in
    # ichorUI.tls.caSecret, else ConfigMap ichorUI.tls.caConfigMap (default: the Ichor serving CA).
    scheme: https
    tlsConfig:
      serverName: ichor-ui-service.{{ .Release.Namespace }}.svc
      ca:
        {{- if .Values.ichorUI.tls.caSecret }}
        secret:
          name: {{ .Values.ichorUI.tls.caSecret }}
        {{- else }}
        configMap:
          name: {{ .Values.ichorUI.tls.caConfigMap }}
        {{- end }}
          key: {{ .Values.ichorUI.tls.caKey }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ichor.name" . }}
      control-plane: ui-backend
{{- end }}
