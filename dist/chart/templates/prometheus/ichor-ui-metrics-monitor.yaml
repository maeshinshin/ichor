{{- if and .Values.prometheus.enabled .Values.ichorUI.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ichor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: ui-backend
  # Fixed name, not release-templated: matches ichor-ui-service's own fixed name
  # (templates/ui/ui-service.yaml's own comment, ADR 0020).
  name: ichor-ui-metrics-monitor
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  - path: /metrics
    port: https
    # ichor-ui serves /metrics on the same HTTPS port and mux as its Connect API
    # (cmd/ichor-ui/main.go, docs/adr/0105). /metrics is unauthenticated and the certificate is the
    # operator's or the Ichor CA's, so the scrape does not verify it.
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ichor.name" . }}
      control-plane: ui-backend
{{- end }}
