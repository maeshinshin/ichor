{{- if .Values.rbac.helpers.enabled }}
# Not bound to anyone. Bind it to the people who may write GitOps-tracked Ichor
# resources directly in an incident (ADR 0065). Ichor checks this verb with a
# SelfSubjectAccessReview made as the user; the user also needs ordinary update (or
# delete) rights on the resource, since the write is made as them.
# Roles with verbs '*' on these resources (the *-admin-role helpers) include it.
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ichor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "ichor.resourceName" (dict "suffix" "break-glass-role" "context" $) }}
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosconfigpatches
  - talosmachines
  verbs:
  - break-glass
{{- end }}
