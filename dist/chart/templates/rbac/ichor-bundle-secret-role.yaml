{{- with .Values.rbac.bundleSecret.names }}
# Not bound to anyone. Bind it with a RoleBinding in this namespace to the people who run
# `ichor create credentials`, `ichor export bundle`, `ichor rotate ca` (the credential hand-off) and
# `ichor adopt --add-machine`: each reads the cluster's secrets bundle Secret. It grants get on exactly
# the Secrets named in rbac.bundleSecret.names, nothing else; the Secret holds every Talos and Kubernetes CA key.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "ichor.labels" $ | nindent 4 }}
  name: {{ include "ichor.resourceName" (dict "suffix" "bundle-secret-role" "context" $) }}
  namespace: {{ $.Release.Namespace }}
rules:
- apiGroups:
  - ""
  resourceNames:
  {{- toYaml . | nindent 2 }}
  resources:
  - secrets
  verbs:
  - get
{{- end }}
