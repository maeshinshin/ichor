{{- if .Values.webhook.enabled }}
# Mirrors config/rbac/ichor-consent-sweep/. Fixed names, because the controller impersonates the
# username system:serviceaccount:<namespace>:ichor-consent-sweep. The controller never writes a TalosCluster;
# this identity removes the kube-proxy switch consent annotation (ADR 0066) and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-consent-sweep
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-consent-sweep-role
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-consent-sweep-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ichor-consent-sweep-role
subjects:
- kind: ServiceAccount
  name: ichor-consent-sweep
  namespace: {{ .Release.Namespace }}
---
# The controller may impersonate this ServiceAccount and no other.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-consent-sweep-impersonate-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resourceNames:
  - ichor-consent-sweep
  resources:
  - serviceaccounts
  verbs:
  - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-consent-sweep-impersonate-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ichor-consent-sweep-impersonate-role
subjects:
- kind: ServiceAccount
  name: {{ include "ichor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
