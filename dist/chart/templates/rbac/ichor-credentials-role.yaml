{{- if or .Values.rbac.helpers.enabled .Values.ichorUI.credentials.groups .Values.ichorUI.credentials.serviceAccount }}
# Not bound to anyone unless ichorUI.credentials says so. The people who may download the new
# kubeconfig and talosconfig of a CA rotation from the UI need this verb (ADR 0093). Ichor checks it
# with a SelfSubjectAccessReview made as the user. The files hold cluster-admin private keys.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ichor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "ichor.resourceName" (dict "suffix" "credentials-role" "context" $) }}
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters/credentials
  verbs:
  - download
{{- end }}
