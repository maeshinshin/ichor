{{- if and .Values.ichorUI.enabled (or .Values.ichorUI.credentials.groups .Values.ichorUI.credentials.serviceAccount) }}
# Opt-in grants of the credentials download verb. With OIDC on, name the groups whose
# members may download (as the IdP names them plus ichorUI.oidc.groupsPrefix, for example
# "oidc:platform-admins"). With OIDC off, ichor-ui acts as its own ServiceAccount, so only
# ichorUI.credentials.serviceAccount=true lets anyone download, and then anyone who can reach
# ichor-ui can.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: {{ include "ichor.resourceName" (dict "suffix" "credentials-rolebinding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ichor.resourceName" (dict "suffix" "credentials-role" "context" $) }}
subjects:
{{- range .Values.ichorUI.credentials.groups }}
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ . | quote }}
{{- end }}
{{- if .Values.ichorUI.credentials.serviceAccount }}
- kind: ServiceAccount
  name: ichor-ui
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
