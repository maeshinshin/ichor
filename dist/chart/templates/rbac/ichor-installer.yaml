{{- if .Values.installer.enabled }}
# Mirrors config/rbac/ichor-installer/. Fixed names, because the controller's
# executor puts the ServiceAccount's name in the Job it creates. The rules are compared with
# config/rbac/ichor-installer/role.yaml by dist/chart/chart_test.go.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-installer
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-installer-role
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - create
  - get
- apiGroups:
  - apiextensions.k8s.io
  resourceNames:
  - ichorinstallations.ichor.maesh.dev
  - ichorusers.ichor.maesh.dev
  - machinereclaims.ichor.maesh.dev
  - talosclusters.ichor.maesh.dev
  - talosconfigpatches.ichor.maesh.dev
  - talosetcdbackups.ichor.maesh.dev
  - talosmachines.ichor.maesh.dev
  - talosoperations.ichor.maesh.dev
  - talosstorages.ichor.maesh.dev
  resources:
  - customresourcedefinitions
  verbs:
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - ichor-admin
  - ichor-cni-role
  - ichor-ichor-break-glass-role
  - ichor-ichor-credentials-role
  - ichor-ichor-diagnostics-role
  - ichor-ichor-ui-role
  - ichor-ichorinstallation-admin-role
  - ichor-ichorinstallation-editor-role
  - ichor-ichorinstallation-viewer-role
  - ichor-ichoruser-admin-role
  - ichor-ichoruser-editor-role
  - ichor-ichoruser-viewer-role
  - ichor-installer-role
  - ichor-machine-reclaimer
  - ichor-manager-role
  - ichor-metrics-auth-role
  - ichor-metrics-reader
  - ichor-operator
  - ichor-taloscluster-admin-role
  - ichor-taloscluster-editor-role
  - ichor-taloscluster-viewer-role
  - ichor-talosconfigpatch-admin-role
  - ichor-talosconfigpatch-editor-role
  - ichor-talosconfigpatch-viewer-role
  - ichor-talosetcdbackup-admin-role
  - ichor-talosetcdbackup-editor-role
  - ichor-talosetcdbackup-viewer-role
  - ichor-talosmachine-admin-role
  - ichor-talosmachine-editor-role
  - ichor-talosmachine-viewer-role
  - ichor-talosoperation-admin-role
  - ichor-talosoperation-editor-role
  - ichor-talosoperation-viewer-role
  - ichor-talosstorage-admin-role
  - ichor-talosstorage-editor-role
  - ichor-talosstorage-viewer-role
  - ichor-viewer
  resources:
  - clusterroles
  verbs:
  - bind
  - escalate
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - ichor-cni-job-role
  - ichor-cni-records-role
  - ichor-cni-role
  - ichor-ichor-ui-role
  - ichor-installer-role
  - ichor-leader-election-role
  - ichor-manager-role
  - ichor-pod-restart-role
  - ichor-user-access
  resources:
  - roles
  verbs:
  - bind
  - escalate
- apiGroups:
  - scheduling.k8s.io
  resources:
  - priorityclasses
  verbs:
  - create
  - get
  - patch
  - update
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingadmissionpolicies
  - mutatingwebhookconfigurations
  - validatingadmissionpolicybindings
  - validatingwebhookconfigurations
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - ""
  resourceNames:
  - {{ .Release.Namespace }}
  resources:
  - namespaces
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-installer-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ichor-installer-role
subjects:
- kind: ServiceAccount
  name: ichor-installer
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-installer-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  # delete: the snapshot ConfigMaps are named <job>-snapshot-N and the Job name is generated, so
  # resourceNames cannot express them; delete stays namespace-wide in the release namespace.
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
- apiGroups:
  # The Cilium policies of config/cilium-network-policy, applied only when Cilium's CRD exists.
  - cilium.io
  resources:
  - ciliumnetworkpolicies
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - ichor-cni-role
  - ichor-ichor-ui-role
  - ichor-installer-role
  - ichor-leader-election-role
  - ichor-manager-role
  - ichor-user-access
  resources:
  - roles
  verbs:
  - bind
  - escalate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-installer-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ichor-installer-role
subjects:
- kind: ServiceAccount
  name: ichor-installer
  namespace: {{ .Release.Namespace }}
{{- end }}
