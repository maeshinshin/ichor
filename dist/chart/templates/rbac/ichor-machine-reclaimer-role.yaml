{{- if .Values.rbac.helpers.enabled }}
# For granting "Reset and add" to people who are not ichor:admin (which holds these rules already). Bind it with an explicit RoleBinding to the people who may reset a machine that another
# Talos cluster configured and add it here.
# Ichor's webhook checks the verb `reclaim` with a SubjectAccessReview as the user.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: {{ include "ichor.resourceName" (dict "suffix" "machine-reclaimer" "context" $) }}
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - machinereclaims
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - reclaim
{{- end }}
