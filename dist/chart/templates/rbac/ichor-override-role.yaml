{{- if .Values.rbac.helpers.enabled }}
# Not bound to anyone. Bind it to the people who may reset a node, restore etcd, override a
# guard or remove an Ichor finalizer in an incident (ADR 0065). Ichor checks this verb with a
# SelfSubjectAccessReview made as the user.
# The *-admin-role helpers list their verbs and do not include it.
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: {{ include "ichor.resourceName" (dict "suffix" "override-role" "context" $) }}
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosconfigpatches
  - talosmachines
  verbs:
  - override
{{- end }}
