{{- if .Values.webhook.enabled }}
# Mirrors config/rbac/ichor-storage-extensions/. Fixed names, because the controller impersonates the
# username system:serviceaccount:<namespace>:ichor-storage-extensions. The controller never writes a TalosCluster
# spec; this identity writes spec.schematic.id (ADR 0173) and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-storage-extensions
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-storage-extensions-role
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-storage-extensions-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ichor-storage-extensions-role
subjects:
- kind: ServiceAccount
  name: ichor-storage-extensions
  namespace: {{ .Release.Namespace }}
---
# The controller may impersonate this ServiceAccount and no other.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-storage-extensions-impersonate-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resourceNames:
  - ichor-storage-extensions
  resources:
  - serviceaccounts
  verbs:
  - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-storage-extensions-impersonate-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ichor-storage-extensions-impersonate-role
subjects:
- kind: ServiceAccount
  name: {{ include "ichor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
