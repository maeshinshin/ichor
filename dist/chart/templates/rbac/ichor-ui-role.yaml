{{- if .Values.ichorUI.enabled }}
# Mirrors config/rbac/ichor-ui/role.yaml, generated by "make manifests-ichor-ui" from
# internal/uiapi/rbac_markers.go, minus its secrets rule -- see
# ichor-ui-secrets-role.yaml's own comment for where that moved and why. Deliberately
# narrower than manager-role otherwise: no watch (this backend is a stateless reader with
# no informer cache), no events beyond create (break-glass) and list (the operation page), no finalizers, no status subresource. Kept in its own
# file so it never merges with manager-role.yaml -- the controller's and the UI backend's
# permissions must stay separate (architecture.md "Trust").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ichor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: ichor-ui-role
rules:
- apiGroups:
  - ""
  resourceNames:
  - argocd-cm
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - list
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  verbs:
  - get
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  verbs:
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosoperations/ca-rotation
  - talosoperations/etcd-restore
  - talosoperations/node-reset
  - talosoperations/node-shutdown
  - talosoperations/shutdown
  verbs:
  - start
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosetcdbackups
  verbs:
  - get
  - list
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines
  verbs:
  - delete
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches
  - talosoperations
  verbs:
  - create
  - delete
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosstorages
  verbs:
  - list
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  verbs:
  - list
{{- if or .Values.ichorUI.oidc.enabled .Values.ichorUI.users.enabled }}
# Only with OIDC login or Ichor's own users: act as the
# signed-in user. Optionally narrowed to named users/groups; never serviceaccounts or
# userextras.
{{- with .Values.ichorUI.oidc.impersonate.users }}
- apiGroups:
  - ""
  resourceNames:
  {{- toYaml . | nindent 2 }}
  resources:
  - users
  verbs:
  - impersonate
{{- else }}
- apiGroups:
  - ""
  resources:
  - users
  verbs:
  - impersonate
{{- end }}
{{- if and .Values.ichorUI.users.enabled (not .Values.ichorUI.oidc.enabled) }}
# Only Ichor's users are on: the groups are the three built-in roles plus any configured ones.
- apiGroups:
  - ""
  resourceNames:
  - ichor:viewer
  - ichor:operator
  - ichor:admin
  {{- with .Values.ichorUI.oidc.impersonate.groups }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  resources:
  - groups
  verbs:
  - impersonate
{{- else }}
{{- with .Values.ichorUI.oidc.impersonate.groups }}
- apiGroups:
  - ""
  resourceNames:
  {{- toYaml . | nindent 2 }}
  resources:
  - groups
  verbs:
  - impersonate
{{- else }}
- apiGroups:
  - ""
  resources:
  - groups
  verbs:
  - impersonate
{{- end }}
{{- end }}
{{- end }}
{{- end }}
