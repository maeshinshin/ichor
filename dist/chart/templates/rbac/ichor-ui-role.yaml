{{- if .Values.ichorUI.enabled }}
# Mirrors config/rbac/ichor-ui/role.yaml, generated by "make manifests-ichor-ui" from
# internal/uiapi/rbac_markers.go, minus its secrets rule -- see
# ichor-ui-secrets-role.yaml's own comment for where that moved and why. Deliberately
# narrower than manager-role otherwise: no watch (this backend is a stateless reader with
# no informer cache), no events beyond create (override) and list (the operation page), no finalizers, no status subresource. Kept in its own
# file so it never merges with manager-role.yaml -- the controller's and the UI backend's
# permissions must stay separate (architecture.md "Trust").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-ui-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - list
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - apiextensions.k8s.io
  resourceNames:
  - gateways.gateway.networking.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  verbs:
  - get
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations/settings
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  verbs:
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters/node-reader
  - talosclusters/public
  verbs:
  - issue
- apiGroups:
  - ichor.maesh.dev
  resources:
  - taloscredentialrequests
  verbs:
  - create
  - get
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosoperations/ca-rotation
  - talosoperations/etcd-restore
  - talosoperations/node-reset
  - talosoperations/node-shutdown
  - talosoperations/shutdown
  verbs:
  - start
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosetcdbackups
  verbs:
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines
  verbs:
  - delete
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches
  - talosoperations
  verbs:
  - create
  - delete
  - get
  - list
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosstorages
  verbs:
  - list
{{- if or .Values.ichorUI.oidc.enabled .Values.ichorUI.users.enabled }}
# Only with OIDC login or Ichor's own users: act as the signed-in user.
# Never a name that has not been given: the groups are the three built-in roles plus the
# configured ones, and never a system: group; the users are the listed ones, and the Ichor users are listed
# by the controller in the ClusterRole ichor-ui-impersonate.
{{- $imp := .Values.ichorUI.oidc.impersonate }}
{{- if and .Values.ichorUI.oidc.enabled (not $imp.groups) }}
{{- fail "ichorUI.oidc.impersonate.groups must list the groups ichor-ui may impersonate when ichorUI.oidc.enabled is set (an empty list used to mean any group, including system:masters)" }}
{{- end }}
{{- if and .Values.ichorUI.oidc.enabled (not $imp.users) (not $imp.anyUser) }}
{{- fail "ichorUI.oidc.impersonate.users must list the users ichor-ui may impersonate when ichorUI.oidc.enabled is set; set ichorUI.oidc.impersonate.anyUser=true to allow any user name and accept that a compromised ichor-ui can then act as any of them" }}
{{- end }}
{{- if and .Values.ichorUI.oidc.enabled $imp.users }}
- apiGroups:
  - ""
  resourceNames:
  {{- toYaml $imp.users | nindent 2 }}
  resources:
  - users
  verbs:
  - impersonate
{{- else if and .Values.ichorUI.oidc.enabled $imp.anyUser }}
- apiGroups:
  - ""
  resources:
  - users
  verbs:
  - impersonate
{{- end }}
- apiGroups:
  - ""
  resourceNames:
  - ichor:viewer
  - ichor:operator
  - ichor:admin
  {{- if .Values.ichorUI.oidc.enabled }}
  {{- toYaml $imp.groups | nindent 2 }}
  {{- end }}
  resources:
  - groups
  verbs:
  - impersonate
{{- end }}
{{- end }}
