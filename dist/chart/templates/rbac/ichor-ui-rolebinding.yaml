{{- if .Values.ichorUI.enabled }}
# Mirrors config/rbac/ichor-ui/role_binding.yaml (ADR 0018, ADR 0020).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-ui-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ichor-ui-role
subjects:
- kind: ServiceAccount
  name: ichor-ui
  namespace: {{ .Release.Namespace }}
{{- end }}
