{{- if .Values.ichorUI.enabled }}
# The secrets rule internal/uiapi/rbac_markers.go declares with its own namespace=
# ichor-system qualifier, carried here into a namespace-scoped Role -- matching exactly
# how the controller's own equivalent rule ships (manager-secrets-role.yaml/
# manager-secrets-rolebinding.yaml), not as part of ichor-ui-role.yaml's ClusterRole.
# The bundle Secret is resolved in the controller's own namespace (ADR 0011), so
# cluster-wide secrets:get is wider than this backend needs; dist/chart/chart_test.go's
# checkNoClusterWideSecretsRead guards exactly this pattern. config/rbac/ichor-ui/role.yaml
# (generated from the same, now-namespaced marker) carries the identical split: a
# ClusterRole with no secrets rule, plus this same rule in its own namespaced Role --
# the two paths no longer diverge (ADR 0020's "reported gap" is closed).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-ui-secrets-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
{{- if .Values.ichorUI.users.enabled }}
# Ichor users (docs/adr/0094): re-read an IchorUser, and patch the one credentials Secret
# (never create, never list).
- apiGroups:
  - ""
  resourceNames:
  - ichor-user-credentials
  resources:
  - secrets
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers
  verbs:
  - get
{{- end }}
# "Reset and add" (ADR 0103, ADR 0107): the UI creates and reads MachineReclaim requests; with OIDC off
# it writes them as itself, so it holds the reclaim verb the webhook checks.
- apiGroups:
  - ichor.maesh.dev
  resources:
  - machinereclaims
  verbs:
  - create
  - get
  - list
  - reclaim
  - update
{{- end }}
