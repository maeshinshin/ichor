{{- if .Values.ichorUI.enabled }}
# The secrets rule internal/uiapi/rbac_markers.go declares with no namespace qualifier,
# moved here into a namespace-scoped Role -- matching exactly how the controller's own
# equivalent rule ships (manager-secrets-role.yaml/manager-secrets-rolebinding.yaml), not
# as part of ichor-ui-role.yaml's ClusterRole. The bundle Secret is resolved in the
# controller's own namespace (ADR 0011), so cluster-wide secrets:get is wider than this
# backend needs; dist/chart/chart_test.go's checkNoClusterWideSecretsRead guards exactly
# this pattern. config/rbac/ichor-ui/role.yaml (generated from the marker, unnamespaced)
# still carries this rule in its ClusterRole -- narrowing the marker itself with
# namespace=ichor-system, the one-line fix that would make the generated file match this
# template, is internal/uiapi's own file and out of this change's scope; recorded in
# ADR 0020 as a reported gap, not silently worked around.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ichor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: ichor-ui-secrets-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
{{- end }}
