{{- if .Values.ichorUI.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-ui-secrets-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ichor-ui-secrets-role
subjects:
- kind: ServiceAccount
  name: ichor-ui
  namespace: {{ .Release.Namespace }}
{{- end }}
