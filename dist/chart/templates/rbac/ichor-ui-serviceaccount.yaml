{{- if .Values.ichorUI.enabled }}
# Mirrors config/rbac/ichor-ui/service_account.yaml. Fixed name, not
# release-templated: the UI backend's identity must stay separate from the controller's
# own ServiceAccount (architecture.md "Trust" -- "only the controller holds an
# os:admin-equivalent Talos identity; the UI backend holds a read-only one"), and a future
# "ichor ui" port-forward needs a predictable name to find the Deployment/Service by, the
# same reasoning ichor-webhook-service's fixed name already uses.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ichor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: ichor-ui
  namespace: {{ .Release.Namespace }}
{{- end }}
