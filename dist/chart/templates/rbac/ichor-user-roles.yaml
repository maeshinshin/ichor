{{- if .Values.ichorUI.users.enabled }}
# The built-in roles of Ichor's own users (docs/adr/0094): three ClusterRoles bound to the groups
# the Ichor OIDC issuer puts in a token. Fixed names, because the group names are fixed. None
# holds secrets, impersonate or '*'; cluster-admin is not part of ichor-admin (see
# ichorUI.users.clusterAdminRoles).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-viewer
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosconfigpatches
  - talosetcdbackups
  - talosmachines
  - talosoperations
  - talosstorages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-viewer-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ichor-viewer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ichor:viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-operator
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosconfigpatches
  - talosetcdbackups
  - talosmachines
  - talosoperations
  - talosstorages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches
  - talosoperations
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosetcdbackups
  - talosmachines
  verbs:
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines/approval
  verbs:
  - approve
# A short-lived os:reader talosconfig for talosctl (ADR 0124): the webhook checks the download verb; the CLI
# reads the answer of its own request. Not in ichor-viewer.
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters/talosconfig-reader
  verbs:
  - download
- apiGroups:
  - ichor.maesh.dev
  resources:
  - taloscredentialrequests
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ichor-operator
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ichor:operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-admin
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosconfigpatches
  - talosetcdbackups
  - talosmachines
  - talosoperations
  - talosstorages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches
  - talosoperations
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations
  - talosclusters
  - talosetcdbackups
  - talosmachines
  verbs:
  - patch
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines/approval
  verbs:
  - approve
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosmachines/endpoint
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosmachines
  verbs:
  - delete
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorusers/password
  - talosclusters/authentication
  - talosclusters/cilium-values
  - talosclusters/secret-references
  - talosetcdbackups/secret-references
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations/version
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - machinereclaims
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - reclaim
- apiGroups:
  - ichor.maesh.dev
  resources:
  - ichorinstallations/settings
  verbs:
  - update
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosoperations/ca-rotation
  - talosoperations/etcd-restore
  - talosoperations/key-rotation
  - talosoperations/node-reset
  - talosoperations/node-shutdown
  - talosoperations/shutdown
  verbs:
  - start
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  - talosconfigpatches
  - talosmachines
  verbs:
  - override
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters/credentials
  - talosclusters/talosconfig-reader
  - talosmachines/etcd-snapshot
  - talosmachines/packet-capture
  - talosmachines/support-bundle
  verbs:
  - download
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosetcdbackups
  verbs:
  - create
  - delete
# Every download asks the controller for a short-lived certificate with a TalosCredentialRequest (ADR 0108);
# creating one is plain RBAC, the validating webhook checks the download verb.
- apiGroups:
  - ichor.maesh.dev
  resources:
  - taloscredentialrequests
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-admin-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ichor-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ichor:admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-user-access
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/portforward
  verbs:
  - create
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: ichor-user-access-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ichor-user-access
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ichor:viewer
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ichor:operator
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ichor:admin
{{- range .Values.ichorUI.users.clusterAdminRoles }}
---
# Opt-in: also gives this Ichor role cluster-admin. That includes reading the secrets bundle.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ichor.labels" $ | nindent 4 }}
  name: {{ printf "ichor-%s-cluster-admin" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ printf "ichor:%s" . | quote }}
{{- end }}
{{- end }}
