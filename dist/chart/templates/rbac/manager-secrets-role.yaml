apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: {{ include "ichor.resourceName" (dict "suffix" "manager-secrets-role" "context" $) }}
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  # The render input ichor-oidc-trust, read through the namespace-scoped cache.
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
- apiGroups:
  - ""
  # Fixed names: the trust ConfigMap and the published serving CA.
  resourceNames:
  - ichor-oidc-trust
  - ichor-ui-ca
  resources:
  - configmaps
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - ""
  # Fixed name: ichor-ui's credentials Secret; the controller only deletes entries.
  resourceNames:
  - ichor-user-credentials
  resources:
  - secrets
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  # Fixed names: the issuer's signing keys, the serving CA and leaf, and the published CA.
  resourceNames:
  - ichor-oidc-ca
  - ichor-oidc-signing
  - ichor-oidc-tls
  - ichor-ui-ca
  resources:
  - secrets
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  # Fixed name: matches the Secret's own fixed name (extras/metrics-server-cert.yaml).
  resourceNames:
  - ichor-metrics-server-cert
  resources:
  - secrets
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  # Fixed name: matches the Secret's own fixed name (extras/webhook-server-cert.yaml).
  resourceNames:
  - ichor-webhook-server-cert
  resources:
  - secrets
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - cilium.io
  # The controller keeps one CiliumNetworkPolicy of its own egress current.
  resources:
  - ciliumnetworkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - update
