apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: {{ include "ichor.resourceName" (dict "suffix" "manager-secrets-rolebinding" "context" $) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  # Binds to the namespaced secrets Role (manager-secrets-role.yaml), not the
  # toggled manager-role: that one is a ClusterRole by default (the webhook
  # config permission it carries is cluster-scoped) and the plugin's
  # Role/ClusterRole toggle can only render one kind at a time, so reusing
  # its name here would silently drop the secrets RBAC under the default
  # (rbac.namespaced: false) values.
  name: {{ include "ichor.resourceName" (dict "suffix" "manager-secrets-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "ichor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
