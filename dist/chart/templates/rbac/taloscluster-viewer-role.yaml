{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: {{ include "ichor.resourceName" (dict "suffix" "taloscluster-viewer-role" "context" $) }}
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosclusters/status
  verbs:
  - get
{{- end }}
