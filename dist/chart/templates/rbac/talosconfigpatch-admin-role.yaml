{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  name: {{ include "ichor.resourceName" (dict "suffix" "talosconfigpatch-admin-role" "context" $) }}
rules:
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches
  verbs:
  - '*'
- apiGroups:
  - ichor.maesh.dev
  resources:
  - talosconfigpatches/status
  verbs:
  - get
{{- end }}
