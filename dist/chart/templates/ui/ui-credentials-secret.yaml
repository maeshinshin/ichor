{{- if and .Values.ichorUI.enabled .Values.ichorUI.users.enabled }}
# The store of password hashes. Empty: ichor-ui's ServiceAccount may patch this
# one Secret but cannot create it, so the chart does. Kept on uninstall, and holding no key
# of its own, so an upgrade never resets a user's password.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: ui
    {{- include "ichor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
  name: ichor-user-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
{{- end }}
