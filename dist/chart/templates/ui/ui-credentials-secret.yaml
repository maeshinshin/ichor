{{- if and .Values.ichorUI.enabled .Values.ichorUI.users.enabled }}
# The store of password hashes (docs/adr/0094). Empty: ichor-ui's ServiceAccount may patch this
# one Secret but cannot create it, so the chart does. Kept on uninstall, and holding no key
# of its own, so an upgrade never resets a user's password.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: ui
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ichor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/resource-policy": keep
  name: ichor-user-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
{{- end }}
