{{- if and .Values.ichorUI.enabled .Values.ichorUI.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
    control-plane: ui-backend
  name: ichor-ui-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.ichorUI.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ichor.name" . }}
      control-plane: ui-backend
{{- end }}
