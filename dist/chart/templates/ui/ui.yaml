{{- if .Values.ichorUI.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
    control-plane: ui-backend
    {{- with .Values.ichorUI.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" "app.kubernetes.io/component" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  # Fixed name, not release-templated (see templates/rbac/ichor-ui-serviceaccount.yaml's
  # own comment): the ServiceAccount this Deployment runs as, and a future
  # "ichor ui" port-forward, both need a predictable name.
  name: ichor-ui
  namespace: {{ .Release.Namespace }}
  {{- if .Values.ichorUI.annotations }}
  annotations:
    {{- toYaml .Values.ichorUI.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.ichorUI.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ichor.name" . }}
      control-plane: ui-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ichor.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: ui-backend
        {{- with .Values.ichorUI.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.ichorUI.pod }}
      {{- with .annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.ichorUI.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.ichorUI.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.ichorUI.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.ichorUI.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.ichorUI.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.ichorUI.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        # HTTPS only (docs/adr/0105): the operator's pair when tls.secretName is set, else the Ichor
        # serving certificate from /etc/ichor/ui-tls.
        - --addr=:{{ .Values.ichorUI.port }}
        {{- with .Values.ichorUI.plaintextPort }}
        # DEPRECATED, removed in the next minor release: plain HTTP for an edge not yet moved to HTTPS.
        - --http-addr=:{{ . }}
        {{- end }}
        {{- if .Values.ichorUI.tls.secretName }}
        - --tls-cert-file=/etc/ichor/tls/tls.crt
        - --tls-key-file=/etc/ichor/tls/tls.key
        {{- end }}
        {{- if .Values.ichorUI.users.enabled }}
        # Ichor's own users and issuer (docs/adr/0094).
        - --users-enabled=true
        - --external-url={{ required "ichorUI.users.externalURL is required when ichorUI.users.enabled" .Values.ichorUI.users.externalURL }}
        - --internal-addr=:{{ .Values.ichorUI.users.internalPort }}
        - --internal-tls-dir=/etc/ichor/oidc-tls
        - --signing-keys-dir=/etc/ichor/oidc-signing
        - --token-ttl={{ .Values.ichorUI.users.tokenTTL }}
        - --refresh-lifetime={{ .Values.ichorUI.users.refreshLifetime }}
        {{- with .Values.ichorUI.users.kubeAPIServerURL }}
        - --kube-api-server-url={{ . }}
        {{- end }}
        {{- with .Values.ichorUI.users.kubeAPITLSServerName }}
        - --kube-api-tls-server-name={{ . }}
        {{- end }}
        {{- end }}
        command:
        - /ichor-ui
        image: "{{ .Values.ichorUI.image.repository }}{{- if not (contains "@" .Values.ichorUI.image.repository) }}:{{ .Values.ichorUI.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.ichorUI.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        env:
        # Where the secrets bundle lives (ADR 0011); fixed, not a value, so it cannot be dropped.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.reclaim.enabled }}
        # Break-glass machine reclaim (ADR 0103, section 2.2); the same switch as the controller's --reclaim.
        - name: ICHOR_RECLAIM_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.settings.readOnly }}
        # The same switch as the controller's --settings-read-only (ADR 0105).
        - name: ICHOR_SETTINGS_READ_ONLY
          value: "true"
        {{- end }}
        {{- if .Values.ichorUI.oidc.enabled }}
        # OIDC login (docs/adr/0058). A public client: there is no client secret anywhere.
        - name: ICHOR_OIDC_ISSUER
          value: {{ required "ichorUI.oidc.issuer is required when ichorUI.oidc.enabled" .Values.ichorUI.oidc.issuer | quote }}
        - name: ICHOR_OIDC_CLIENT_ID
          value: {{ required "ichorUI.oidc.clientId is required when ichorUI.oidc.enabled" .Values.ichorUI.oidc.clientId | quote }}
        - name: ICHOR_OIDC_USERNAME_CLAIM
          value: {{ .Values.ichorUI.oidc.usernameClaim | quote }}
        - name: ICHOR_OIDC_GROUPS_CLAIM
          value: {{ .Values.ichorUI.oidc.groupsClaim | quote }}
        - name: ICHOR_OIDC_USERNAME_PREFIX
          value: {{ .Values.ichorUI.oidc.usernamePrefix | quote }}
        - name: ICHOR_OIDC_GROUPS_PREFIX
          value: {{ .Values.ichorUI.oidc.groupsPrefix | quote }}
        {{- end }}
        # No dedicated health endpoint exists yet (ADR 0017). ichor-ui is HTTPS only (ADR 0105), and a
        # kubelet TCP probe makes a TLS server log "TLS handshake error ... EOF" every few seconds, so
        # readiness probes /auth/config over HTTPS (cheap, always served; the kubelet skips cert checks).
        # Until the controller has issued the Ichor leaf the handshake fails and the pod stays out of the
        # Service. Liveness is a TCP connect instead: the leaf can arrive 60-90 s after the pod starts
        # and an HTTPS liveness probe would restart the pod first.
        livenessProbe:
          tcpSocket:
            port: {{ .Values.ichorUI.port }}
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /auth/config
            port: {{ .Values.ichorUI.port }}
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
        name: ichor-ui
        ports:
        - containerPort: {{ .Values.ichorUI.port }}
          name: https
          protocol: TCP
        {{- with .Values.ichorUI.plaintextPort }}
        - containerPort: {{ . }}
          name: http
          protocol: TCP
        {{- end }}
        {{- if .Values.ichorUI.users.enabled }}
        - containerPort: {{ .Values.ichorUI.users.internalPort }}
          name: internal
          protocol: TCP
        {{- end }}
        volumeMounts:
        # The Ichor serving certificate the controller keeps (docs/adr/0105).
        - name: ui-tls
          mountPath: /etc/ichor/ui-tls
          readOnly: true
        {{- if .Values.ichorUI.tls.secretName }}
        - name: tls
          mountPath: /etc/ichor/tls
          readOnly: true
        {{- end }}
        {{- if .Values.ichorUI.users.enabled }}
        - name: oidc-signing
          mountPath: /etc/ichor/oidc-signing
          readOnly: true
        - name: oidc-tls
          mountPath: /etc/ichor/oidc-tls
          readOnly: true
        {{- end }}
        resources:
          {{- if .Values.ichorUI.resources }}
          {{- toYaml .Values.ichorUI.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.ichorUI.securityContext }}
          {{- toYaml .Values.ichorUI.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
      securityContext:
        {{- if .Values.ichorUI.podSecurityContext }}
        {{- toYaml .Values.ichorUI.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: ichor-ui
      volumes:
      # Written by the controller for every install; optional so ichor-ui starts before the first
      # leaf exists (it answers handshakes with an error until then).
      - name: ui-tls
        secret:
          secretName: ichor-oidc-tls
          optional: true
      {{- if .Values.ichorUI.tls.secretName }}
      - name: tls
        secret:
          secretName: {{ .Values.ichorUI.tls.secretName | quote }}
      {{- end }}
      {{- if .Values.ichorUI.users.enabled }}
      # Written by the controller (docs/adr/0094); optional so ichor-ui starts before the
      # controller has made them and picks them up when the kubelet syncs the volume.
      - name: oidc-signing
        secret:
          secretName: ichor-oidc-signing
          optional: true
      - name: oidc-tls
        secret:
          secretName: ichor-oidc-tls
          optional: true
      {{- end }}
      {{- if and (hasKey .Values.ichorUI "terminationGracePeriodSeconds") (ne .Values.ichorUI.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.ichorUI.terminationGracePeriodSeconds }}
      {{- end }}
{{- end }}
