{{- if .Values.webhook.enabled }}
{{- /* name (without -v1alpha1.kb.io), handler path suffix, operations, resources */}}
{{- $hooks := list
  (dict "name" "voverride" "path" "override" "ops" (list "UPDATE") "res" (list "talosmachines" "talosconfigpatches"))
  (dict "name" "voverrideop" "path" "override" "ops" (list "CREATE" "UPDATE") "res" (list "talosoperations"))
  (dict "name" "vsecretrefs" "path" "override" "ops" (list "CREATE" "UPDATE") "res" (list "talosetcdbackups"))
  (dict "name" "vauthentication" "path" "override" "ops" (list "CREATE" "UPDATE") "res" (list "talosclusters"))
  (dict "name" "vtaloscluster" "path" "taloscluster" "ops" (list "CREATE" "UPDATE" "DELETE") "res" (list "talosclusters"))
  (dict "name" "vtalosconfigpatch" "path" "talosconfigpatch" "ops" (list "CREATE" "UPDATE") "res" (list "talosconfigpatches"))
  (dict "name" "vtalosmachine" "path" "talosmachine" "ops" (list "CREATE" "UPDATE" "DELETE") "res" (list "talosmachines"))
  (dict "name" "vmachinereclaim" "path" "machinereclaim" "ops" (list "CREATE" "UPDATE") "res" (list "machinereclaims"))
  (dict "name" "vtaloscredentialrequest" "path" "taloscredentialrequest" "ops" (list "CREATE") "res" (list "taloscredentialrequests"))
  (dict "name" "vichorinstallation" "path" "ichorinstallation" "ops" (list "CREATE" "UPDATE" "DELETE") "res" (list "ichorinstallations") "sideEffects" "NoneOnDryRun") }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  # Fixed names, not release-templated: Ichor is one installation per
  # cluster (design 4.1), this resource is cluster-scoped regardless of
  # release name, and cmd/main.go's cert rotator already hardcodes both
  # this name and the webhook Service's.
  name: ichor-validating-webhook-configuration
webhooks:
{{- range $h := $hooks }}
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ $.Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-{{ $h.path }}
  failurePolicy: Fail
  name: {{ $h.name }}-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    {{- range $h.ops }}
    - {{ . }}
    {{- end }}
    resources:
    {{- range $h.res }}
    - {{ . }}
    {{- end }}
  sideEffects: {{ $h.sideEffects | default "None" }}
  # An unavailable manager refuses writes within seconds, not after the 10 s default (ADR 0108).
  timeoutSeconds: 5
{{- end }}
{{- end }}
