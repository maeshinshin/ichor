{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  # Fixed names, not release-templated: Ichor is one installation per
  # cluster (design 4.1), this resource is cluster-scoped regardless of
  # release name, and cmd/main.go's cert rotator already hardcodes both
  # this name and the webhook Service's.
  name: ichor-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-breakglass
  failurePolicy: Fail
  name: vbreakglass-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - UPDATE
    resources:
    - talosmachines
    - talosconfigpatches
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-breakglass
  failurePolicy: Fail
  name: vbreakglassop-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - talosoperations
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-breakglass
  failurePolicy: Fail
  name: vsecretrefs-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - talosetcdbackups
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-breakglass
  failurePolicy: Fail
  name: vauthentication-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - talosclusters
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-taloscluster
  failurePolicy: Fail
  name: vtaloscluster-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - talosclusters
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-talosconfigpatch
  failurePolicy: Fail
  name: vtalosconfigpatch-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - talosconfigpatches
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-talosmachine
  failurePolicy: Fail
  name: vtalosmachine-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - talosmachines
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-machinereclaim
  failurePolicy: Fail
  name: vmachinereclaim-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - machinereclaims
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ichor-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ichor-maesh-dev-v1alpha1-ichorinstallation
  failurePolicy: Fail
  name: vichorinstallation-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ichor.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - ichorinstallations
  sideEffects: NoneOnDryRun
{{- end }}
