{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "ichor.labels" . | nindent 4 }}
  # Fixed name, not release-templated: Ichor is one installation per cluster
  # (design 4.1), the ValidatingWebhookConfiguration below is cluster-scoped
  # regardless of release name, and cmd/main.go's cert rotator already
  # hardcodes this name.
  name: ichor-webhook-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: {{ .Values.webhook.port }}
  selector:
    app.kubernetes.io/name: {{ include "ichor.name" . }}
    control-plane: controller-manager
{{- end }}
