## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  ## Two replicas by default (design 2.4). Single-node clusters should set
  ## this to 1 and turn off manager.podDisruptionBudget.enabled below; the
  ## automatic switch is an installer feature, not phase 1.
  ##
  replicas: 2

  image:
    repository: ghcr.io/maeshinshin/ichor-controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    # The node this pod runs on: a cluster shutdown stops it last.
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    # This pod's ServiceAccount: the override webhook never blocks it.
    - name: POD_SERVICE_ACCOUNT
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    # A soft Go heap limit below the container's memory limit: the GC works before the kernel OOM-kills.
    - name: GOMEMLIMIT
      value: 400MiB

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  ## 256Mi was OOM-killed on a 3 CP + 1 W cluster (hardware run I). Keep the GOMEMLIMIT env above at about
  ## 80% of the memory limit.
  ##
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  ## Manager pod's affinity. The default prefers a control plane: after an etcd restore the nodes that were not
  ## wiped keep a stale kube-proxy, and a controller on one cannot reach the kubernetes Service to repair that.
  ##
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists

  ## PodDisruptionBudget for the controller (design 2.4). Single-node
  ## clusters should disable this alongside setting replicas: 1 above.
  ##
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations. The default lets it run on control planes, so draining the only
  ## worker cannot leave it unschedulable.
  ##
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name. ichor-critical is created by priorityClass below, so the controller (the only
  ## Talos writer) is not evicted before ordinary workloads under node pressure. Set "" to use none.
  ##
  priorityClassName: ichor-critical

  ## Topology spread constraints: placement across nodes by default (design
  ## 2.4). topologySpreadConstraints over podAntiAffinity because
  ## whenUnsatisfiable: ScheduleAnyway degrades to co-located replicas on a
  ## single-node cluster instead of leaving the second one Pending forever.
  ##
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          control-plane: controller-manager

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## The installer Job's identity. Off by default: a chart-installed Ichor is upgraded
## through the chart, and then nothing should hold the cluster-role escalation this
## ServiceAccount carries. See config/rbac/ichor-installer/role.yaml.
##
installer:
  enabled: false

## The Cilium Helm Job's identity: the ServiceAccount ichor-cni the controller puts
## in the Job that runs Helm over Cilium. On by default because Cilium is always Ichor's CNI
## and always Ichor's Helm release. It carries a cluster-role escalation (the chart's
## ClusterRoles are applied by it), so turn it off only when nothing may run that Job. See
## config/rbac/ichor-cni/role.yaml.
##
cniHelm:
  enabled: true

  ## Whether to render the Role and RoleBinding that let the Job hold what Cilium's own Roles in the
  ## namespace cilium-secrets grant (gatewayAPI, ingressController and envoyConfig need them). That
  ## namespace exists only where Cilium runs, and a RoleBinding into a missing namespace fails the
  ## install. "auto" renders them when `helm install` or `helm upgrade` finds the namespace (a plain
  ## `helm template`, as Argo CD runs it, cannot look and leaves them out); "true" always renders them
  ## (the cluster runs Cilium); "false" never does.
  ciliumSecretsRoles: auto

## Configure the ichor-ui deployment. It holds a read-only Kubernetes
## identity, separate from the controller's own ServiceAccount (architecture.md "Trust"):
## see config/rbac/ichor-ui/ and templates/rbac/ichor-ui-*.yaml.
##
ichorUI:
  ## Set to false to skip ichor-ui installation
  ##
  enabled: true

  ## Two replicas by default, same reasoning as manager.replicas above (design 2.4).
  ## Single-node clusters should set this to 1 and turn off
  ## ichorUI.podDisruptionBudget.enabled below.
  ##
  replicas: 2

  image:
    repository: ghcr.io/maeshinshin/ichor-ui
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## HTTPS port ichor-ui listens on (cmd/ichor-ui's own -addr flag default). It never serves
  ## plaintext here. The certificate is the one in tls.secretName, or else the Ichor
  ## serving certificate the controller keeps (Secret ichor-oidc-tls). An install that used to
  ## serve TLS on 8080 keeps its Service and edge by setting this to 8080.
  ##
  port: 8443

  ## With neither ichorUI.oidc nor ichorUI.users enabled there is no sign-in, and ichor-ui serves
  ## read-only calls only. Set this to true to restore the old open mode: every
  ## call is served with ichor-ui's ServiceAccount permissions to anyone who can reach it. It does
  ## nothing once oidc or users is on. An upgrade from before 0108 with no sign-in needs it to keep
  ## writing.
  ##
  allowUnauthenticated: false

  ## OIDC login with Kubernetes impersonation. Off by default: see
  ## allowUnauthenticated above for what ichor-ui does then. On: every request needs an ID token from this
  ## issuer, and ichor-ui calls the Kubernetes API as that user, so RBAC and audit apply per
  ## user. The client is public (authorization code + PKCE in the browser); register the UI's
  ## origin as a redirect URI. There is no client secret.
  ##
  oidc:
    enabled: false
    issuer: ""
    clientId: ""
    ## Claim used as the user name ("email" additionally requires email_verified).
    usernameClaim: email
    groupsClaim: groups
    ## Prepended to names so an IdP value can never collide with a built-in such as
    ## system:masters. Bind your RBAC to e.g. "oidc:alice@example.com" / "oidc:platform".
    usernamePrefix: "oidc:"
    groupsPrefix: "oidc:"
    ## The ServiceAccount is granted `impersonate` on exactly these names and no others.
    ## groups: required with OIDC (the groups your IdP's tokens can carry, with groupsPrefix applied,
    ## for example ["oidc:platform"]); the built-in ichor:viewer, ichor:operator and ichor:admin are
    ## always added, and a system: group can never be impersonated. users: required with OIDC too
    ## (with usernamePrefix applied, for example ["oidc:alice@example.com"]), because Kubernetes cannot
    ## match a user name by prefix; anyUser: true instead lets it impersonate any user name, so that
    ## a compromised ichor-ui could act as any user your RBAC binds, such as an administrator. Ichor's
    ## own users (users.enabled) need no entry: the controller lists them. Rendering fails when
    ## OIDC is on and these are not given.
    impersonate:
      users: []
      groups: []
      anyUser: false

  ## Ichor's own users and OIDC issuer. Off by default: it needs an https URL
  ## that browsers and the CLI reach, a Talos v1.14 contract and a config rollout on the control
  ## planes. On: ichor-ui serves a small OIDC issuer, accepts its tokens next to ichorUI.oidc.*'s
  ## (users "ichor:<name>", groups "ichor:<role>"), and every request needs a token. Create the
  ## first admin before the switch (ichor init --ui-url does). Passwords are stored as argon2id
  ## hashes in the Secret ichor-user-credentials; the user CRs hold none.
  ##
  users:
    enabled: false
    ## The https URL of ichor-ui as a browser reaches it (an Ingress, Gateway or LoadBalancer in
    ## front of the Service, or ichorUI.tls.secretName). It is the issuer of every token. Required
    ## when enabled.
    externalURL: ""
    ## HTTPS port of the internal listener the kube-apiserver reads discovery and JWKS from, over
    ## the Service's ClusterIP, with a certificate the controller keeps (Secret ichor-oidc-tls).
    internalPort: 8444
    ## ID token lifetime (1m to 15m): the worst-case delay for a disable to reach kubectl.
    tokenTTL: 5m
    ## Absolute lifetime of a refresh token (1h to 30d).
    refreshLifetime: 12h
    ## CIDRs of proxies in front of ichor-ui whose X-Forwarded-For the sign-in rate limits trust
    ## (the client is the rightmost address outside them). Empty: the TCP peer is the client, so
    ## behind a proxy or SNAT every user shares one limit.
    trustedProxyCIDRs: []
    ## The Kubernetes API URL users put in their kubeconfig (GetMyKubeconfig), e.g. a load
    ## balancer in front of the control planes. Empty uses the cluster's spec.endpoint.
    kubeAPIServerURL: ""
    ## Sent as the kubeconfig's tls-server-name when kubeAPIServerURL's host is not in the
    ## apiserver certificate's SANs (use a name that is). Empty sets none.
    kubeAPITLSServerName: ""
    ## Built-in role names (viewer, operator, admin) whose group is also bound to cluster-admin.
    ## Empty by default. Doing so lets those users read the secrets bundle, which holds the Talos
    ## credentials.
    clusterAdminRoles: []

  ## ichor-ui's Service. ClusterIP by default; exposing it over https is the operator's job
  ## (Ichor installs no ingress controller).
  ##
  service:
    type: ClusterIP
    ## Local keeps the client's address for a LoadBalancer or NodePort Service, which the failed-login
    ## counters key on (docs/guides/users-and-login.md). Empty leaves the cluster default (Cluster).
    externalTrafficPolicy: ""

  ## Serve this kubernetes.io/tls Secret (tls.crt, tls.key; for example from cert-manager) on the
  ## HTTPS port instead of the Ichor serving certificate. Empty serves the Ichor certificate, whose
  ## CA the controller publishes as the ConfigMap and Secret ichor-ui-ca for an edge to verify.
  ##
  tls:
    secretName: ""
    ## The CA prometheus.enabled's ServiceMonitor verifies the HTTPS port against, as key caKey of
    ## the ConfigMap caConfigMap or, when caSecret is set, of that Secret. The default is the
    ## Ichor serving CA; with secretName set, point this at the CA that issued that certificate.
    caConfigMap: ichor-ui-ca
    caSecret: ""
    caKey: ca.crt

  ## Who may download a support bundle, an etcd snapshot or a packet capture from a node. Each file can hold secrets: the etcd snapshot holds every Kubernetes
  ## Secret. Nobody may by default, including ichor-ui's own ServiceAccount, so with OIDC off
  ## the downloads are refused. Ichor checks the "download" verb on talosmachines/support-bundle,
  ## talosmachines/etcd-snapshot and talosmachines/packet-capture as the signed-in user.
  ##
  diagnostics:
    ## Groups to grant the verb to, with ichorUI.oidc.groupsPrefix applied, for example
    ## ["oidc:platform-admins"]. Only meaningful with ichorUI.oidc.enabled.
    groups: []
    ## Grant the verb to ichor-ui's own ServiceAccount. This is the only way to download with
    ## OIDC off, and it lets anyone who can reach ichor-ui download secrets. Leave false.
    serviceAccount: false

  ## Who may download the new kubeconfig and talosconfig of a CA rotation from the UI. They hold cluster-admin private keys. Nobody may by default, including
  ## ichor-ui's own ServiceAccount. Ichor checks the "download" verb on talosclusters/credentials
  ## as the signed-in user, and the controller signs the certificates in the files (a TalosCredentialRequest), valid a year unless a shorter time is chosen. Continuing a rotation needs it too: the
  ## check that the new kubeconfig works uses a ten-minute certificate asked for as the signed-in user.
  ##
  credentials:
    ## Groups to grant the verb to, with ichorUI.oidc.groupsPrefix applied. Only meaningful with
    ## ichorUI.oidc.enabled.
    groups: []
    ## Grant the verb to ichor-ui's own ServiceAccount. This is the only way to download with
    ## OIDC off, and then anyone who can reach ichor-ui gets cluster-admin credentials. Leave false.
    serviceAccount: false

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      # Two concurrent argon2id hashes (64 MiB each, internal/uiapi/user_hash.go) plus the process.
      memory: 384Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Priority class name (created by priorityClass below). Set "" to use none.
  ##
  priorityClassName: ichor-critical

  ## Pod's affinity
  ##
  affinity: {}

  ## PodDisruptionBudget for ichor-ui (design 2.4). Single-node clusters should disable
  ## this alongside setting replicas: 1 above.
  ##
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## Pod's node selector
  ##
  nodeSelector: {}

  ## Pod's tolerations. The default lets it run on control planes: a cluster whose control planes
  ## are tainted has no worker until one is approved, and ichor-ui is needed before that.
  ##
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  ## Topology spread constraints: placement across nodes by default (design 2.4), same
  ## reasoning as manager.topologySpreadConstraints above (topologySpreadConstraints over
  ## podAntiAffinity so a single-node cluster still schedules both replicas).
  ##
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          control-plane: ui-backend

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## The metrics endpoint's TLS certificate. Not cert-manager: Ichor ships no
## certificate-issuing dependency and no cert-manager Certificate resource
## -- true provisions a real, verifiable certificate via cert-controller's second
## in-process rotator instead, the same mechanism the webhook serving
## certificate already uses unconditionally, via its own always-mounted
## ichor-webhook-server-cert Secret. false (the default) leaves the metrics server
## on controller-runtime's own ephemeral self-signed certificate, and
## prometheus.enabled's ServiceMonitor scrapes it with insecureSkipVerify instead of
## a trusted CA. Off by default not because it's unsafe to turn on, but because
## cert-controller has no Create path (only Update): enabling this makes
## --metrics-cert-path non-empty. The metrics server reads the certificate per TLS
## handshake, so it starts before the rotator has written it and a scrape fails until then,
## with no restart.
##
metricsCert:
  enabled: false

## Webhook server configuration.
##
## On a brand-new install the controller pod stays NotReady, without restarting, until the
## webhook serving certificate exists: cert-controller's rotator (leader only) writes it, and
## the webhook server is not started before the file is mounted (cold-start
## amendment).
##
webhook:
  enabled: true
  # Webhook server port
  port: 9443

## DEPRECATED and ignored. "Reset and add" (MachineReclaim) has no
## installation switch any more: RBAC alone decides who may use it, through the verb reclaim on
## machinereclaims. ichor:admin holds it; the ClusterRole ichor-machine-reclaimer (installed with
## rbac.helpers.enabled) grants it to anyone else you bind it to.
reclaim:
  enabled: false

## Ichor's runtime settings live in the IchorInstallation named ichor (spec.users, spec.defaults) and win over the values here when set. readOnly: true hands them to this
## chart instead: the spec fields are ignored, the webhook denies writes to them, and the Settings tab
## is read-only. Use it when Git or Helm owns the configuration.
settings:
  readOnly: false

## The controller looks for a newer Ichor release in the chart repository on start and every 6 hours, and
## shows the newest one on the dashboard. Each check is one anonymous tag listing and carries
## nothing about the cluster. false stops the requests and removes the controller's egress rule for them.
## spec.updateCheck.enabled in the IchorInstallation overrides this unless settings.readOnly is set.
updateCheck:
  enabled: true

## Automatic patch upgrades. Off by default. When on, the controller starts an upgrade of a
## patch release of the running minor by itself, one component at a time (Talos, then Cilium, then
## Kubernetes), only a release the release check listed and the compatibility table accepts, only while
## the cluster is healthy and nothing else runs on it. It needs updateCheck.enabled. A failed or paused
## automatic operation stops it until a person clears it.
## spec.autoPatch in the IchorInstallation overrides this unless settings.readOnly is set.
autoPatch:
  enabled: false
  ## Any of talos, kubernetes, cilium. Empty means all three.
  components: []
  ## A daily UTC window "HH:MM-HH:MM" an upgrade may start in, for example "02:00-05:00". Empty means any time.
  window: ""

## ValidatingAdmissionPolicy guarding TalosCluster.spec.cni.kubeProxy
## switches. Independent of webhook.enabled above: it is
## enforced by the apiserver itself (stable since Kubernetes 1.30, this
## chart's kubeVersion floor), not the controller-runtime webhook server,
## so it still protects the cluster while the controller is down.
##
admission:
  enabled: true
  ## The repository the controller's Jobs (the installer and the Cilium Helm run) may pull their
  ## image from, when there is no IchorInstallation to say (a chart-only install). With
  ## an IchorInstallation, the image must be its spec.installerRepository@digest instead.
  ## Set it to your mirror if you mirror the installer image; empty turns this rule off.
  jobImageRepository: ghcr.io/maeshinshin/ichor-installer

## Prometheus ServiceMonitors for scraping the controller manager's and (when
## ichorUI.enabled) ichor-ui's /metrics endpoints. Requires prometheus-operator's
## ServiceMonitor CRD to be installed in the cluster. Ichor ships no Prometheus itself
## (docs/design/architecture.md, "Monitoring and registry mirrors").
##
prometheus:
  enabled: false

  ## A PrometheusRule carrying the controller-manager alerts documented in
  ## Deliberately few,
  ## restricted to events worth paging someone over. Independent of enabled above --
  ## the ServiceMonitor and the alerts are each optional on their own -- but requires
  ## the same prometheus-operator CRD (PrometheusRule) to exist in the cluster.
  ##
  rules:
    enabled: false

    ## How many days before a cluster CA expires IchorCertificateExpiring fires. Keep it equal
    ## to the controller's --certificate-expiry-warning-days (default 90; set it in
    ## manager.args), which sets the CertificatesExpiring condition the UI shows.
    certificateExpiryDays: 90

## A ConfigMap carrying one Grafana dashboard for the metrics above, labeled
## "grafana_dashboard: \"1\"" -- the sidecar-discovery convention both
## kube-prometheus-stack's and Bitnami's Grafana charts support out of the box. Ichor
## ships no Grafana (docs/design/architecture.md, "Monitoring and registry mirrors"): this
## ConfigMap does nothing unless the cluster's own Grafana deployment already runs
## that sidecar.
##
grafana:
  dashboards:
    enabled: false

## The PriorityClass both pods run under. Cluster-scoped, value 1000000: above ordinary
## workloads, far below the system-* classes, which a user namespace cannot use. Turn create off to
## bring your own class and set manager.priorityClassName and ichorUI.priorityClassName to it.
##
priorityClass:
  create: true
  name: ichor-critical
  value: 1000000

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

  ## Ichor's CiliumNetworkPolicies: a default deny, ingress and egress, for the
  ## release namespace plus one allow per flow the controller, ichor-ui and the installer Job need, with
  ## entities (kube-apiserver, host, remote-node, world) that a plain NetworkPolicy cannot express.
  ## `enabled` is three-valued: unset (null, the default) renders them when the cluster serves Cilium's
  ## cilium.io/v2 CiliumNetworkPolicy API (and renders nothing under `helm template`, which has no cluster);
  ## true renders them regardless (Cilium's CRD must exist when the chart is applied); false renders none and
  ## tells the installer Job not to apply its copy. UPGRADE NOTICE: a release that had them off now gets them
  ## on when Cilium is present; set false to keep the old behaviour.
  ##
  cilium:
    enabled: null
    ## The controller keeps a second policy, <release>-controller-talos-egress, with exactly the addresses
    ## and names of the TalosClusters, TalosMachines, MachineReclaims and TalosEtcdBackups it manages, for
    ## the controller and ichor-ui. While true the rules here stop allowing `world` to Talos nodes, API
    ## servers and S3. Set false to fall back to `world` (the pre-amendment behaviour).
    dynamicTalosEgress: true
    ## Namespaces whose pods may open the controller's metrics port. Empty (the default): none, the
    ## port is closed to every pod. Name the namespace of your Prometheus. The endpoint stays behind
    ## TokenReview and SubjectAccessReview as well. ichor-ui's /metrics shares its serving port with the UI,
    ## so this does not cover it; `uiIngressCIDRs` narrows who reaches that port from outside the cluster.
    metricsNamespaces: []
    ## Pod labels that, with metricsNamespaces, narrow the scrapers to those pods of each namespace, for
    ## example {app.kubernetes.io/name: prometheus}. Empty: every pod of the named namespaces.
    metricsPodLabels: {}
    ## TCP ports for the fallback rules below: the controller (S3 for TalosEtcdBackup) and ichor-ui (the
    ## external OIDC issuer) outside the cluster. In the default dynamic mode the controller names the S3
    ## stores from the TalosEtcdBackups and the issuer from the ichor-ui Deployment, on the port
    ## of each URL, and these are not used.
    externalPorts:
      - 443
    ## Narrow the `world` egress and ingress. Empty (the default) keeps today's behaviour. Each
    ## list is CIDRs; when set, the rule names them instead of the `world` entity. Only these chart-rendered
    ## policies honour them (the installer's copy in config/cilium-network-policy stays on `world`), so set
    ## networkPolicy.cilium.enabled: true (or leave it unset on Cilium) to use them. In dynamic mode talosCIDRs and
    ## externalCIDRs are fallbacks next to the controller-maintained policy.
    ##   externalCIDRs: where externalPorts may go (the S3 endpoint, the OIDC issuer).
    ##   talosCIDRs: the Talos nodes' addresses for apid (50000) and the API server (6443). Nodes that
    ##     have not joined yet are "world", so include their subnet.
    ##   uiIngressCIDRs: who may reach ichor-ui from outside the cluster (in-cluster callers stay allowed).
    externalCIDRs: []
    talosCIDRs: []
    uiIngressCIDRs: []


## Install-time checks
##
preflight:
  ## Refuse to install on a cluster with no CNI (every node NotReady with the network-plugin
  ## message), where Ichor pods could not start. Run `ichor cni bootstrap` first.
  ## Needs a live cluster: `helm template` and --dry-run skip it.
  ##
  cni: true
