## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  ## Two replicas by default (design 2.4). Single-node clusters should set
  ## this to 1 and turn off manager.podDisruptionBudget.enabled below; the
  ## automatic switch is an installer feature, not phase 1.
  ##
  replicas: 2

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## PodDisruptionBudget for the controller (design 2.4). Single-node
  ## clusters should disable this alongside setting replicas: 1 above.
  ##
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints: placement across nodes by default (design
  ## 2.4). topologySpreadConstraints over podAntiAffinity because
  ## whenUnsatisfiable: ScheduleAnyway degrades to co-located replicas on a
  ## single-node cluster instead of leaving the second one Pending forever.
  ##
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          control-plane: controller-manager

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## Configure the ichor-ui deployment (ADR 0020). It holds a read-only Kubernetes
## identity, separate from the controller's own ServiceAccount (architecture.md "Trust"):
## see config/rbac/ichor-ui/ (ADR 0018) and templates/rbac/ichor-ui-*.yaml.
##
ichorUI:
  ## Set to false to skip ichor-ui installation
  ##
  enabled: true

  ## Two replicas by default, same reasoning as manager.replicas above (design 2.4).
  ## Single-node clusters should set this to 1 and turn off
  ## ichorUI.podDisruptionBudget.enabled below.
  ##
  replicas: 2

  image:
    repository: ichor-ui
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Address ichor-ui listens on (cmd/ichor-ui's own -addr flag default).
  ##
  port: 8080

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Pod's affinity
  ##
  affinity: {}

  ## PodDisruptionBudget for ichor-ui (design 2.4). Single-node clusters should disable
  ## this alongside setting replicas: 1 above.
  ##
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## Pod's node selector
  ##
  nodeSelector: {}

  ## Pod's tolerations
  ##
  tolerations: []

  ## Topology spread constraints: placement across nodes by default (design 2.4), same
  ## reasoning as manager.topologySpreadConstraints above (topologySpreadConstraints over
  ## podAntiAffinity so a single-node cluster still schedules both replicas).
  ##
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          control-plane: ui-backend

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for the metrics endpoint's TLS certificate.
## Default is off (ADR 0006): the webhook serving certificate never uses
## this toggle (it's generated at runtime, in-process, by cert-controller,
## via the always-mounted ichor-webhook-server-cert Secret), so this only
## affects metrics.secure + prometheus.enabled's TLS verification.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: true
  # Webhook server port
  port: 9443

## ValidatingAdmissionPolicy guarding TalosCluster.spec.cni.kubeProxy
## switches (ADR 0013). Independent of webhook.enabled above: it is
## enforced by the apiserver itself (stable since Kubernetes 1.30, this
## chart's kubeVersion floor), not the controller-runtime webhook server,
## so it still protects the cluster while the controller is down.
##
admission:
  enabled: true

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

