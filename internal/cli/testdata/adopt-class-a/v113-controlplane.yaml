    #       # The `value` field is used to provide the seccomp profile.
    #       value:
    #         defaultAction: SCMP_ACT_LOG
# Provides cluster specific configuration options.
cluster:
    id: xQo9SrwQh0UuLptuzUHn43h6sB5pAX3ReXfep1NZsio=
    secret: xv4Rwrl+xgZ3QFXWSSGUPhenlrkGlzbhHXPh6caULOM=
    controlPlane:
        endpoint: https://10.5.0.2:6443 # Endpoint represents the endpoint URL parsed out of the machine config.
    clusterName: d1
    network:
        dnsDomain: cluster.local
        podSubnets:
            - 10.244.0.0/16
        serviceSubnets:
            - 10.96.0.0/12
    token: fd9d3l.am32flga6c8bdiuv # The [bootstrap token](https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/) used to join the cluster.
    secretboxEncryptionSecret: ArVDXhJ+rnyjvR425ZufgLzZZrYvIc6Rr+54JpE/3gA=
    ca:
        crt: 
        key: 
    aggregatorCA:
        crt: 
        key: 
    serviceAccount:
        key: 
    apiServer:
        image: registry.k8s.io/kube-apiserver:v1.36.6
        certSANs:
            - 10.5.0.2
            - cp.example.test
        admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                defaults:
                    audit: restricted
                    audit-version: latest
                    enforce: baseline
                    enforce-version: latest
                    warn: restricted
                    warn-version: latest
                exemptions:
                    namespaces:
                        - kube-system
                    runtimeClasses: []
                    usernames: []
                kind: PodSecurityConfiguration
        auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            rules:
                - level: Metadata
    controllerManager:
        image: registry.k8s.io/kube-controller-manager:v1.36.6
