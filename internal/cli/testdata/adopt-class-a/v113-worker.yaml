version: v1alpha1 # Indicates the schema used to decode the contents.
debug: false # Enable verbose logging to the console.
persist: true
# Provides machine specific configuration options.
machine:
    type: worker # Defines the role of the machine within the cluster.
    token: n89w5n.rvz8riyr18h5c29s # The `token` is used by a machine to join the PKI of the cluster.
    # The root certificate authority of the PKI.
    ca:
        crt: 
        key: ""
    # Extra certificate subject alternative names for the machine's certificate.
    certSANs:
        - 10.5.0.2
        - cp.example.test
    kubelet:
        image: ghcr.io/siderolabs/kubelet:v1.36.6
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
    install:
        disk: /dev/vda
        image: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.14.3
        wipe: false
        grubUseUKICmdline: true
    # Features describe individual Talos features that can be switched on or off.
    features:
        diskQuotaSupport: true # Enable XFS project quota support for EPHEMERAL partition and user disks.
        kubePrism:
            enabled: true
            port: 7445
        hostDNS:
            enabled: true
            forwardKubeDNSToHost: true
    
    # # Configures the logging system.
    # logging:
    #     # Logging destination.
    #     destinations:
    #         - endpoint: tcp://1.2.3.4:12345 # Where to send logs. Supported protocols are "tcp" and "udp".
    #           format: json_lines # Logs format.
    # logging:
    #     # Logging destination.
    #     destinations:
    #         - endpoint: udp://127.0.0.1:12345 # Where to send logs. Supported protocols are "tcp" and "udp".
    #           format: json_lines # Logs format.
    #           # Extra tags (key-value) pairs to attach to every log message sent.
    #           extraTags:
    #             machine: worker-1

    # # Configures the seccomp profiles for the machine.
    # seccompProfiles:
    #     - name: audit.json # The `name` field is used to provide the file name of the seccomp profile.
    #       # The `value` field is used to provide the seccomp profile.
    #       value:
    #         defaultAction: SCMP_ACT_LOG
# Provides cluster specific configuration options.
cluster:
    id: xQo9SrwQh0UuLptuzUHn43h6sB5pAX3ReXfep1NZsio=
    secret: xv4Rwrl+xgZ3QFXWSSGUPhenlrkGlzbhHXPh6caULOM=
    controlPlane:
        endpoint: https://10.5.0.2:6443 # Endpoint represents the endpoint URL parsed out of the machine config.
    clusterName: d1
    network:
        dnsDomain: cluster.local
        podSubnets:
            - 10.244.0.0/16
        serviceSubnets:
            - 10.96.0.0/12
    token: fd9d3l.am32flga6c8bdiuv # The [bootstrap token](https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/) used to join the cluster.
    ca:
        crt: 
        key: ""
    discovery:
        enabled: true
        registries:
            kubernetes:
                disabled: true
            service: {}
    
    # # Etcd specific configuration options.
    # etcd:
    #     image: registry.k8s.io/etcd:v3.7.2 # The container image used to create the etcd service.
    #     # The `ca` is the root certificate authority of the PKI.
    #     ca:
