apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io # Registry name to apply the mirror configuration to.
# List of mirror endpoints for the registry.
endpoints:
    - url: https://mirror.example.test:5000 # The URL of the registry mirror endpoint.
---
