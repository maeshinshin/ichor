---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ichorinstallations.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: IchorInstallation
    listKind: IchorInstallationList
    plural: ichorinstallations
    singular: ichorinstallation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.managementMode
      name: Mode
      type: string
    - jsonPath: .spec.version
      name: Target
      type: string
    - jsonPath: .status.installedVersion
      name: Installed
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IchorInstallation is the Schema for the ichorinstallations API: Ichor's own version and
          management mode, a cluster-scoped singleton.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of IchorInstallation
            properties:
              installerRepository:
                default: ghcr.io/maeshinshin/ichor-installer
                description: |-
                  installerRepository is the image repository of the installer image; the Job runs
                  <installerRepository>:<version>. Point it at a mirror or private registry if you need to.
                minLength: 1
                type: string
              managementMode:
                default: ichor
                description: |-
                  managementMode is deprecated, unused; kept so the CRD never drops a field (docs/adr/0101).
                  Upgrades always run through the installer Job a TalosOperation of kind ichor starts. The
                  value external, which meant Argo CD owned Ichor's manifests, is still accepted and treated
                  as ichor.
                enum:
                - ichor
                - external
                type: string
              stack:
                description: |-
                  stack is deprecated and unused: Argo CD and Kokumi are no longer part of Ichor (ADR 0101).
                  It is kept so the CRD never drops a field.
                properties:
                  argocd:
                    description: argocd is the user layer for the Argo CD bundle.
                    properties:
                      values:
                        description: |-
                          values is the user layer; effective values are Ichor's defaults, then these, then the
                          Ichor-owned keys.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    type: object
                  kokumi:
                    description: |-
                      kokumi is the user layer for the Kokumi bundle. Kokumi has no chart, so its values accept
                      only the keys Ichor maps to patches it controls (memory limits, replica counts).
                    properties:
                      values:
                        description: |-
                          values is the user layer; effective values are Ichor's defaults, then these, then the
                          Ichor-owned keys.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    type: object
                  promotion:
                    default: Automatic
                    description: |-
                      promotion is Kokumi's Order promotion mode for both components: Automatic (default) or
                      Manual, where a human promotes in Kokumi's UI.
                    enum:
                    - Automatic
                    - Manual
                    type: string
                type: object
              version:
                description: |-
                  version is the Ichor version the installation should run, as a semantic version with a
                  leading v (v0.4.0). The installer Job runs the image for this version, which carries
                  that version's own manifests.
                pattern: ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$
                type: string
            required:
            - version
            type: object
          status:
            description: status defines the observed state of IchorInstallation
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the IchorInstallation resource. UpToDate is
                  True when installedVersion equals spec.version. An ExternalSuggested condition
                  from an older build is removed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              installedVersion:
                description: |-
                  installedVersion is the version of the running controller, reported by the controller
                  itself: the single source of "what is installed", which is also what the CLI compares
                  itself against (ADR 0059).
                type: string
              stack:
                description: |-
                  stack is deprecated and unused: nothing writes it any more (ADR 0101). It is kept so the
                  CRD never drops a field.
                properties:
                  argocd:
                    description: argocd is the Argo CD bundle's state.
                    properties:
                      applicationHealth:
                        description: |-
                          applicationHealth is Argo CD's view of the Application Kokumi created: Synced/Healthy,
                          or the reason it is not.
                        type: string
                      digest:
                        description: digest is the published artifact's OCI digest.
                        type: string
                      orderReady:
                        description: orderReady is whether Kokumi's Order for the
                          component is Ready.
                        type: boolean
                      publishedTag:
                        description: publishedTag is the registry tag Ichor last published
                          (<chartVersion>-<hash12>).
                        type: string
                    type: object
                  kokumi:
                    description: kokumi is the Kokumi bundle's state.
                    properties:
                      applicationHealth:
                        description: |-
                          applicationHealth is Argo CD's view of the Application Kokumi created: Synced/Healthy,
                          or the reason it is not.
                        type: string
                      digest:
                        description: digest is the published artifact's OCI digest.
                        type: string
                      orderReady:
                        description: orderReady is whether Kokumi's Order for the
                          component is Ready.
                        type: boolean
                      publishedTag:
                        description: publishedTag is the registry tag Ichor last published
                          (<chartVersion>-<hash12>).
                        type: string
                    type: object
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the singleton must be named ichor
          rule: self.metadata.name == 'ichor'
    served: true
    storage: true
    subresources:
      status: {}
