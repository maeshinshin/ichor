# The TalosConfigPatch CRD as it was while spec.documents was a field, reduced to the properties the test stores:
# clusterRef, layer and a documents entry of two kinds. The real schema was the union of every document kind.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: talosconfigpatches.ichor.maesh.dev
spec:
  group: ichor.maesh.dev
  names:
    kind: TalosConfigPatch
    listKind: TalosConfigPatchList
    plural: talosconfigpatches
    shortNames:
      - tcp
    singular: talosconfigpatch
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clusterRef
                - layer
              properties:
                clusterRef:
                  type: object
                  properties:
                    name:
                      type: string
                layer:
                  type: string
                priority:
                  type: integer
                  format: int32
                documents:
                  type: array
                  items:
                    type: object
                    required:
                      - kind
                    properties:
                      kind:
                        type: string
                      sysctlConfig:
                        type: object
                        properties:
                          params:
                            type: object
                            additionalProperties:
                              type: string
                      config:
                        type: object
                        properties:
                          machine:
                            type: object
                            properties:
                              type:
                                type: string
                              certSANs:
                                type: array
                                items:
                                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
