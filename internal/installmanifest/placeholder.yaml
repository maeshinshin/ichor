# ichor-install-manifest-placeholder: true
#
# This file stands in for Ichor's own install manifest
# (dist/install.yaml, generated by `make build-installer`) in a binary
# built without the "installembed" tag. It is never a real Kubernetes
# manifest and must never be applied to a cluster -- `ichor init` checks
# for the sentinel line above and refuses if it is present.
#
# Build with `make build-ichor-embed` to embed the real manifest instead.
