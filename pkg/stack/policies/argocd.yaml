# CiliumNetworkPolicies for the argocd namespace. Part of the Argo CD
# bundle. The controller applies them after the workloads exist, never before.
#
# Pods (chart 10.11.6 with dex, notifications, ApplicationSet and redis-ha off), all with
# app.kubernetes.io/instance=argocd and the name below:
#   argocd-application-controller   metrics 8082
#   argocd-repo-server              grpc 8081, metrics 8084
#   argocd-server                   http(s) 8080, metrics 8083
#   argocd-redis                    6379
# The chart's own Kubernetes NetworkPolicies are switched off in the values (global.networkPolicy.create):
# Cilium unions them with these, and the chart's argocd-server one allows all ingress.
# Argo CD ships no webhook configuration, so no apiserver ingress is needed.
#
# Users reach argocd-server by port-forward (the Service is ClusterIP):
#   kubectl -n argocd port-forward svc/argocd-server 8080:80
# That arrives from the node (the host entity). Exposing it through an ingress or gateway needs
# a policy of the operator's own (policies add up). Repositories outside the cluster need one too.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: argocd
spec:
  description: Everything in the namespace is denied unless a policy below allows it.
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: argocd
spec:
  description: Every pod resolves names through CoreDNS. The dns rule makes the lookups visible in Hubble.
  endpointSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: argocd
spec:
  description: The application controller and the server call the Kubernetes API; the repo server makes one cluster call.
  endpointSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - argocd-application-controller
      - argocd-server
      - argocd-repo-server
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: application-controller
  namespace: argocd
spec:
  description: The application controller asks the repo server to render, caches in redis and resolves revisions in Kokumi's registry.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  ingress:
  # The kubelet's readiness probe and in-cluster /metrics scrapers.
  - fromEntities:
    - host
    - cluster
    toPorts:
    - ports:
      - port: "8082"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: argocd-repo-server
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: argocd-redis
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kokumi
        app: registry
    toPorts:
    - ports:
      - port: "5000"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: repo-server
  namespace: argocd
spec:
  description: The repo server pulls the Preparations from Kokumi's registry and caches in redis.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: argocd-server
    - matchLabels:
        app.kubernetes.io/name: argocd-application-controller
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  # The kubelet's liveness and readiness probes and in-cluster /metrics scrapers.
  - fromEntities:
    - host
    - cluster
    toPorts:
    - ports:
      - port: "8084"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kokumi
        app: registry
    toPorts:
    - ports:
      - port: "5000"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: argocd-redis
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: server
  namespace: argocd
spec:
  description: The Argo CD API and UI, reached by port-forward from the node, and its backends.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
  # Port-forwards and the kubelet's probes arrive from the node.
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "8083"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: argocd-repo-server
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: argocd-redis
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis
  namespace: argocd
spec:
  description: Redis takes connections from the three components that cache in it and starts none.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-redis
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: argocd-server
    - matchLabels:
        app.kubernetes.io/name: argocd-repo-server
    - matchLabels:
        app.kubernetes.io/name: argocd-application-controller
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
