syntax = "proto3";

// ClusterService backs the cluster list and cluster detail screens: status,
// rollout progress and hand-over state (architecture.md, "CLI and UI").
// The reads change nothing; AddDiscoveryAddress is the one write, and it
// edits only spec.discovery.addresses.
package ichor.v1alpha1;

import "google/protobuf/timestamp.proto";
import "ichor/v1alpha1/common.proto";

service ClusterService {
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse);
  // AddDiscoveryAddress appends one IPv4 address to
  // TalosCluster.spec.discovery.addresses, so the controller
  // probes it for a node in maintenance mode. It goes through the same write
  // gate as the other writes, which writes the CR directly.
  rpc AddDiscoveryAddress(AddDiscoveryAddressRequest) returns (AddDiscoveryAddressResponse);
  // DismissCARotationAdvice sets the annotation ichor.maesh.dev/ca-rotation-advice-dismissed on the
  // TalosCluster, which the controller reads to clear the CARotationAdvised condition. It writes that annotation and nothing else.
  rpc DismissCARotationAdvice(DismissCARotationAdviceRequest) returns (DismissCARotationAdviceResponse);
  // AddDiscoveryCidr appends one IPv4 range (/24 or smaller) to TalosCluster.spec.discovery.cidrs. The controller scans it address by address; the write itself wakes the cluster's
  // reconcile, so the first pass starts now and not at the next 5 minute interval.
  rpc AddDiscoveryCidr(AddDiscoveryCidrRequest) returns (AddDiscoveryCidrResponse);
  // RemoveDiscoveryAddress removes one address from spec.discovery.addresses. Machines already found
  // stay; only the scan target goes.
  rpc RemoveDiscoveryAddress(RemoveDiscoveryAddressRequest) returns (RemoveDiscoveryAddressResponse);
  // RemoveDiscoveryCidr removes one range from spec.discovery.cidrs.
  rpc RemoveDiscoveryCidr(RemoveDiscoveryCidrRequest) returns (RemoveDiscoveryCidrResponse);
}

message AddDiscoveryCidrRequest {
  ObjectRef cluster = 1;
  // cidr is an IPv4 range of /24 or smaller, e.g. "192.168.0.0/24".
  string cidr = 2;
  // Deprecated: no reason is asked for any more. Never read or set; kept so the wire format is unchanged.
  string reason = 3 [deprecated = true];
}

message AddDiscoveryCidrResponse {
  Cluster cluster = 1;
  AuditRecord audit = 2;
}

message RemoveDiscoveryAddressRequest {
  ObjectRef cluster = 1;
  string address = 2;
  // Deprecated: no reason is asked for any more. Never read or set; kept so the wire format is unchanged.
  string reason = 3 [deprecated = true];
}

message RemoveDiscoveryCidrRequest {
  ObjectRef cluster = 1;
  string cidr = 2;
  // Deprecated: no reason is asked for any more. Never read or set; kept so the wire format is unchanged.
  string reason = 3 [deprecated = true];
}

message RemoveDiscoveryAddressResponse {
  Cluster cluster = 1;
  AuditRecord audit = 2;
}

message RemoveDiscoveryCidrResponse {
  Cluster cluster = 1;
  AuditRecord audit = 2;
}

message DismissCARotationAdviceRequest {
  ObjectRef cluster = 1;
}

message DismissCARotationAdviceResponse {
  AuditRecord audit = 1;
}

message AddDiscoveryAddressRequest {
  ObjectRef cluster = 1;
  // address is a single IPv4 address, e.g. "192.168.0.50".
  string address = 2;
  // Deprecated: no reason is asked for any more. Never read or set; kept so the wire format is unchanged.
  string reason = 3 [deprecated = true];
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  Override override = 4 [deprecated = true];
}

message AddDiscoveryAddressResponse {
  // cluster is the cluster as stored (unchanged when a pull request was
  // proposed instead).
  Cluster cluster = 1;
  AuditRecord audit = 2;
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string pull_request_url = 3 [deprecated = true];
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string notice = 4 [deprecated = true];
}

message ListClustersRequest {}

message ListClustersResponse {
  repeated Cluster clusters = 1;
}

message GetClusterRequest {
  ObjectRef cluster = 1;
}

message GetClusterResponse {
  Cluster cluster = 1;
}

// RolloutKind identifies which of the three upgrade kinds a RolloutProgress
// describes (architecture.md, "Upgrades": Talos, Kubernetes, Ichor all share
// the same lock and progress view).
enum RolloutKind {
  ROLLOUT_KIND_UNSPECIFIED = 0;
  ROLLOUT_KIND_TALOS = 1;
  ROLLOUT_KIND_KUBERNETES = 2;
  ROLLOUT_KIND_ICHOR = 3;
}

// RolloutProgress is present only while a rollout is in flight.
message RolloutProgress {
  RolloutKind kind = 1;
  string target_version = 2;
  bool paused = 3;
  int32 nodes_total = 4;
  int32 nodes_done = 5;
  // current_phase is a short human-readable status, e.g. "draining node-3".
  string current_phase = 6;
}

// HandoverPhase tracks a bootstrapped component (CNI, Argo CD, Ichor itself)
// on its way from injected manifest to an Argo CD Application
// (architecture.md, "Hand-over").
enum HandoverPhase {
  HANDOVER_PHASE_UNSPECIFIED = 0;
  HANDOVER_PHASE_PENDING = 1;
  HANDOVER_PHASE_INJECTED = 2;
  HANDOVER_PHASE_ADOPTED = 3;
  HANDOVER_PHASE_HANDED_OVER = 4;
}

message HandoverState {
  // component is the component registry name, e.g. "cni", "argocd", "ichor".
  string component = 1;
  HandoverPhase phase = 2;
  google.protobuf.Timestamp last_transition_time = 3;
}

message Cluster {
  ObjectRef ref = 1;
  string talos_version = 2;
  string kubernetes_version = 3;
  string endpoint = 4;
  int32 control_plane_count = 5;
  bool control_plane_schedulable = 6;
  repeated Condition conditions = 7;
  // rollout is unset when no rollout is in progress.
  RolloutProgress rollout = 8;
  repeated HandoverState handovers = 9;
  // discovery_addresses and discovery_cidrs are spec.discovery:
  // where the controller looks for nodes in maintenance mode. Both empty
  // means discovery is off.
  repeated string discovery_addresses = 10;
  repeated string discovery_cidrs = 11;
  // kube_proxy_mode is spec.cni.kubeProxy: "enabled" (the default) or "replaced".
  string kube_proxy_mode = 12;
  // certificates are status.certificates: when each CA expires.
  repeated CertificateExpiry certificates = 13;
  // already_configured_addresses are the endpoints discovery reached that already run a Talos
  // configuration: the controller recorded an AlreadyConfigured Event for each and did not
  // add the node. Set by GetCluster and AddDiscoveryAddress from those Events (which Kubernetes expires
  // after about an hour); empty in ListClusters.
  repeated string already_configured_addresses = 14;
  // cni_preset is spec.cni.preset ("cilium", or "unmanaged" for a cluster whose CNI Ichor leaves
  // alone).
  string cni_preset = 15;
  // cni_detected is status.cni.detected: cilium, flannel, calico, other or none; empty until observed.
  string cni_detected = 16;
  // cni_detected_version is status.cni.detectedVersion, the detected CNI's image tag where known.
  string cni_detected_version = 17;
  // versions compares what the cluster runs with the release set of this Ichor: one
  // entry per talos, version-contract, kubernetes and cilium.
  repeated ComponentVersion versions = 18;
  // release_set is the versions this Ichor build supports; the cluster is brought to it.
  ReleaseSet release_set = 19;
  // created_at is the object's creation time; unset when talking to an older backend.
  google.protobuf.Timestamp created_at = 20;
  // endpoint_type is spec.endpoint.type: vip, loadBalancer or node.
  string endpoint_type = 21;
  // pod_subnets and service_subnets are spec.network; empty keeps Talos's defaults.
  repeated string pod_subnets = 22;
  repeated string service_subnets = 23;
  // cni_tunnel is spec.cni.tunnel (vxlan or geneve); empty means Cilium's default.
  string cni_tunnel = 24;
  // orphan_addresses are the endpoints discovery reached that run a Talos configuration and sit at the
  // address of a Kubernetes Node no TalosMachine accounts for: probably a node of
  // this cluster removed without a wipe. Like already_configured_addresses, derived from the latest
  // Event per address and left out when a pending or approved TalosMachine of the cluster now has the
  // address; set by GetCluster and AddDiscoveryAddress.
  repeated string orphan_addresses = 25;
}

// ReleaseSet is one supported combination of versions, embedded in the Ichor build.
message ReleaseSet {
  string talos_version = 1;
  string version_contract = 2;
  string kubernetes_version = 3;
  string cilium_chart_version = 4;
}

// ComponentVersion compares one component of a cluster with the release set.
message ComponentVersion {
  // name is talos, version-contract, kubernetes or cilium.
  string name = 1;
  // current is what the cluster runs: the spec for Talos, the contract, and Kubernetes, the
  // installed Cilium chart where it is observed (empty otherwise).
  string current = 2;
  // target is the release set's version for this component.
  string target = 3;
  // state is up-to-date, behind, ahead or unknown.
  string state = 4;
}

// CertificateExpiry is one CA of the cluster and its last instant of validity.
message CertificateExpiry {
  // name is talos, kubernetes, kubernetes-aggregator or etcd.
  string name = 1;
  google.protobuf.Timestamp not_after = 2;
}
