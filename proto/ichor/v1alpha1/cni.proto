syntax = "proto3";

// CniService backs the Cilium settings screen and `ichor get|edit|apply|diff cni-values` and `ichor upgrade cni`
// (4 and 11). Cilium's Helm values live on the
// TalosCluster as spec.cni.cilium.values (the user layer). Ichor merges them
// over its own defaults and applies its own keys last. The only write here is
// that spec field (and, later, a cni TalosOperation); the controller applies
// it. Values travel as YAML text so the screen and the CLI edit one format.
package ichor.v1alpha1;

import "ichor/v1alpha1/common.proto";

service CniService {
  // GetCiliumValues returns the three layers of Cilium's values separately:
  // Ichor's defaults, the user layer, and the Ichor-owned keys, plus the
  // effective values they produce.
  rpc GetCiliumValues(GetCiliumValuesRequest) returns (GetCiliumValuesResponse);

  // ValidateCiliumValues checks a proposed user layer without writing it and
  // returns every problem it finds, not the first.
  rpc ValidateCiliumValues(ValidateCiliumValuesRequest) returns (ValidateCiliumValuesResponse);

  // DiffCiliumValues compares the effective values now with the effective
  // values a proposed user layer would give, as a unified diff of YAML text.
  rpc DiffCiliumValues(DiffCiliumValuesRequest) returns (DiffCiliumValuesResponse);

  // SetCiliumValues replaces spec.cni.cilium.values after validating it. A
  // dry-run write goes first.
  rpc SetCiliumValues(SetCiliumValuesRequest) returns (SetCiliumValuesResponse);

  // StartCniUpgrade checks that a newer Cilium chart is available and that the
  // user layer still validates, then creates a cni TalosOperation with
  // spec.cni {action: upgrade, chartVersion}. Checks that fail answer
  // FAILED_PRECONDITION with every problem.
  rpc StartCniUpgrade(StartCniUpgradeRequest) returns (StartCniUpgradeResponse);
}

// OwnedKey is a Cilium value Ichor sets itself; a user value for it is an error.
message OwnedKey {
  // path is the dotted key, for example "ipam.mode".
  string path = 1;
  // reason says why Ichor owns it.
  string reason = 2;
  // value_yaml is the value Ichor sets, as YAML.
  string value_yaml = 3;
}

message GetCiliumValuesRequest {
  ObjectRef cluster = 1;
}

message GetCiliumValuesResponse {
  // defaults_yaml is Ichor's defaults (the overridable layer).
  string defaults_yaml = 1;
  // user_yaml is the user layer, spec.cni.cilium.values; empty when unset.
  string user_yaml = 2;
  // owned are the keys Ichor applies last and users cannot set.
  repeated OwnedKey owned = 3;
  // effective_yaml is what Cilium is rendered with.
  string effective_yaml = 4;
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string tracked_by = 5 [deprecated = true];
  // available_chart_version is status.cni.availableChartVersion; empty when
  // Cilium is up to date.
  string available_chart_version = 6;
  // can_edit is whether the caller may change the user layer: the verb update on
  // talosclusters/cilium-values, which ichor-admin holds.
  bool can_edit = 7;
}

message ValidateCiliumValuesRequest {
  ObjectRef cluster = 1;
  // user_yaml is the proposed user layer.
  string user_yaml = 2;
}

message ValidateCiliumValuesResponse {
  bool valid = 1;
  // errors lists every problem found; empty when valid.
  repeated string errors = 2;
}

message DiffCiliumValuesRequest {
  ObjectRef cluster = 1;
  // user_yaml is the proposed user layer.
  string user_yaml = 2;
}

message DiffCiliumValuesResponse {
  // diff is a unified diff of the effective values, current to proposed; empty
  // when they are equal.
  string diff = 1;
}

message SetCiliumValuesRequest {
  ObjectRef cluster = 1;
  // user_yaml is the new user layer; empty clears it.
  string user_yaml = 2;
}

message SetCiliumValuesResponse {
  AuditRecord audit = 1;
  // effective_yaml is the effective values after the write.
  string effective_yaml = 2;
}

message StartCniUpgradeRequest {
  ObjectRef cluster = 1;
  // version is deprecated and unused: it named a Cilium patch to run on the embedded chart. Cilium moves only to the chart this Ichor embeds (amendment 2026-11-04 (3)), so
  // the server refuses a request that sets it. Kept so the wire format does not break.
  string version = 2;
  // override is deprecated and unused: it lifted the compatibility refusal of a patch. The server ignores it.
  Override override = 3;
}

message StartCniUpgradeResponse {
  // operation is the cni TalosOperation that was created.
  ObjectRef operation = 1;
  string from_version = 2;
  string to_version = 3;
  AuditRecord audit = 4;
}
