syntax = "proto3";

// Types shared by every ichor.v1alpha1 service: references to the Kubernetes
// custom resources the backend is a read-only or approval-only view onto, a
// kstatus-compatible condition, and the audit record every approve/reject
// call returns.
package ichor.v1alpha1;

import "google/protobuf/timestamp.proto";

// ObjectRef names a namespaced Kubernetes custom resource (TalosCluster,
// TalosMachine, ...). The browser never sees more of the Kubernetes object
// than this service exposes; it never talks to the API server directly.
message ObjectRef {
  string namespace = 1;
  string name = 2;
}

// Condition mirrors the kstatus-compatible conditions carried on Ichor's
// custom resources (metav1.Condition), trimmed to what a screen displays.
message Condition {
  string type = 1;
  string status = 2;
  string reason = 3;
  string message = 4;
  google.protobuf.Timestamp last_transition_time = 5;
}

// Override asks for an emergency direct write (docs/adr/0065). Setting it
// on a request means "if this change would be a pull request or is refused
// because Argo CD tracks the resource, write it now and open the matching pull
// request". The backend allows it only to a signed-in user whose Kubernetes RBAC
// grants the override verb on the resource, and refuses it otherwise.
message Override {
  // reason is required: it is recorded in the audit record, the Kubernetes
  // Event and the pull request description.
  string reason = 1;
}

// AuditRecord is returned by ApproveMachine and RejectMachine so the caller
// can confirm what was recorded: who did it, when, against what, and why.
// "actor" comes from the caller's authenticated identity, not from the
// request body.
message AuditRecord {
  string actor = 1;
  google.protobuf.Timestamp at = 2;
  // action is "approve" or "reject" (and "update" or "delete" for patches).
  // When the change was proposed as a pull request instead of written, it
  // carries a "-pr" suffix ("approve-pr"): the request is recorded, the
  // change is not applied until the pull request merges.
  string action = 3;
  ObjectRef target = 4;
  // reason is optional free text, mainly used for rejections.
  string reason = 5;
}
