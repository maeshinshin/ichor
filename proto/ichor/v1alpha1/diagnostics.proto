syntax = "proto3";

// DiagnosticsService serves three admin-only, read-only downloads from a node's
// Talos API (docs/adr/0084): a support bundle, an etcd snapshot and a packet
// capture. Each is a server stream of byte chunks the caller writes to a file;
// nothing is stored in a custom resource or a Secret. Every file can hold
// secrets, so each call is checked against a Kubernetes RBAC verb of the
// caller's own and leaves an Event on the TalosMachine.
package ichor.v1alpha1;

import "ichor/v1alpha1/common.proto";

service DiagnosticsService {
  // GetMyPermissions says which downloads the caller may start (the machine's
  // three, the cluster's CA rotation credentials, docs/adr/0093), so the UI can
  // hide the others. The server checks again on each download.
  rpc GetMyPermissions(GetMyPermissionsRequest) returns (GetMyPermissionsResponse);
  // DownloadSupportBundle streams a zip of one node's (or every node of a
  // cluster's) logs, kernel log, processes, mounts and non-sensitive Talos
  // resources.
  rpc DownloadSupportBundle(DownloadSupportBundleRequest) returns (stream DownloadSupportBundleResponse);
  // DownloadEtcdSnapshot streams an etcd snapshot taken from one control plane
  // node. It contains every Kubernetes Secret.
  rpc DownloadEtcdSnapshot(DownloadEtcdSnapshotRequest) returns (stream DownloadEtcdSnapshotResponse);
  // CapturePackets streams a pcap file captured on one node's interface, bounded
  // by duration and size.
  rpc CapturePackets(CapturePacketsRequest) returns (stream CapturePacketsResponse);
  // DownloadReaderTalosconfig streams a talosconfig whose client certificate is
  // Talos os:reader, for talosctl (docs/adr/0124). It lives one hour by default
  // and twelve at most. The key is made here; the controller signs it as the
  // caller, whose Kubernetes RBAC verb `download` on talosclusters/talosconfig-reader
  // the admission webhook checks and records as an Event.
  rpc DownloadReaderTalosconfig(DownloadReaderTalosconfigRequest) returns (stream DownloadReaderTalosconfigResponse);
}

message GetMyPermissionsRequest {
  // machine is optional; without it the three machine flags are false.
  ObjectRef machine = 1;
  // cluster is optional; without it cluster_credentials is false.
  ObjectRef cluster = 2;
}

message GetMyPermissionsResponse {
  bool support_bundle = 1;
  bool etcd_snapshot = 2;
  bool packet_capture = 3;
  // cluster_credentials is the "download" verb on talosclusters/credentials.
  bool cluster_credentials = 4;
  // cluster_update is the "update" verb on talosclusters/<name>, which is what
  // changing the Cilium values (CniService.SetCiliumValues) needs.
  bool cluster_update = 5;
  // talosconfig_reader is the "download" verb on talosclusters/talosconfig-reader.
  bool talosconfig_reader = 6;
}

message DownloadReaderTalosconfigRequest {
  ObjectRef cluster = 1;
  // lifetime_seconds is how long the certificate is valid. 0 means one hour; more than twelve hours is refused.
  int64 lifetime_seconds = 2;
}

message DownloadReaderTalosconfigResponse {
  // filename and content_type are set on the first chunk only.
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message DownloadSupportBundleRequest {
  // Exactly one of machine and cluster. A cluster means every approved machine in it.
  oneof target {
    ObjectRef machine = 1;
    ObjectRef cluster = 2;
  }
}

message DownloadEtcdSnapshotRequest {
  // machine must be a control plane node.
  ObjectRef machine = 1;
}

message CapturePacketsRequest {
  ObjectRef machine = 1;
  // interface is the node's link name, such as eth0.
  string interface = 2;
  // bpf_filter is optional, in `tcpdump -dd` format (one `{ code, jt, jf, k },`
  // line per instruction), the form Talos itself takes. It is validated before
  // the capture starts.
  string bpf_filter = 3;
  // duration_seconds defaults to 30 and may not exceed 300.
  int32 duration_seconds = 4;
  // max_bytes defaults to and may not exceed 100 MiB; the capture stops there.
  int64 max_bytes = 5;
}

// Each streaming RPC has its own response message (buf STANDARD requires a
// unique response type per RPC). They carry the same fields.

message DownloadSupportBundleResponse {
  // filename and content_type are set on the first chunk only.
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message DownloadEtcdSnapshotResponse {
  // filename and content_type are set on the first chunk only.
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message CapturePacketsResponse {
  // filename and content_type are set on the first chunk only.
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}
