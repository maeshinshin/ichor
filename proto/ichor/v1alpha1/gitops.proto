syntax = "proto3";

// GitOpsService backs the GitOps screen: each CR's Argo CD Application and its
// sync and health state, the pull requests Ichor opened that are still open,
// and the registered links into external tools (architecture.md, "CLI and
// UI"; docs/adr/0061). Read-only: nothing here writes a CR, a pull request or
// an Application.
package ichor.v1alpha1;

import "google/protobuf/timestamp.proto";
import "ichor/v1alpha1/common.proto";

service GitOpsService {
  // ListGitOps names the tracking Application of every TalosCluster,
  // TalosMachine and TalosConfigPatch the caller can list, with its sync and
  // health state. It reads only the cluster; it never calls a Git host.
  rpc ListGitOps(ListGitOpsRequest) returns (ListGitOpsResponse);

  // FindPullRequests asks the Git host which pull requests Ichor opened for
  // one CR are still open. It is called on demand (a button), not on page
  // load, and answers from a short server-side cache.
  rpc FindPullRequests(FindPullRequestsRequest) returns (FindPullRequestsResponse);

  // GetLinks returns the external tool URLs registered in the chart's values.
  // A tool with no registered URL comes back empty, and the screen shows no
  // link for it.
  rpc GetLinks(GetLinksRequest) returns (GetLinksResponse);
}

enum GitOpsKind {
  GIT_OPS_KIND_UNSPECIFIED = 0;
  GIT_OPS_KIND_CLUSTER = 1;
  GIT_OPS_KIND_MACHINE = 2;
  GIT_OPS_KIND_PATCH = 3;
}

message ListGitOpsRequest {}

message ListGitOpsResponse {
  repeated GitOpsItem items = 1;
}

// GitOpsItem is one CR and who keeps it in sync. tracked_by is "Argo CD",
// "Flux" or empty (not tracked: Ichor writes it directly).
message GitOpsItem {
  GitOpsKind kind = 1;
  ObjectRef ref = 2;
  // cluster is the TalosCluster this CR belongs to (its own name for a
  // TalosCluster).
  string cluster = 3;
  string tracked_by = 4;
  // application is set only when tracked_by is "Argo CD" and the Application
  // could be named.
  ObjectRef application = 5;
  // sync_status is the Application's status.sync.status ("Synced",
  // "OutOfSync", "Unknown"); health_status is status.health.status
  // ("Healthy", "Progressing", "Degraded", "Suspended", "Missing",
  // "Unknown"). Both are empty when the Application could not be read.
  string sync_status = 6;
  string health_status = 7;
  // error says why the state is missing (the Application cannot be named or
  // read). It never carries a credential.
  string error = 8;
}

message FindPullRequestsRequest {
  GitOpsKind kind = 1;
  ObjectRef ref = 2;
}

message PullRequest {
  // action is the change the pull request proposes: "approve", "reject",
  // "update" or "delete".
  string action = 1;
  string url = 2;
}

message FindPullRequestsResponse {
  repeated PullRequest pull_requests = 1;
  // note explains an empty answer that is not "none are open" (the CR is
  // written directly, or no repository is connected).
  string note = 2;
  // checked_at is when the Git host was asked; with a cached answer it is
  // earlier than now.
  google.protobuf.Timestamp checked_at = 3;
}

message GetLinksRequest {}

message GetLinksResponse {
  // Each is a base URL, http(s) only, or empty when not registered.
  string argocd = 1;
  string grafana = 2;
  string hubble = 3;
  string longhorn = 4;
}
