syntax = "proto3";

// MachineService backs the machine list (including pending approvals) and
// the approve/reject actions (architecture.md, "CLI and UI" and "Nodes").
// Approval here sets only the fields TalosMachine.spec already models today
// (role, nodeLabels, hostname); disk roles and network link configuration
// join this request message, additively, once they land on the CRD.
package ichor.v1alpha1;

import "google/protobuf/timestamp.proto";
import "ichor/v1alpha1/common.proto";

service MachineService {
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc GetMachine(GetMachineRequest) returns (GetMachineResponse);
  rpc ApproveMachine(ApproveMachineRequest) returns (ApproveMachineResponse);
  rpc RejectMachine(RejectMachineRequest) returns (RejectMachineResponse);
  // RemoveMachine deletes an approved machine through the removal flow: drain, etcd
  // member removal for a control plane, then the TalosMachine goes. The
  // node is not wiped; reset is a node action.
  rpc RemoveMachine(RemoveMachineRequest) returns (RemoveMachineResponse);
  // SetMachineInstall writes only TalosMachine.spec.install of an approved
  // machine that has not converged yet: how a machine approved
  // without an install disk (Ready reason InstallDiskUnknown) gets one.
  rpc SetMachineInstall(SetMachineInstallRequest) returns (SetMachineInstallResponse);
}

message ListMachinesRequest {
  // cluster filters to one TalosCluster's machines; unset lists across all
  // clusters the caller can see, pending machines included.
  ObjectRef cluster = 1;
}

message ListMachinesResponse {
  repeated Machine machines = 1;
}

message GetMachineRequest {
  ObjectRef machine = 1;
}

message GetMachineResponse {
  Machine machine = 1;
}

message ApproveMachineRequest {
  ObjectRef machine = 1;
  MachineRole role = 2;
  map<string, string> node_labels = 3;
  string hostname = 4;
  // Deprecated: no reason is asked for any more. Never read or set; kept so the wire format is unchanged.
  string reason = 5 [deprecated = true];
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  Override override = 6 [deprecated = true];
  // install is the system disk (TalosMachine.spec.install). Unset
  // approves without an install target.
  MachineInstall install = 7;
  // network is the primary link and its addressing (TalosMachine.spec.network). Unset leaves networking to Talos's default.
  MachineNetwork network = 8;
  // disks are the roles of the non-system disks (TalosMachine.spec.disks).
  repeated MachineDiskRole disks = 9;
}

// MachineNetwork mirrors TalosMachine.spec.network.
message MachineNetwork {
  // mac is the link's permanent MAC address.
  string mac = 1;
  // addressing is "dhcp" or "static"; empty means dhcp.
  string addressing = 2;
  // addresses are static addresses with a prefix length (192.168.1.10/24).
  repeated string addresses = 3;
  string gateway = 4;
  repeated string dns_servers = 5;
  // vlan_id is 0 for no VLAN, otherwise 1..4094.
  int32 vlan_id = 6;
}

// MachineDiskRole mirrors one TalosMachine.spec.disks entry.
message MachineDiskRole {
  // role is "ephemeral" or "userVolume".
  string role = 1;
  MachineDisk disk = 2;
  // name is the user volume's name; empty for ephemeral.
  string name = 3;
  // max_size caps a user volume, like "200GiB"; empty means the whole disk.
  string max_size = 4;
}

// MachineDisk selects a disk by exactly one stable identifier
// (TalosMachine.spec.install.disk): the fallback chain WWID, serial, by-id
// path, bus path, then the unstable dev_path.
message MachineDisk {
  string wwid = 1;
  string serial = 2;
  string by_id_path = 3;
  string bus_path = 4;
  string dev_path = 5;
}

// MachineInstall mirrors TalosMachine.spec.install.
message MachineInstall {
  MachineDisk disk = 1;
  // image is the installer image; empty uses the booted schematic's.
  string image = 2;
}

message ApproveMachineResponse {
  // machine is the machine as stored. When pull_request_url is set nothing
  // was written to the cluster and it is still pending until the pull
  // request merges and syncs.
  Machine machine = 1;
  AuditRecord audit = 2;
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string pull_request_url = 3 [deprecated = true];
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string notice = 4 [deprecated = true];
  // warnings are the admission warnings the approval raised but did not refuse: an install
  // disk, disk role or NIC that discovery did not record on the node. Empty when every pick was seen.
  repeated string warnings = 5;
}

message RejectMachineRequest {
  ObjectRef machine = 1;
  // Deprecated: no reason is asked for any more. Never read or set; kept so the wire format is unchanged.
  string reason = 2 [deprecated = true];
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  Override override = 3 [deprecated = true];
}

message SetMachineInstallRequest {
  ObjectRef machine = 1;
  // install is required: the system disk and optionally the installer image.
  MachineInstall install = 2;
  // Deprecated: no reason is asked for any more. Never read or set; kept so the wire format is unchanged.
  string reason = 3 [deprecated = true];
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  Override override = 4 [deprecated = true];
}

message SetMachineInstallResponse {
  // machine is the machine as stored (unchanged when a pull request was
  // proposed instead).
  Machine machine = 1;
  AuditRecord audit = 2;
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string pull_request_url = 3 [deprecated = true];
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string notice = 4 [deprecated = true];
}

message RejectMachineResponse {
  AuditRecord audit = 1;
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string pull_request_url = 2 [deprecated = true];
  // Deprecated: GitOps is no longer part of Ichor. Never set; kept so the wire format is unchanged.
  string notice = 3 [deprecated = true];
}

enum MachineRole {
  MACHINE_ROLE_UNSPECIFIED = 0;
  MACHINE_ROLE_CONTROL_PLANE = 1;
  MACHINE_ROLE_WORKER = 2;
}

// MachineApprovalState mirrors TalosMachine.spec.approvalState:
// the human decision on a machine, a tri-state a single bool cannot carry.
// PENDING is default (discovered, awaiting a decision); APPROVED lets the
// controller render and apply configuration; REJECTED means an operator
// explicitly turned the machine away. REJECTED is distinct from PENDING so
// a rejected machine does not keep showing up as a fresh approval request
// in ListMachines. Re-approving a REJECTED machine is allowed and reverses
// it -- ApproveMachine only refuses a machine that is already APPROVED.
enum MachineApprovalState {
  MACHINE_APPROVAL_STATE_UNSPECIFIED = 0;
  MACHINE_APPROVAL_STATE_PENDING = 1;
  MACHINE_APPROVAL_STATE_APPROVED = 2;
  MACHINE_APPROVAL_STATE_REJECTED = 3;
}

// MachineIdentity mirrors TalosMachine.spec.identity: the tuple Ichor keys a
// node on, since the SMBIOS UUID alone is not trustworthy
// (architecture.md, "Nodes").
message MachineIdentity {
  string uuid = 1;
  string serial = 2;
  repeated string mac_addresses = 3;
}

// MachineApprovalDecision records who decided approval_state and when
// -- kept beside approval_state rather than folded into it, so
// approval_state alone stays the single source of truth for status; this
// message asserts no approved/rejected state of its own. actor is the
// backend's own fixed identity until OIDC login lands; unset
// (nil) on a machine nobody has approved or rejected yet.
message MachineApprovalDecision {
  string actor = 1;
  // Deprecated: no reason is asked for any more. No longer sent; kept so the wire format is unchanged.
  string reason = 2 [deprecated = true];
  google.protobuf.Timestamp at = 3;
}

message Machine {
  ObjectRef ref = 1;
  ObjectRef cluster = 2;
  MachineIdentity identity = 3;
  string endpoint = 4;
  // role is unset for a pending machine still awaiting approval.
  MachineRole role = 5;
  map<string, string> node_labels = 6;
  string hostname = 7;
  reserved 8;
  reserved "approved";
  repeated Condition conditions = 9;
  // stage is Talos's own MachineStatus stage as reported text (e.g.
  // "maintenance", "installing", "rebooting", "running"), shown as-is rather
  // than re-encoded into a parallel enum.
  string stage = 10;
  // approval_state replaces the removed bool "approved" (field 8): a bool
  // cannot represent "rejected" without a second field claiming the same
  // truth, which this design specifically avoids.
  MachineApprovalState approval_state = 11;
  // approval_decision is unset until the first approve/reject decision.
  MachineApprovalDecision approval_decision = 12;
  // install is unset until an install target is declared.
  MachineInstall install = 13;
  // deleting is true while the machine is being removed (its deletion timestamp is set).
  bool deleting = 14;
  // reboot_paths are the configuration fields whose pending change needs a
  // reboot to take effect (TalosMachine.status.rebootPaths).
  repeated string reboot_paths = 15;
  // network and disks mirror spec.network and spec.disks.
  MachineNetwork network = 16;
  repeated MachineDiskRole disks = 17;
  // node_name is the Kubernetes node name the node reports (TalosMachine.status.nodeName);
  // empty until the controller has read the node. Views name a machine hostname, else node_name.
  string node_name = 18;
  // discovered_disks are the installable disks the node reported in maintenance mode when it was
  // discovered (TalosMachine.status.discoveredDisks); approval picks the install disk and
  // disk roles from them. Empty until a probe has recorded some.
  repeated DiscoveredDisk discovered_disks = 19;
  // discovered_links are the physical NICs with a permanent MAC the node reported in maintenance mode
  // (TalosMachine.status.discoveredLinks); approval picks the primary NIC from them.
  repeated DiscoveredLink discovered_links = 20;
  // created_at is the object's creation time; unset when talking to an older backend.
  google.protobuf.Timestamp created_at = 21;
}

// DiscoveredDisk is one installable disk as discovery recorded it. The identifiers are
// the ones a MachineDisk selector names.
message DiscoveredDisk {
  string wwid = 1;
  string serial = 2;
  string by_id_path = 3;
  string bus_path = 4;
  string dev_path = 5;
  int64 size_bytes = 6;
  string model = 7;
  string transport = 8;
}

// DiscoveredLink is one physical NIC with a permanent MAC as discovery recorded it.
message DiscoveredLink {
  string name = 1;
  string permanent_mac = 2;
  bool link_up = 3;
  int32 speed_mbit = 4;
  string driver = 5;
}

message RemoveMachineRequest {
  ObjectRef machine = 1;
  // confirm must equal the machine's name.
  string confirm = 2;
  // reboot makes the node reboot into maintenance mode after it is wiped, so it can be added again.
  // Unset, it powers off.
  bool reboot = 3;
  // override is required: a remove wipes the node's STATE and EPHEMERAL partitions. The caller must
  // hold the override verb on the machine; no reason is asked for.
  Override override = 4;
  // wipe_mode is what the remove wipes: empty is the STATE and EPHEMERAL partitions only, system-disk is
  // the whole system disk (boot and EFI included, so the node boots a boot image again; what a SecureBoot
  // reinstall needs), all wipes that same system disk and never a user disk. Same values as TalosOperation.spec.node.wipeMode.
  string wipe_mode = 5;
}

message RemoveMachineResponse {
  AuditRecord audit = 1;
}
