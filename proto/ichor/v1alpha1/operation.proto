syntax = "proto3";

// OperationService backs the operations screens and the `ichor upgrade`,
// `ichor cluster shutdown`, `ichor cni` and `ichor operation` commands:
// every disruptive, machine-by-machine action Ichor performs is a
// TalosOperation CR (ADR 0026), and this service is how the UI and CLI list,
// plan, start, pause and delete one (docs/adr/0068). Reads and writes are made
// as the signed-in user (ADR 0058), so Kubernetes RBAC decides who may start
// a rollout.
package ichor.v1alpha1;

import "google/protobuf/timestamp.proto";
import "ichor/v1alpha1/common.proto";

service OperationService {
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  // PlanOperation says which machines a CreateOperation would touch, in which
  // order and with what effect, without writing anything. Both the CLI's and
  // the UI's confirmation text come from it.
  rpc PlanOperation(PlanOperationRequest) returns (PlanOperationResponse);
  rpc CreateOperation(CreateOperationRequest) returns (CreateOperationResponse);
  rpc SetOperationPaused(SetOperationPausedRequest) returns (SetOperationPausedResponse);
  rpc DeleteOperation(DeleteOperationRequest) returns (DeleteOperationResponse);
  // DownloadCARotationCredentials streams one zip holding a kubeconfig and a talosconfig that trust
  // the old and the new CAs and are signed by the new ones (ADR 0093). They are cluster-admin
  // private keys: the call is admin-gated and leaves a Warning Event on the TalosCluster.
  rpc DownloadCARotationCredentials(DownloadCARotationCredentialsRequest) returns (stream DownloadCARotationCredentialsResponse);
  // AcknowledgeCARotationCredentials tells a ca-rotation waiting in AwaitingCredentials that the
  // operator has credentials that work, after checking that a kubeconfig made the same way
  // authenticates to the cluster (ADR 0093). It sets the hand-off annotation, nothing else.
  rpc AcknowledgeCARotationCredentials(AcknowledgeCARotationCredentialsRequest) returns (AcknowledgeCARotationCredentialsResponse);
  // ListEtcdBackups lists the TalosEtcdBackups of a cluster with the snapshots each holds, newest
  // first: what a restore can choose from (ADR 0089). It reads the backups' status; it does not
  // touch the storage.
  rpc ListEtcdBackups(ListEtcdBackupsRequest) returns (ListEtcdBackupsResponse);
  // RequestEtcdBackup asks for one snapshot outside the schedule. It only sets the backup-now
  // annotation on the TalosEtcdBackup as the caller (ADR 0047); the controller takes the snapshot.
  // It is refused for a suspended backup.
  rpc RequestEtcdBackup(RequestEtcdBackupRequest) returns (RequestEtcdBackupResponse);
  // GetIchorInstallation reports which Ichor version is installed and whether the cluster
  // already knows a newer one (ADR 0059); it is what the app shell's version label shows.
  // It answers with an empty installed_version, not an error, when there is no
  // IchorInstallation, so the UI can simply show nothing.
  rpc GetIchorInstallation(GetIchorInstallationRequest) returns (GetIchorInstallationResponse);

  // --- operation detail page ---
  // ListOperationEvents returns the Kubernetes Events about an operation or one of its machines,
  // within the operation's lifetime, oldest first: the activity log on the operation's page.
  rpc ListOperationEvents(ListOperationEventsRequest) returns (ListOperationEventsResponse);
}

message GetIchorInstallationRequest {}

message GetIchorInstallationResponse {
  // installed_version is IchorInstallation.status.installedVersion: the version the controller runs.
  string installed_version = 1;
  // target_version is IchorInstallation.spec.version.
  string target_version = 2;
  // Deprecated: GitOps is no longer part of Ichor (docs/adr/0101). Never set; kept so the wire format is unchanged.
  string management_mode = 3 [deprecated = true];
  // upgrading is true while an ichor operation has not finished.
  bool upgrading = 4;
  // update_available is true when target_version is newer than installed_version and no upgrade
  // is running: the cluster knows a newer version and has not moved to it yet.
  bool update_available = 5;
}

message ListEtcdBackupsRequest {
  ObjectRef cluster = 1;
}

message EtcdSnapshot {
  // name is the object name; it is what EtcdRestoreRequest.snapshot says.
  string name = 1;
  google.protobuf.Timestamp time = 2;
  // size is the stored (encrypted) size in bytes.
  int64 size = 3;
}

message EtcdBackup {
  ObjectRef ref = 1;
  // schedule is the cron expression the backup runs on.
  string schedule = 2;
  // snapshots are the snapshots kept in the destination after the last backup, newest first.
  repeated EtcdSnapshot snapshots = 3;
  // ready is false while the last attempt failed or the newest snapshot is stale.
  bool ready = 4;
  // destination is where snapshots go. Never the credentials.
  EtcdBackupDestination destination = 5;
  // keep_last is how many snapshots are kept.
  int32 keep_last = 6;
  // last_success_time is when the newest successful attempt finished; unset before the first.
  google.protobuf.Timestamp last_success_time = 7;
  // last_error is the Ready condition's message while the last attempt failed; empty otherwise.
  string last_error = 8;
  // suspended is spec.suspend: no snapshot is taken, on demand included.
  bool suspended = 9;
  // last_manual_backup is the time of the newest on-demand request the controller acted on.
  google.protobuf.Timestamp last_manual_backup = 10;
  // manual_backup_pending is true while an on-demand request has not been acted on yet.
  bool manual_backup_pending = 11;
}

// EtcdBackupDestination is the S3 location of a backup, without the credentials Secret's content.
message EtcdBackupDestination {
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  string prefix = 4;
}

message RequestEtcdBackupRequest {
  ObjectRef backup = 1;
}

message RequestEtcdBackupResponse {
  EtcdBackup backup = 1;
  AuditRecord audit = 2;
}

message ListEtcdBackupsResponse {
  repeated EtcdBackup backups = 1;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_TALOS = 1;
  OPERATION_KIND_KUBERNETES = 2;
  OPERATION_KIND_ICHOR = 3;
  OPERATION_KIND_CNI = 4;
  OPERATION_KIND_SHUTDOWN = 5;
  // CA_ROTATION replaces the Talos API and Kubernetes API CAs (ADR 0063).
  OPERATION_KIND_CA_ROTATION = 6;
  // CONFIG applies the pending reboot-requiring configuration changes, one
  // machine at a time with a reboot each (ADR 0080).
  OPERATION_KIND_CONFIG = 7;
  // NODE runs one NodeAction on one machine (ADR 0085).
  OPERATION_KIND_NODE = 8;
  // ETCD_RESTORE rewinds the whole cluster to a stored etcd snapshot (ADR 0089).
  OPERATION_KIND_ETCD_RESTORE = 9;
}

// EtcdRestoreRequest names the snapshot of an etcd-restore plan or create (ADR 0089). Starting
// it needs the cluster's name typed and a break-glass reason: it rewinds the whole cluster.
message EtcdRestoreRequest {
  // backup is the TalosEtcdBackup whose storage holds the snapshot.
  ObjectRef backup = 1;
  // snapshot is the object name of the snapshot, as listed in the backup's status (ListEtcdBackups).
  string snapshot = 2;
  // confirm is the cluster's name, typed.
  string confirm = 3;
  // break_glass is required: the reason goes to the audit record and the Event on the cluster
  // (ADR 0065), and the caller must hold the break-glass verb on the TalosCluster.
  BreakGlass break_glass = 4;
}

// NodeAction is what a node-kind operation does to its one machine (ADR 0085).
enum NodeAction {
  NODE_ACTION_UNSPECIFIED = 0;
  NODE_ACTION_REBOOT = 1;
  NODE_ACTION_SHUTDOWN = 2;
  NODE_ACTION_RESTART_SERVICE = 3;
  NODE_ACTION_ETCD_DEFRAG = 4;
  NODE_ACTION_ETCD_FORFEIT_LEADERSHIP = 5;
  // RESET removes the machine through the removal flow and wipes the node (ADR 0042).
  NODE_ACTION_RESET = 6;
  // REMOVE is only planned here: CreateOperation refuses it, MachineService.RemoveMachine
  // does it (a delete of the TalosMachine, which removes its etcd member, ADR 0032).
  NODE_ACTION_REMOVE = 7;
}

// NodeActionRequest names the machine and the action of a node-kind plan or create.
message NodeActionRequest {
  ObjectRef machine = 1;
  NodeAction action = 2;
  // service is the Talos service to restart: kubelet, containerd or cri.
  string service = 3;
  // allow_leader lets etcd-defrag run on the leader of a multi-member etcd.
  bool allow_leader = 4;
  // confirm is the machine's name, typed, for reset (and remove).
  string confirm = 5;
  // break_glass is required for reset: the reason, checked against the break-glass
  // verb on the machine (ADR 0065).
  BreakGlass break_glass = 6;
}

// OperationMachine is TalosOperation.status.machines[] as it is: a machine
// that does not appear has not been reached (or is held).
message OperationMachine {
  string name = 1;
  // phase is InProgress or Completed.
  string phase = 2;
  // --- operation detail page ---
  // message is why the machine's step failed, when it did; step is the operation's stage while
  // the machine is InProgress (Kubernetes and CA-rotation stages), empty otherwise.
  string step = 10;
  string message = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp finished_at = 13;
  // display_name is the machine's hostname, else its node name, else empty (callers show name).
  // Filled by GetOperation only.
  string display_name = 14;
}

message Operation {
  ObjectRef ref = 1;
  ObjectRef cluster = 2;
  OperationKind kind = 3;
  bool paused = 4;
  int32 max_unavailable = 5;
  // phase is Pending, InProgress, Paused, ShutDown or Completed; empty before
  // the controller has seen the operation.
  string phase = 6;
  // failure_reason is set when the operation paused itself because a
  // machine's step failed; paused with no failure_reason was the operator.
  string failure_reason = 7;
  repeated OperationMachine machines = 8;
  repeated Condition conditions = 9;
  google.protobuf.Timestamp created_at = 10;
  // ca_rotation_stage is status.caRotation.stage of a ca-rotation operation
  // (Accepting, AwaitingCredentials, Issuing, Dropping, Finalizing, Done); empty before the new CAs
  // are saved, and for every other kind.
  string ca_rotation_stage = 11;
  // node_action, node_machine and node_message describe a node-kind operation: what it
  // does, to which machine, and what it is doing or waiting for now.
  NodeAction node_action = 12;
  ObjectRef node_machine = 13;
  string node_message = 14;
  // kubernetes_stage is status.kubernetes.stage of a kubernetes operation (APIServers,
  // ControlPlaneComponents, KubeProxy, Kubelets); empty before the first stage is recorded, and for every other kind.
  string kubernetes_stage = 15;
  // etcd_restore_* describe an etcd-restore operation: the step it is in (Wiping, Recovering,
  // Rejoining, Reconciling), the backup and snapshot it restores, when the snapshot was taken,
  // and what it is doing or waiting for now.
  string etcd_restore_step = 16;
  ObjectRef etcd_restore_backup = 17;
  string etcd_restore_snapshot = 18;
  google.protobuf.Timestamp etcd_restore_snapshot_time = 19;
  string etcd_restore_message = 20;

  // --- operation detail page ---
  // summary is one human sentence built from the kind and the spec ("Reboot node talos-02").
  string summary = 40;
  // details are the spec's facts as key/value pairs, in display order.
  repeated OperationDetail details = 41;
  // started_by is who created the operation, when Ichor recorded it; empty otherwise.
  string started_by = 42;
  google.protobuf.Timestamp finished_at = 43;
}

message OperationDetail {
  string key = 1;
  string value = 2;
}

message ListOperationEventsRequest {
  ObjectRef operation = 1;
}

message OperationEvent {
  google.protobuf.Timestamp time = 1;
  // type is Normal or Warning.
  string type = 2;
  string reason = 3;
  string message = 4;
  string object_kind = 5;
  string object_name = 6;
}

message ListOperationEventsResponse {
  repeated OperationEvent events = 1;
}

message ListOperationsRequest {
  // cluster narrows the list; unset lists every operation the caller may list.
  ObjectRef cluster = 1;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
}

message GetOperationRequest {
  ObjectRef operation = 1;
}

message GetOperationResponse {
  Operation operation = 1;
}

// OperationEffect is what the operation does to each machine it reaches.
enum OperationEffect {
  OPERATION_EFFECT_UNSPECIFIED = 0;
  // REBOOT: the machine is upgraded and restarts.
  OPERATION_EFFECT_REBOOT = 1;
  // RESTART_COMPONENTS: configuration is applied without a reboot; kubelet
  // and control plane components restart.
  OPERATION_EFFECT_RESTART_COMPONENTS = 2;
  // STOP: the machine is powered down and stays down until a person starts it.
  OPERATION_EFFECT_STOP = 3;
  // NONE: no machine is touched (an Ichor self-upgrade runs as a Job).
  OPERATION_EFFECT_NONE = 4;
  // CA_ROTATION: every machine is reconfigured once per stage (no reboot); the
  // kubelet restarts on each machine in the stages that change the Kubernetes CA.
  OPERATION_EFFECT_CA_ROTATION = 5;
}

message PlannedMachine {
  string name = 1;
  string role = 2; // controlplane or worker
  // step is 1-based; machines with the same step may be handled together.
  int32 step = 3;
  // reboot_fields are the configuration field paths whose pending change needs
  // the reboot (config kind only; TalosMachine.status.rebootPaths).
  repeated string reboot_fields = 4;
}

message PlanOperationRequest {
  ObjectRef cluster = 1;
  OperationKind kind = 2;
  // target is the version to move to (talos, kubernetes, ichor), the kube-proxy
  // mode "enabled" or "replaced" (cni), and must be empty for shutdown,
  // ca-rotation and config. For
  // the kinds with a version or mode, empty means "the cluster's spec already
  // says it": the operation is created without changing the spec.
  string target = 3;
  // max_unavailable is how many workers would be handled at once; 0 is the
  // CRD default (1).
  int32 max_unavailable = 4;
  // node is required for kind NODE (cluster may then be left unset: it is the machine's).
  NodeActionRequest node = 5;
  // etcd_restore is required for kind ETCD_RESTORE.
  EtcdRestoreRequest etcd_restore = 6;
}

message PlanOperationResponse {
  OperationEffect effect = 1;
  // machines are in the order they are handled.
  repeated PlannedMachine machines = 2;
  // held are approved machines a rollout skips (upgrade-hold annotation).
  repeated string held = 3;
  // max_unavailable is how many workers are handled at once.
  int32 max_unavailable = 4;
  // current is what the spec says now (version or mode); target is what it
  // would say.
  string current = 5;
  string target = 6;
  // spec_changes is true when CreateOperation would change a spec first.
  bool spec_changes = 7;
  // blocked is non-empty when CreateOperation would be refused, and says why.
  string blocked = 8;
  // stages are the passes a ca-rotation makes over every machine, in order;
  // empty for the other kinds.
  repeated string stages = 9;
  // replaces_secrets_bundle is true when the operation ends by replacing the
  // cluster's secrets bundle, so the copy on the user's machine is stale and
  // `ichor cluster bundle-export` is needed.
  bool replaces_secrets_bundle = 10;
  // kubernetes_api_unavailable is true when a machine reboots while it is the
  // cluster's only approved control plane, so the Kubernetes API is down for
  // the length of the reboot.
  bool kubernetes_api_unavailable = 11;
  // steps, warning, confirm_name and break_glass_required describe a node action in plain
  // English: what happens in order, what the user should know first, the name they must type
  // (empty when no typing is needed), and whether a break-glass reason is needed.
  repeated string steps = 12;
  string warning = 13;
  string confirm_name = 14;
  bool break_glass_required = 15;
  // snapshot_time is when the snapshot an etcd restore would put back was taken; everything after it is lost.
  google.protobuf.Timestamp snapshot_time = 16;
  // Deprecated: GitOps is no longer part of Ichor (docs/adr/0101). Never set; kept so the wire format is unchanged.
  bool opens_pull_request = 17 [deprecated = true];
  // current_schematic and target_schematic are set for a Talos upgrade whose Image Factory schematic
  // differs between at least one approved machine's running system and spec.schematic (ADR 0023,
  // Amendment). current_schematic is the first differing running schematic; target_schematic is
  // spec.schematic.id (the Talos default schematic when unset). Both are empty otherwise.
  string current_schematic = 18;
  string target_schematic = 19;
}

message CreateOperationRequest {
  ObjectRef cluster = 1;
  OperationKind kind = 2;
  // target: see PlanOperationRequest.
  string target = 3;
  // max_unavailable caps parallel workers; 0 keeps the CRD default.
  int32 max_unavailable = 4;
  NodeActionRequest node = 5;
  EtcdRestoreRequest etcd_restore = 6;
}

message CreateOperationResponse {
  Operation operation = 1;
  AuditRecord audit = 2;
  // spec_changed is true when the cluster's (or the installation's) spec was
  // changed to the target before the operation was created.
  bool spec_changed = 3;
  // Deprecated: GitOps is no longer part of Ichor (docs/adr/0101). Never set; kept so the wire format is unchanged.
  string pull_request_url = 4 [deprecated = true];
}

message SetOperationPausedRequest {
  ObjectRef operation = 1;
  bool paused = 2;
}

message SetOperationPausedResponse {
  Operation operation = 1;
  AuditRecord audit = 2;
}

message DeleteOperationRequest {
  ObjectRef operation = 1;
}

message DeleteOperationResponse {
  AuditRecord audit = 1;
}

message DownloadCARotationCredentialsRequest {
  ObjectRef operation = 1;
  // lifetime_seconds is how long the certificates in the files are valid (ADR 0108). 0 means one year,
  // which is also the maximum. A CA-rotation hand-off must outlive the rotation.
  int64 lifetime_seconds = 2;
  // read_only makes the talosconfig os:reader instead of os:admin.
  bool read_only = 3;
}

message DownloadCARotationCredentialsResponse {
  // filename and content_type are set on the first chunk only.
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message AcknowledgeCARotationCredentialsRequest {
  ObjectRef operation = 1;
}

message AcknowledgeCARotationCredentialsResponse {
  Operation operation = 1;
  AuditRecord audit = 2;
}
