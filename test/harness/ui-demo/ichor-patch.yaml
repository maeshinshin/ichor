# Applied after the control plane is approved (a reboot-free sysctl, so the patch screen has something in it).
apiVersion: ichor.maesh.dev/v1alpha1
kind: TalosConfigPatch
metadata:
  name: demo-sysctl
  namespace: ichor-system
spec:
  clusterRef:
    name: ichor-ui-demo
  layer: cluster
  documents:
    - kind: SysctlConfig
      sysctlConfig:
        params:
          net.core.somaxconn: "1024"
