# Applied to the INNER demo cluster: reaches ichor-ui on node port 30080 so the outer
# Service ichor-ui-demo (port 443 -> 30080) can forward to the control plane VM. ichor-ui serves
# HTTPS only on 8443 (docs/adr/0105), so the L4 passthrough carries TLS straight to it.
apiVersion: v1
kind: Service
metadata:
  name: ichor-ui-nodeport
  namespace: ichor-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ichor
    control-plane: ui-backend
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: 30080
