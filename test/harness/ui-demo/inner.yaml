# Applied to the INNER demo cluster (never the outer one). The controller and ichor-ui run
# as plain busybox pods whose init container downloads the statically built binaries from
# the tools pod (TOOLS_IP:8000) - there is no image registry for these builds.
#
# ichor-ui has OIDC off here (no --oidc-issuer): anyone who can reach its port can read
# AND write every Ichor CR through the ichor-ui ServiceAccount. Demo only.
#
# The controller runs with ENABLE_WEBHOOKS=false (the inner apiserver could not dial a
# webhook) and cluster-admin (demo shortcut; the real ClusterRole is
# config/rbac/role.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: ichor-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ichor-controller
  namespace: ichor-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ichor-controller-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ichor-controller
    namespace: ichor-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ichor-controller
  namespace: ichor-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: ichor-controller}
  template:
    metadata:
      labels: {app: ichor-controller}
    spec:
      serviceAccountName: ichor-controller
      initContainers:
        - name: fetch
          image: busybox:1.37
          command: ["sh", "-c", "wget -q -O /dl/manager http://TOOLS_IP:8000/manager && chmod +x /dl/manager"]
          volumeMounts: [{name: dl, mountPath: /dl}]
      containers:
        - name: manager
          image: busybox:1.37
          command: ["/dl/manager", "--health-probe-bind-address=:8081"]
          env:
            - {name: ENABLE_WEBHOOKS, value: "false"}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_SERVICE_ACCOUNT
              valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}
          volumeMounts: [{name: dl, mountPath: /dl}]
      volumes:
        - {name: dl, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ichor-ui
  namespace: ichor-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: ichor-ui}
  template:
    metadata:
      labels: {app: ichor-ui}
    spec:
      serviceAccountName: ichor-ui
      initContainers:
        - name: fetch
          image: busybox:1.37
          command: ["sh", "-c", "wget -q -O /dl/ichor-ui http://TOOLS_IP:8000/ichor-ui && chmod +x /dl/ichor-ui"]
          volumeMounts: [{name: dl, mountPath: /dl}]
      containers:
        - name: ichor-ui
          image: busybox:1.37
          command: ["/dl/ichor-ui", "--addr=:8080"]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          volumeMounts: [{name: dl, mountPath: /dl}]
      volumes:
        - {name: dl, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: ichor-ui-nodeport
  namespace: ichor-system
spec:
  type: NodePort
  selector: {app: ichor-ui}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30080}
