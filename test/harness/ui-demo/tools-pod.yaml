# A plain pod in ichor-e2e that holds the binaries the demo needs (kubectl, ichor,
# the controller, ichor-ui) and serves them over HTTP :8000, so pods on the inner
# cluster can fetch them in an init container: there is no image registry for
# these builds and no docker here. Everything is named ichor-ui-demo-*.
apiVersion: v1
kind: Pod
metadata:
  name: ichor-ui-demo-tools
  namespace: ichor-e2e
  labels:
    ichor.maesh.dev/e2e-harness: kubevirt-ui-demo
spec:
  restartPolicy: Never
  containers:
    - name: tools
      image: busybox:1.37
      command: ["sh", "-c", "mkdir -p /srv && exec httpd -f -p 8000 -h /srv"]
